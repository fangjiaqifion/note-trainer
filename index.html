     但不需要被搜索引擎收录：noindex 让爬虫不要建索引，

<meta property="og:title" content="识谱小练习 · 第一单元 B C D">
<meta property="og:description" content="每天 3 分钟：音名 → 键盘 → 五线谱 → 时值 → 指法。四关、三档难度、可离线。">

<meta name="twitter:image" content="https://fangjiaqifion.github.io/note-trainer/og-cover.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  /* 版式与配色的唯一来源。改颜色改这里，不要在下面各处写死色值。
     页面按「首页 / 游戏页 / 结算页」三块排，都是整屏切换，
     所以 .screen 只切 active 类，不做路由也不做动画。 */
  :root{
    --bg:#FFF7EC; --ink:#2B2A33; --muted:#8B8175;
    --card:#FFFFFF; --line:#EADDCB;
    --blue:#3C7DD9; --orange:#F29B38; --green:#3FA96F; --red:#DE6A5F; --purple:#8E5AA8;
    /* 指法数字与卡通手上「竖起的那根手指」共用这个颜色，
       孩子在谱面和选项之间能看出「说的就是同一个东西」。 */
    --finger:#C2528C;
    --shadow:0 6px 0 rgba(180,150,110,.16), 0 14px 30px rgba(140,105,60,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); overscroll-behavior:none;
  }
  button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
  #app{
    position:fixed;inset:0;display:flex;flex-direction:column;z-index:1;
    padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);
  }
  .screen{display:none;flex:1;min-height:0;flex-direction:column}
  .screen.active{display:flex}

  /* ---------- 节日装饰 ---------- */
  .decor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none}
  body.halloween .decor{display:block}
  .decor span{position:absolute;opacity:.32;filter:saturate(.95);will-change:transform}
  .decor .witch{position:absolute;width:96px;height:auto;color:#2B2A33;opacity:.22;animation:fly 46s linear infinite}
  .decor .witch.w2{width:64px;opacity:.15;animation-duration:62s;animation-delay:-20s}
  .decor .witch.w3{width:112px;opacity:.12;animation-duration:53s;animation-delay:-34s}
  @keyframes fly{
    0%{transform:translate(-12vw,0) rotate(-6deg)}
    50%{transform:translate(50vw,7vh) rotate(7deg)}
    100%{transform:translate(112vw,2vh) rotate(-4deg)}
  }
  .decor .corner{font-size:44px;bottom:2%;animation:bob 4s ease-in-out infinite}
  .decor .corner.c1{left:1.5%}
  .decor .corner.c2{right:1.5%;animation-delay:-2s}
  body.in-play .decor .corner{display:none}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}

  .fx{position:fixed;inset:0;pointer-events:none;z-index:70}
  .confetti{position:absolute;animation:burst .95s ease-out forwards;will-change:transform,opacity}
  @keyframes burst{
    0%{transform:translate(0,0) rotate(0deg) scale(.7);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1.1);opacity:0}
  }

  /* ---------- 首页 ---------- */
  .home-head{padding:26px 24px 4px;text-align:center}
  .home-head h1{font-size:32px;margin:0;letter-spacing:3px;font-weight:800}
  .home-head .sub{margin:8px 0 0;color:var(--muted);letter-spacing:8px;font-size:15px;font-weight:600}
  .levels{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 20px;align-content:center;grid-auto-rows:minmax(0,196px);min-height:0;overflow-y:auto}
  /* 五关：前四关两列，第五关居中，避免最后一格空着、整页看着缺一块 */
  .level-card:nth-child(5){grid-column:1 / -1;justify-self:center;width:calc(50% - 7px)}
  .level-card{
    display:flex;flex-direction:column;gap:8px;text-align:left;
    background:var(--card);border:2px solid var(--line);border-radius:24px;padding:16px 18px;
    box-shadow:var(--shadow);transition:transform .1s;
  }
  .level-card:active{transform:scale(.975)}
  .lv-top{display:flex;align-items:center;gap:10px}
  .lv-num{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:21px;color:#fff;flex:none}
  .lv-title{font-size:19px;font-weight:800;line-height:1.2}
  .lv-desc{font-size:13px;color:var(--muted);line-height:1.45;margin:0}
  .lv-stars{font-size:17px;letter-spacing:2px;color:#E7D3A5;margin-top:auto}
  .lv-stars .on{color:#EFB63F}
  body.halloween .lv-stars .on{color:#E98A3C}
  .home-foot{padding:4px 20px 16px;display:flex;justify-content:center;gap:10px}
  .ghost-btn{font-size:14px;color:var(--muted);padding:10px 18px;border-radius:14px;border:2px solid var(--line);background:#fff}

  /* ---------- 游戏页 ---------- */
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 16px 2px}
  .icon-btn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:19px;display:grid;place-items:center;flex:none}
  .level-tag{font-size:15px;font-weight:700;color:var(--muted)}
  .dots{display:flex;gap:6px;margin-left:auto}
  .dot{width:9px;height:9px;border-radius:50%;background:#E7DAC7;transition:.2s}
  .dot.done{background:var(--green)}
  .dot.now{background:var(--orange);transform:scale(1.35)}
  body.halloween .dot.done{background:#8E5AA8}
  .prompt{display:flex;align-items:center;justify-content:center;gap:10px;padding:4px 18px 2px;min-height:56px}
  .prompt-text{font-size:clamp(21px,3vw,30px);font-weight:800;text-align:center;line-height:1.25}
  .speak-btn{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:16px;flex:none}
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 14px}
  .stage.letter{flex-direction:column;justify-content:flex-end;gap:10px;padding-bottom:22px}
  .answer{display:flex;justify-content:center;align-items:center;gap:14px;padding:6px 14px 14px;flex-wrap:wrap}
  .answer.opts{gap:12px}
  .answer.hold{flex-direction:column;gap:8px}
  .stack{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:980px}
  .cards-row{display:flex;gap:14px;width:100%;justify-content:center}

  .big-letter{font-size:clamp(84px,15vw,150px);font-weight:900;line-height:1;color:var(--blue);letter-spacing:6px;text-shadow:0 8px 0 #E4EDFA}
  body.halloween .big-letter{color:#7B4B96;text-shadow:0 8px 0 #EDE1F4}
  .down-arrow{font-size:44px;color:#D9C6A6;line-height:1;animation:bob 1.6s ease-in-out infinite}
  .qmark{font-size:clamp(70px,12vw,120px);font-weight:900;color:#E7DAC7}

  .staff{width:100%;height:auto;max-width:840px;max-height:42vh;display:block}
  .paper{width:auto;max-width:100%;display:inline-block;background:#fff;border:2px solid var(--line);border-radius:24px;padding:10px 12px;box-shadow:0 10px 26px rgba(150,110,60,.09)}
  .paper .staff{height:38vh;width:auto;max-height:none;max-width:100%}
  /* 同一屏既有谱面又有键盘时（第 2、3、4 关），谱面收小一点，
     否则 iPad 竖屏上键盘会被挤到屏幕外面。类由 makeKB 加上。 */
  #play.with-kb .paper .staff{height:30vh}

  /* 键盘 */
  .kb-wrap{width:100%;max-width:980px;margin:0 auto}
  /* 中央 C 的图例：黄点画在键上，说明写在键盘右上角。
     单独占一行、右对齐，不压键盘也不挡键。 */
  .kb-legend{display:flex;justify-content:flex-end;align-items:center;padding:0 4px 6px}
  .kb-legend span{display:flex;align-items:center;gap:5px;background:#FFF3E2;border:1.5px solid #F1D6B2;border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:700;color:#A96C22;line-height:1.1}
  .kb-legend .lg-dot{width:9px;height:9px;border-radius:50%;background:var(--orange);flex:none}
  .kb{position:relative;width:100%;height:clamp(150px,23vh,235px);touch-action:none}
  .kb .w{position:absolute;top:0;bottom:0;background:linear-gradient(#FFFFFF,#FBF5E9);border:1.5px solid #D9CDBA;border-radius:0 0 10px 10px;box-shadow:inset 0 -8px 0 #EFE6D6;transition:background .08s}
  .kb .w.on{background:linear-gradient(#FFE7C2,#FFD79E)}
  .kb .w.correct{background:linear-gradient(#D3F2E2,#A6E2C3);border-color:#3FA96F}
  .kb .w.wrong{animation:shake .35s}
  .kb .w.hint::after{content:"";position:absolute;inset:4px;border-radius:8px;border:3px dashed var(--orange);animation:fade 1s infinite}
  .kb .w.target{background:linear-gradient(#FFE7C2,#FFCF8A);box-shadow:inset 0 0 0 3px var(--orange), inset 0 -8px 0 #F2C58C;animation:pulse 1.3s infinite}
  .kb .w .middot{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:var(--orange);opacity:.9}
  .kb .w .lbl{position:absolute;bottom:11px;left:0;right:0;text-align:center;font-size:13px;font-weight:700;color:#A8977F}
  .kb .b{position:absolute;top:0;height:62%;background:linear-gradient(#3B3A44,#26252D);border-radius:0 0 6px 6px;box-shadow:inset 0 -5px 0 #16161B, 0 2px 4px rgba(0,0,0,.25);z-index:2;transition:background .08s}
  .kb .b.on{background:linear-gradient(#5C5A6B,#3B3A44)}
  .kb .b.wrong{animation:shake .35s}
  .kb .b.target{background:linear-gradient(#F2B45F,#E08F2C);box-shadow:inset 0 -5px 0 #B8721F}
  .kb .b.hint::after{content:"";position:absolute;inset:3px;border-radius:5px;border:3px dashed var(--orange)}

  .opt{width:clamp(78px,11vw,108px);height:clamp(84px,11vw,112px);border-radius:26px;background:#fff;border:2px solid var(--line);box-shadow:0 5px 0 #EADDCB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .08s,box-shadow .08s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #EADDCB}
  .opt .num{font-size:clamp(28px,4vw,36px);font-weight:800;line-height:1}
  .opt .unit{font-size:12px;color:var(--muted);font-weight:600}
  .opt .pips{font-size:8px;letter-spacing:1px;color:#E2B45C;height:10px}
  .opt.correct{border-color:var(--green);background:#EFFAF4;box-shadow:0 5px 0 #BFE6D2}
  .opt.wrong{border-color:var(--red);background:#FDF1F0;box-shadow:0 5px 0 #F3CFCB;animation:shake .35s}
  /* 第 5 关的选项是卡通手，卡片比数字选项高一点，才放得下整只手 */
  .opt.hand{width:clamp(104px,15vw,140px);height:clamp(126px,17vw,160px);gap:2px}
  .opt.finger{width:clamp(94px,13vw,120px);height:clamp(126px,17vw,160px);gap:2px}
  /* 第 3 关的谱号选项：谱号本身就是图，只配一个名字 */
  .opt.clef{width:clamp(104px,15vw,140px);height:clamp(126px,17vw,160px);gap:4px}
  .opt.clef .cleficon{width:auto;display:block}
  /* 两种谱号天生比例不同：高音谱号细长、低音谱号宽扁。
     高度分开定，图标看起来分量才接近。 */
  .opt.clef .cleficon.treble{height:clamp(74px,11vw,96px)}
  .opt.clef .cleficon.bass{height:clamp(58px,9vw,76px)}
  .opt.clef .unit{font-size:13px;font-weight:700;color:#6B6156}
  .opt.hand svg,.opt.finger svg{width:clamp(72px,11.5vw,96px);height:auto;display:block;margin-bottom:2px}
  .opt.hand .unit,.opt.finger .unit{font-size:13px;font-weight:700;color:#6B6156}
  .opts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}

  .card-btn{flex:1 1 0;max-width:31%;background:#fff;border:2px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 5px 0 #EADDCB;transition:transform .08s}
  .card-btn:active{transform:translateY(3px)}
  .card-btn svg{width:100%;height:auto;display:block}
  .card-btn.correct{border-color:var(--green);background:#F2FBF6;box-shadow:0 5px 0 #BFE6D2}
  .card-btn.wrong{border-color:var(--red);background:#FDF1F0;box-shadow:0 5px 0 #F3CFCB;animation:shake .35s}

  .beat-box{display:flex;flex-direction:column;align-items:center;gap:8px}
  /* 不告诉孩子拍数时用这一个圆：按下后从 0 开始，每过一拍加 1。
     它只显示「已经按住几拍」，不透露「应该按住几拍」。 */
  .beat-live{width:66px;height:66px;border-radius:50%;border:3px solid var(--line);background:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;color:#C9B99F;transition:.12s}
  .beat-live.on{border-color:var(--orange);color:var(--orange);background:#FFF6E8;transform:scale(1.04);box-shadow:0 4px 0 rgba(220,140,40,.22)}
  .beat-cap{font-size:15px;color:var(--muted);font-weight:600;text-align:center;line-height:1.4;min-height:21px}

  .toast{position:fixed;left:50%;top:16.5%;transform:translate(-50%,-50%) scale(.85);opacity:0;pointer-events:none;background:#fff;border-radius:22px;padding:16px 28px;font-size:24px;font-weight:800;box-shadow:0 18px 40px rgba(90,60,20,.18);transition:opacity .16s,transform .16s;z-index:75;text-align:center;line-height:1.3;max-width:88vw}
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .toast.ok{color:var(--green)}
  .toast.bad{color:var(--red)}

  .res-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px}
  .res-stars{font-size:64px;letter-spacing:8px;color:#E7D3A5}
  .res-stars .on{color:#EFB63F;text-shadow:0 6px 0 #F7E2B8}
  body.halloween .res-stars .on{color:#E98A3C}
  .res-title{font-size:30px;font-weight:800}
  .res-sub{color:var(--muted);font-size:16px;text-align:center;line-height:1.5}
  .res-btns{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;justify-content:center}
  .primary-btn{background:var(--blue);color:#fff;font-size:18px;font-weight:700;padding:16px 28px;border-radius:18px;box-shadow:0 5px 0 #2F66B5}
  .primary-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2F66B5}
  .secondary-btn{background:#fff;color:var(--ink);font-size:18px;font-weight:700;padding:16px 24px;border-radius:18px;border:2px solid var(--line);box-shadow:0 5px 0 #EADDCB}

  .modal{position:fixed;inset:0;background:rgba(50,35,15,.35);display:none;align-items:flex-end;justify-content:center;z-index:80}
  .modal.open{display:flex}
  .sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.15)}
  .sheet h2{margin:0 0 6px;font-size:20px}
  .sheet .hint{color:var(--muted);font-size:13px;margin:0 0 10px;line-height:1.5}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid #F3EADC}
  .row .name{font-size:16px;font-weight:600}
  .row .desc{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
  .toggle{width:64px;height:36px;border-radius:18px;background:#E7DAC7;position:relative;transition:.15s;flex:none}
  .toggle i{position:absolute;top:3px;left:3px;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.15s}
  .toggle.on{background:var(--green)}
  .toggle.on i{left:31px}
  .seg{display:flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;flex:none}
  .seg button{padding:8px 13px;font-size:14px;font-weight:700;color:var(--muted)}
  .seg button.on{background:var(--blue);color:#fff}
  .sheet-foot{display:flex;gap:10px;margin-top:16px}
  .sheet-foot button{flex:1;padding:14px;border-radius:16px;font-weight:700;font-size:16px}

  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  @keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
  @keyframes fade{0%,100%{opacity:1}50%{opacity:.35}}

  @media (max-width:520px){
    .levels{grid-template-columns:1fr;gap:10px;padding:10px 14px;grid-auto-rows:minmax(0,124px);align-content:start}
    .level-card:nth-child(5){grid-column:auto;justify-self:stretch;width:auto}
    .lv-desc{display:none}
    .home-head h1{font-size:26px}
    /* 手机屏窄，24px 的提示语会折成三四行、盖住谱面 */
    .toast{font-size:20px;padding:13px 20px;max-width:92vw}
  }
  @media (orientation:landscape) and (max-height:560px){
    .home-head{padding-top:10px}
    .levels{gap:10px;grid-auto-rows:minmax(0,150px)}
    .lv-desc{display:none}
    .lv-num{width:34px;height:34px;font-size:17px}
  }
</style>
</head>
<body>

<div class="decor" aria-hidden="true">

<script>
(function(){
'use strict';

/* =====================================================================
   识谱小练习 · note-trainer
   ---------------------------------------------------------------------
   单文件网页：样式、脚本、谱号路径、题库全在这一个 index.html 里。
   没有构建、没有依赖、没有网络请求，放到任何静态托管都能跑。

   代码分五层，从上往下读即可：
     1. 配置层  NOTES / VALUES / UNIT / LEVELS / DIFFS
                换单元、加音、改难度只动这里，不要动下面的渲染逻辑。
     2. 渲染层  staffSVG（五线谱）、buildKeyboard（键盘）、handSVG（卡通手）
                只负责把数据画成 SVG / DOM，不判断对错。
     3. 题型层  qFindKey / qStaffToKey / qKeyToStaff / qClef /
                qBeats / qWhichShape / qPlayNote
                每个工厂返回 { kind, render(), reveal() }，
                render 才绑定交互，reveal 是错够次数后的提示。
                「按住」这一段由 holdPad 提供，第 4、5 关共用；
                qPlayNote 自己分三段（手 → 指 → 按住），前两段不判整题。
     4. 流程层  judge / renderQuestion / buildQuestions / startLevel /
                finishLevel
                管对错、连击、换题、结算；渲染层和题型层都不碰这里。
     5. 外围    localStorage 存档、Web Audio 发声、语音念题、
                节日装饰、离线缓存

   三条贯穿全文件的约定：
     · 时间统一用 beat 的倍数（60000 / bpm 是一拍多少毫秒），
       不写死毫秒，难度切换后速度自然跟着变。
     · 异步回调里一律先比较 G.session，会话过期就丢弃结果，
       否则退出关卡后旧定时器还会改状态，出现「幽灵判题」。
     · 判对判错都走 judge()，不要在题型里直接改 G。
   ===================================================================== */

/* ==================== 基础 ==================== */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const randInt = n => Math.floor(Math.random() * n);
const pick = a => a[randInt(a.length)];
const delay = (ms, fn) => setTimeout(fn, ms);
function shuffle(a){
  a = a.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = randInt(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
/* 把一串字母重排成「不连着出现同一个」的顺序。
   先洗牌，再把重复处和别处交换；修完还有重复就重新洗一次再修。
   第 1 关只有 B、C、D，纯洗牌经常连出三个 C，
   孩子会觉得「怎么又是这个」。 */
function spreadLetters(list){
  function hasRun(a, i){
    return (i > 0 && a[i] === a[i-1]) || (i + 1 < a.length && a[i] === a[i+1]);
  }
  function hasAnyRun(a){
    for(let i = 1; i < a.length; i++){ if(a[i] === a[i-1]) return true; }
    return false;
  }
  /* 把每一处重复和另一个不同的字母对调，要求对调后两处附近都不重复。 */
  function repair(a){
    for(let pass = 0; pass < 8; pass++){
      let moved = false;
      for(let i = 1; i < a.length; i++){
        if(a[i] !== a[i-1]) continue;
        for(let j = 0; j < a.length; j++){
          if(j === i || j === i - 1 || a[j] === a[i-1]) continue;
          const t = a[i]; a[i] = a[j]; a[j] = t;
          if(!hasRun(a, i) && !hasRun(a, j)){ moved = true; break; }
          const u = a[i]; a[i] = a[j]; a[j] = u;
        }
      }
      if(!moved) break;
    }
    return a;
  }
  let a = repair(shuffle(list));
  /* 少数牌型一次修不干净，换一个洗牌结果再修；修不好就返回当前这个。 */
  for(let t = 0; t < 20 && hasAnyRun(a); t++){ a = repair(shuffle(list)); }
  return a;
}

/* 十二平均律的音级表，一个八度内 C 到 B。
   midi 音高除以 12 取余就得到音级，负数的余数要先 +12 转正。 */
const LETTERS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const letterOf = m => LETTERS[((m % 12) + 12) % 12];
/* 一个八度里 7 个白键相对 C 的半音数：C D E F G A B。
   有它才能从一个白键序号反推 midi，键盘就不用逐个手写。 */
const WHITE_OFF = [0,2,4,5,7,9,11];

/* ---------------------------------------------------------------------
   当前单元。换单元只改这三处：往 NOTES 里加音、把 id 放进 UNIT.notes、
   必要时登记 LEDGER 加线。关卡会按 NOTE_IDS 自动扩到新音。

   每个音七个字段：
     id      内部键名，和文件名、题库里用的字符串一致
     letter  音名，第 1 关按它出题，只比音级不比音组
     label   中文说明，判对时的提示语用
     midi    MIDI 音高，59=B3、60=中央 C、62=D4；发声和键盘定位都靠它
     clef    用哪个谱号画，'treble' 或 'bass'
     y       在谱表上的纵向位置，单位是「线距」，见 staffSVG 的坐标说明
     hand    'L' 左手 / 'R' 右手；渲染时直接决定符杆朝上还是朝下
     finger  指法数字，第 5 关写在音符外侧

   目前是 B3、C4、D4：B 用低音谱号（上加一间），中央 C 与 D 用高音谱号。 */
const NOTES = {
  B3: { id:'B3', letter:'B', label:'B',      midi:59, clef:'bass',   y:-0.5, hand:'L', finger:2 },
  C4: { id:'C4', letter:'C', label:'中央 C', midi:60, clef:'treble', y:5.0,  hand:'R', finger:1 },
  D4: { id:'D4', letter:'D', label:'D',      midi:62, clef:'treble', y:4.5,  hand:'R', finger:2 }
};
/* 单元标题只影响首页副标题，真正出题用的是 notes 数组。 */
const UNIT = { name:'第一单元', label:'B · 中央 C · D', notes:['B3','C4','D4'] };
const NOTE_IDS = UNIT.notes;
/* 需要加线的音登记在这里：{ 谱号: { 音 id: 加线的 y 位置 } }。
   中央 C 在高音谱号下加一线，所以是 5；低音谱号当前没有加线音。
   漏登记的表现是：音符漂浮在谱表外，没有那条短横线。 */
const LEDGER = { treble: { C4: 5 }, bass: {} };

/* 四种时值。beats 是拍数，也是判题依据；
   filled / stem / dot 描述符头要不要实心、有没有符杆、有没有附点，
   staffSVG 按这三个开关画形状，所以加新时值不用改绘图代码。 */
const VALUES = {
  quarter: { id:'quarter', beats:1, name:'四分音符',   filled:true,  stem:true,  dot:false },
  half:    { id:'half',    beats:2, name:'二分音符',   filled:false, stem:true,  dot:false },
  dotted:  { id:'dotted',  beats:3, name:'附点二分音符', filled:false, stem:true,  dot:true  },
  whole:   { id:'whole',   beats:4, name:'全音符',     filled:false, stem:false, dot:false }
};
const VALUE_IDS = ['quarter','half','dotted','whole'];

/* 五关的顺序就是教学顺序：认键 → 谱键互认 → 谱号 → 读谱与拍数 → 手、指、按住。
   首页卡片、关卡标题、结算文案都从这里取，不要另写一份。 */
const LEVELS = [
  { id:1, name:'找键盘', title:'键盘上的位置', desc:'音名对应哪个键', color:'#3C7DD9' },
  { id:2, name:'谱与键', title:'五线谱 ↔ 键盘', desc:'低音谱号与高音谱号', color:'#E08A2E' },
  { id:3, name:'谱号',   title:'用哪个谱号',   desc:'B 用低音谱号，中央 C 和 D 用高音谱号', color:'#2E9C8F' },
  { id:4, name:'时值',   title:'读谱与拍数',   desc:'读谱、找键、弹够时值', color:'#3FA96F' },
  { id:5, name:'读谱',   title:'手、指与拍数', desc:'先判手和指，再按住弹够时值', color:'#8E5AA8' }
];

/* 三档难度。options 是选项个数（按题型取值：时值题最多 4 个，谱例最多 3 张，
   第 5 关的指法题最多 3 只），hintAfter 是错几次给提示，
   bpm 决定「按住」时一拍有多长，count 是一关几题（第 5 关每题三段，取 count - 2）。 */
const DIFFS = {
  easy:   { key:'easy',   name:'轻松', options:2, hintAfter:1, bpm:52, count:8  },
  normal: { key:'normal', name:'标准', options:3, hintAfter:2, bpm:60, count:8  },
  hard:   { key:'hard',   name:'挑战', options:3, hintAfter:3, bpm:76, count:10 }
};

/* ==================== 设置与存档 ==================== */
/* 存档键名故意保留旧名 bcd-piano-game-v2，没有跟着游戏一起改名：
   改了就等于清空孩子已经拿到的星星。要迁移得先读旧键再写新键。 */
const STORE_KEY = 'bcd-piano-game-v2';
function loadStore(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e){ return {}; }
}
const S = Object.assign({ sound:true, speech:true, labels:false, decor:null, difficulty:'normal', stars:{} }, loadStore());
function saveStore(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){}
}
/* 2026-10-30 在第二关和第三关之间插了一关「谱号」，原来的 3、4 关
   变成 4、5 关。星星按关卡编号存，这里把旧编号整体往后挪一次；
   layout 标记防止每次打开都挪一遍。新插进来的第 3 关从 0 星开始。 */
if(S.layout !== 2){
  const old = S.stars || {};
  S.stars = { 1: old[1] || 0, 2: old[2] || 0, 4: old[3] || 0, 5: old[4] || 0 };
  S.layout = 2;
  saveStore();
}
function diff(){ return DIFFS[S.difficulty] || DIFFS.normal; }
function isHalloweenSeason(){
  const d = new Date();
  const m = d.getMonth(), day = d.getDate();
  return (m === 9 && day >= 10) || (m === 10 && day <= 2);
}
function decorOn(){
  return (S.decor === null) ? isHalloweenSeason() : !!S.decor;
}
function applyUnit(){
  const sub = document.getElementById('homeSub');
  if(sub) sub.textContent = UNIT.name + ' · ' + UNIT.label;
}

function applyDecor(){
  const on = decorOn();
  document.body.classList.toggle('halloween', on);
  const t = $('#homeTitle');
  if(t) t.textContent = on ? '🎃 识谱小练习 🎃' : '识谱小练习';
}

/* ==================== 声音 ====================
   全部用 Web Audio 实时合成，页面里没有音频文件。
   iOS 要求第一次发声必须发生在用户手势里，所以 init 时挂了一个
   一次性 pointerdown 把 AudioContext 唤醒（见文件末尾）。
   iPad 侧边静音开关会同时静音 Web Audio，听不到先看那个开关。 */
let AC = null;
function audioCtx(){
  if(!AC){
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return null;
    AC = new Ctor();
  }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
/* 弹一个短音。基频按十二平均律从 A4=440 反推：f = 440 * 2^((midi-69)/12)。
   音色用 4 个正弦泛音叠加（1、2、3、4 倍频，音量递减），
   比单个正弦更接近钢琴，又不用采样文件。 */
/* force 只在「试听」按钮里用：即使孩子把琴声关掉了，也要能试出声。 */
function playMidi(midi, dur, vol, force){
  if(!S.sound && !force) return;
  const c = audioCtx(); if(!c) return;
  dur = dur || 0.9; vol = (vol == null) ? 0.34 : vol;
  const t = c.currentTime + 0.005;
  const f = 440 * Math.pow(2, (midi - 69) / 12);
  const out = c.createGain();
  out.gain.setValueAtTime(0, t);
  out.gain.linearRampToValueAtTime(vol, t + 0.012);
  out.gain.exponentialRampToValueAtTime(0.0006, t + dur);
  out.connect(c.destination);
  [[1,1],[2,0.34],[3,0.13],[4,0.05]].forEach(function(p){
    const o = c.createOscillator();
    o.type = 'sine'; o.frequency.value = f * p[0];
    const g = c.createGain(); g.gain.value = p[1] * 0.55;
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + dur + 0.1);
  });
}
/* 起一个持续音，返回 { stop(fade) }。
   「按住」关和「听拍数」都用它：音要一直响到松手或拍数数完，
   所以音量先起后落，再交给调用方决定什么时候淡出。
   所有还在响的长音都登记在 LIVE 里，切屏或换题时统一停掉，
   否则孩子按住键点「←」离开，琴音会一直留在首页。 */
const LIVE = new Set();
function stopAllTones(){
  LIVE.forEach(function(t){ t.stop(0.08); });
  LIVE.clear();
}
function startTone(midi){
  if(!S.sound) return null;
  const c = audioCtx(); if(!c) return null;
  const t = c.currentTime;
  const f = 440 * Math.pow(2, (midi - 69) / 12);
  const out = c.createGain();
  out.gain.setValueAtTime(0, t);
  out.gain.linearRampToValueAtTime(0.34, t + 0.02);
  out.gain.linearRampToValueAtTime(0.2, t + 0.22);
  out.connect(c.destination);
  const oscs = [[1,1],[2,0.34],[3,0.13],[4,0.05]].map(function(p){
    const o = c.createOscillator();
    o.type = 'sine'; o.frequency.value = f * p[0];
    const g = c.createGain(); g.gain.value = p[1] * 0.55;
    o.connect(g); g.connect(out); o.start(t);
    return o;
  });
  const handle = {
    stop: function(fade){
      if(!LIVE.has(handle)) return;
      LIVE.delete(handle);
      const now = c.currentTime;
      const d = (fade == null) ? 0.15 : fade;
      const cur = Math.max(0.001, out.gain.value);
      out.gain.cancelScheduledValues(now);
      out.gain.setValueAtTime(cur, now);
      out.gain.exponentialRampToValueAtTime(0.0008, now + d);
      oscs.forEach(function(o){ try { o.stop(now + d + 0.05); } catch(e){} });
    }
  };
  LIVE.add(handle);
  return handle;
}

/* 一拍一下的提示音。只用来给「按住」数拍子，
   音量很小，不盖住持续音。 */
function clickSound(){
  if(!S.sound) return;
  const c = audioCtx(); if(!c) return;
  const t = c.currentTime;
  const o = c.createOscillator(); o.type = 'square'; o.frequency.value = 1320;
  const g = c.createGain();
  g.gain.setValueAtTime(0.07, t);
  g.gain.exponentialRampToValueAtTime(0.0004, t + 0.05);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + 0.06);
}

/* ==================== 语音 ====================
   题目用系统语音念出来，孩子不识字也能独立玩。
   难点在混读：中文句子要用中文声音，「B / C / D」要按字母本音读，
   所以 say() 把字符串按单个拉丁字母切开，逐段设置 lang 和 voice。
   没有对应语音包时静默失败，只显示文字，不影响答题。

   两个必须处理的细节：
   1. 单个大写字母交给系统念，苹果的英文声音会念成「capital B」。
      孩子听到的是「大写字母 B」，不是音名。所以字母先换成
      同音的英文拼写（B → bee、C → see），再交给英文声音。
   2. 「弹」是多音字，系统默认读 dàn。屏幕上保留「弹」，
      只在送去朗读的副本里换成同音的「谈」，读成 tán。
   两处都只改朗读用的字符串，不改页面显示。 */
const LETTER_SAY = { a:'ay', b:'bee', c:'see', d:'dee', e:'ee', f:'eff', g:'jee' };
const SAY_FIX = [[/弹/g, '谈']];
let zhVoice = null;
let enVoice = null;
/* 英文声音的偏好顺序：这些名字在各平台上读字母最干净，
   找不到就退回任意 en-US，再退到任意 en。 */
const EN_PREFER = ['Samantha','Ava','Allison','Kathy','Karen','Moira','Tessa','Serena','Fiona','Zira','Aria','Google US English'];
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices() || [];
  zhVoice = vs.filter(function(v){ return /^zh[-_]CN/i.test(v.lang); })[0]
         || vs.filter(function(v){ return /^zh/i.test(v.lang); })[0] || null;
  const ens = vs.filter(function(v){ return /^en/i.test(v.lang); });
  enVoice = ens.filter(function(v){
    return EN_PREFER.some(function(name){ return v.name.indexOf(name) >= 0; });
  })[0] || ens.filter(function(v){ return /^en[-_]US/i.test(v.lang); })[0] || ens[0] || null;
}
if('speechSynthesis' in window){
  loadVoices();
  if(speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', loadVoices);
}
/* force 同上：试听时不管「语音念题」开关，直接念一句。 */
/* 依次念的序号：每次 say 换一个新号，旧句子的 onend 回调就不再往下念。
   否则退出关卡后，没念完的句子还会继续排队念下去。 */
let saySeq = 0;

function say(text, force){
  if((!S.speech && !force) || !text || !('speechSynthesis' in window)) return;
  if(!enVoice || !zhVoice) loadVoices();
  let line = String(text);
  SAY_FIX.forEach(function(p){ line = line.replace(p[0], p[1]); });
  /* 捕获组切开：'找到 C' → ['找到 ', 'C']。
     单个字母走英文声音，其余整段走中文声音。 */
  const parts = line.split(/([A-Za-z])/).filter(function(s){ return s.length; });
  const items = parts.map(function(part){
    const isLetter = /^[A-Za-z]$/.test(part);
    const spoken = isLetter ? (LETTER_SAY[part.toLowerCase()] || part) : part;
    const u = new SpeechSynthesisUtterance(spoken);
    u.lang = isLetter ? 'en-US' : 'zh-CN';
    u.rate = isLetter ? 0.85 : 0.95;
    u.pitch = 1.02;
    /* 念题只是提示，不要盖过琴声：语音 0.6，钢琴音量已相应调高（见 playMidi）。 */
    u.volume = 0.6;
    if(isLetter && enVoice) u.voice = enVoice;
    if(!isLetter && zhVoice) u.voice = zhVoice;
    return u;
  });
  const seq = ++saySeq;
  try{
    const wasBusy = speechSynthesis.speaking || speechSynthesis.pending;
    if(wasBusy) speechSynthesis.cancel();
    let i = 0;
    /* 一句念完再排下一句。把三句一次性塞进队列时，iOS 上换语种的
       那一句偶尔会被吞掉，整段题干就不响了。 */
    function next(){
      if(seq !== saySeq || i >= items.length) return;
      const u = items[i++];
      let done = false;
      let guard = null;
      function advance(){
        if(done) return;
        done = true;
        if(guard) clearTimeout(guard);
        next();
      }
      /* onend 偶尔不触发，用一个按字数估的兜底计时器接着往下走。 */
      guard = setTimeout(advance, 2500 + u.text.length * 160);
      u.onend = advance;
      u.onerror = advance;
      speechSynthesis.speak(u);
    }
    /* iOS 上 cancel 之后紧接着 speak，第一句容易被吞，先让出一点时间。 */
    setTimeout(next, wasBusy ? 90 : 0);
  }catch(e){}
}
function stopSay(){
  saySeq++;
  try { if('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e){}
}

const INK = '#26252D';

function staffSVG(o){
  o = o || {};
  const noteId = o.noteId || 'C4';
  const n = NOTES[noteId];
  const clef = o.clef || n.clef;
  const valueId = o.value || 'quarter';
  const v = VALUES[valueId];
  const compact = !!o.compact;
  const noteX = o.noteX || (compact ? 6.4 : 8.9);
  const lineEnd = compact ? 11.7 : 14.6;
  const y = n.y;   // 只用配置里的线距坐标，后面不再换算
  let g = '';

  /* 五条线：y 从 0 到 4，一条线一个单位。线宽 0.075 单位，
     缩到卡片大小时大约 2px，打印和屏幕上都不糊。 */
  for(let i = 0; i < 5; i++){
    g += '<line x1="0" y1="' + i + '" x2="' + lineEnd + '" y2="' + i + '" stroke="' + INK + '" stroke-width="0.075" stroke-linecap="round"/>';
  }

  /* 谱号：把 512 单位的原始 path 缩放平移到谱表左端。
     低音谱号的 scale 带负号，是因为它的原始 path 是倒着画的。

     noClef 用于第 3 关「用哪个谱号」：谱号位置画一个浅色的问号，
     等孩子选对了再把谱号补上，所以这一个函数要能画两种状态。 */
  if(o.noClef){
    g += '<text x="1.2" y="2.6" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial" font-size="2.9" font-weight="700" fill="#DCCDB6" stroke="#FFFFFF" stroke-width="0.32" paint-order="stroke" stroke-linejoin="round">?</text>';
  }else if(clef === 'treble'){
    g += '<g transform="translate(0.45 -1.26) scale(0.0071)"><path d="' + CLEF_TREBLE + '" fill="' + INK + '"/></g>';
  }else{
    g += '<g transform="translate(0.5 -0.05) scale(0.004016 -0.004016)"><path d="' + CLEF_BASS + '" fill="' + INK + '"/></g>';
  }

  /* 加线：只画音符左右各 1.15 单位的一小段，不是整条线。 */
  const ledger = (LEDGER[clef] || {})[noteId];
  if(ledger != null){
    g += '<line x1="' + (noteX - 1.15) + '" y1="' + ledger + '" x2="' + (noteX + 1.15) + '" y2="' + ledger + '" stroke="' + INK + '" stroke-width="0.075" stroke-linecap="round"/>';
  }

  /* 符杆方向就是左右手：右手朝上，左手朝下。
     这样孩子在屏幕上看到的和纸面谱一致，换回纸质谱不用重学。
     杆长固定 3.45 单位（约三个半线距），不随音高变化。 */
  const up = n.hand === 'R';
  if(v.stem){
    const sx = up ? noteX + 0.55 : noteX - 0.55;
    const y2 = up ? y - 3.45 : y + 3.45;
    g += '<line x1="' + sx + '" y1="' + (up ? y - 0.02 : y + 0.02) + '" x2="' + sx + '" y2="' + y2 + '" stroke="' + INK + '" stroke-width="0.105" stroke-linecap="round"/>';
  }
  /* 附点画在符头右侧。音符正好落在线上时（y 是整数），
     附点要往上挪半格，否则会和线重叠看不清。 */
  if(v.dot){
    const dy = (y === Math.round(y)) ? y - 0.5 : y;
    g += '<circle cx="' + (noteX + 1.38) + '" cy="' + dy + '" r="0.165" fill="' + INK + '"/>';
  }
  const rx = (v.id === 'whole') ? 0.7 : 0.58;
  g += '<ellipse cx="' + noteX + '" cy="' + y + '" rx="' + rx + '" ry="0.4" transform="rotate(-18 ' + noteX + ' ' + y + ')" fill="' + (v.filled ? INK : 'none') + '" stroke="' + INK + '" stroke-width="0.16"/>';

  /* 指法数字优先放在谱表外侧：音符在下方（y>=4）就写更下面，
     在上方（y<=0）就写更上面，中间的才跟着符杆方向走。
     颜色和卡通手上竖起的那根手指一致，孩子能把「谱子上的 1」
     和「图上竖起的拇指」连起来。白色描边是为了压在谱线上也读得清。 */
  if(o.finger){
    let fy;
    if(y >= 4) fy = y + 1.05;
    else if(y <= 0) fy = y - 1.05;
    else fy = up ? y - 1.05 : y + 1.05;
    g += '<text x="' + noteX + '" y="' + (fy + 0.34) + '" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial" font-size="0.98" font-weight="700" fill="#C2528C" stroke="#FFFFFF" stroke-width="0.26" paint-order="stroke" stroke-linejoin="round">' + n.finger + '</text>';
  }

  const vb = compact ? '-0.35 -1.95 12.5 8.6' : '-0.35 -1.95 15.3 8.6';
  return '<svg class="staff" viewBox="' + vb + '" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">' + g + '</svg>';
}

function staffBlock(opts){
  return '<div class="paper">' + staffSVG(opts) + '</div>';
}

/* 单独的谱号图标，第 3 关的两个选项用。
   直接用谱表里同一份 path，选项上看到的和谱表上画出来的必然一致。
   viewBox 取 path 的原始包围盒；低音谱号的原始 path 是倒着画的，
   图标这里也要翻一次才正。 */
function clefSVG(clef){
  if(clef === 'treble'){
    return '<svg class="cleficon treble" viewBox="0 0 353.8 1000" aria-hidden="true"><path d="' + CLEF_TREBLE + '" fill="' + INK + '"/></svg>';
  }
  return '<svg class="cleficon bass" viewBox="0 0 671 772" aria-hidden="true"><g transform="scale(1,-1)"><path d="' + CLEF_BASS + '" fill="' + INK + '"/></g></svg>';
}

/* ==================== 键盘 ====================
   两组键盘拼一张图：从 C3 开始连续 15 个白键（两个八度多一点），
   黑键按「白键序号」定位，用百分比摆放，所以任何宽度都能自适应。
   白键用 data-midi 记录音高，判题时只比数字，不比 DOM 位置。 */
function buildKeyboard(kb, opts){
  opts = opts || {};
  kb.innerHTML = '';
  const N = 15, w = 100 / N;
  let i, oct, deg, midi, el;

  for(i = 0; i < N; i++){
    oct = 3 + Math.floor(i / 7); deg = i % 7;
    midi = 12 * (oct + 1) + WHITE_OFF[deg];
    el = document.createElement('div');
    el.className = 'w';
    el.dataset.midi = midi;
    el.style.left = (i * w) + '%';
    el.style.width = w + '%';
    /* 中央 C 加一个小圆点做地标：孩子靠它找音组，不用数键。 */
    if(midi === 60){ el.classList.add('midc'); el.insertAdjacentHTML('beforeend', '<i class="middot"></i>'); }
    if(opts.labels) el.insertAdjacentHTML('beforeend', '<span class="lbl">' + letterOf(midi) + '</span>');
    if(opts.target === midi) el.classList.add('target');
    kb.appendChild(el);
  }
  /* 黑键贴在相邻白键之间。一个八度里只有 5 个黑键，
     对应 0,1,3,4,5 这几个白键位置（C# D# F# G# A#），
     2 和 6 之间是 E–F、B–C 的半音关系，没有黑键。 */
  for(i = 0; i < N; i++){
    deg = i % 7;
    if([0,1,3,4,5].indexOf(deg) < 0) continue;
    midi = 12 * (3 + Math.floor(i / 7) + 1) + WHITE_OFF[deg] + 1;
    el = document.createElement('div');
    el.className = 'b';
    el.dataset.midi = midi;
    el.style.left = ((i + 1) * w - 1.95) + '%';
    el.style.width = '3.9%';
    if(opts.target === midi) el.classList.add('target');
    kb.appendChild(el);
  }
}

function makeKB(opts){
  opts = opts || {};
  const wrap = document.createElement('div');
  wrap.className = 'kb-wrap';
  const kb = document.createElement('div');
  kb.className = 'kb';
  buildKeyboard(kb, opts);
  /* 右上角的图例：说明键上的黄点是什么意思。
     图例只是说明，不参与点击，所以放在键盘外面单独一行，
     免得压住键、也免得和黑键的点击区域打架。 */
  const legend = document.createElement('div');
  legend.className = 'kb-legend';
  legend.innerHTML = '<span><i class="lg-dot"></i>中央 C</span>';
  wrap.appendChild(legend);
  wrap.appendChild(kb);
  /* 一屏同时出现谱面和键盘时，谱面让一点高度出来（见 CSS）。 */
  const play = $('#play');
  if(play) play.classList.add('with-kb');

  /* 用 pointerdown 而不是 click：iPad 上按下就出声、就有反馈，
     比等到抬起更跟手；preventDefault 防止 iOS 再把同一个手势
     派发成 click，避免一次点击判两次。

     按下时顺手把指针捕获到这一颗键上。否则手指按住后滑出键盘再抬起，
     pointerup 会落在别的元素上，onUp 永远不触发：键一直亮着，
     持续音也一直响，要等下一题才停。捕获之后，抬手事件一定回到原键。 */
  kb.addEventListener('pointerdown', function(e){
    const el = e.target.closest ? e.target.closest('.w,.b') : null;
    if(!el) return;
    e.preventDefault();
    if(el.setPointerCapture && e.pointerId != null){
      try { el.setPointerCapture(e.pointerId); } catch(err){}
    }
    const midi = Number(el.dataset.midi);
    el.classList.add('on');
    playMidi(midi, 0.9);
    if(opts.onDown) opts.onDown(midi, el);
  }, { passive:false });

  /* 不再监听 pointerleave：手指滑出键面不等于松手，
     有了指针捕获，真正的抬手只会有 pointerup / pointercancel。 */
  ['pointerup','pointercancel'].forEach(function(ev){
    kb.addEventListener(ev, function(e){
      const el = e.target.closest ? e.target.closest('.w,.b') : null;
      if(!el) return;
      el.classList.remove('on');
      if(opts.onUp) opts.onUp(Number(el.dataset.midi), el);
    });
  });
  return wrap;
}

    s.style.fontSize = (14 + Math.random() * 14) + 'px';
    s.style.setProperty('--dx', (Math.random() * 320 - 160).toFixed(0) + 'px');
    s.style.setProperty('--dy', (-60 - Math.random() * 170).toFixed(0) + 'px');
    s.style.setProperty('--rot', (Math.random() * 360).toFixed(0) + 'deg');
    fxEl.appendChild(s);
    (function(el){ setTimeout(function(){ el.remove(); }, 1000); })(s);
  }
}

/* ==================== 游戏状态 ====================
   全局只有一个可变对象 G：
     level   当前第几关
     qs      这一关的题目数组（进关时一次性生成，中途不变）
     i       第几题
     first   一次答对的题数，结算时换算星星
     q       当前题目对象
     busy    判对之后到换题之前的锁，防止连点
     session 会话号，每进一次关卡 +1；所有定时器回调靠它判断自己是否过期 */
const G = { level:1, qs:[], i:0, first:0, q:null, busy:false, session:0 };
/* 当前题里正在跑的「按住」控制器（见 holdPad）。换题、退出关卡时
   要显式停掉，否则定时器和持续音会越过题目边界继续跑。 */
let activePad = null;

function updateDots(){
  const dots = $('#dots');
  dots.innerHTML = '';
  for(let i = 0; i < G.qs.length; i++){
    const d = document.createElement('i');
    d.className = 'dot' + (i < G.i ? ' done' : (i === G.i ? ' now' : ''));
    dots.appendChild(d);
  }
}

/* 判题的唯一入口。题型层只负责调用，不直接改 G。
   对的路径：记一次答对 → 提示 → 等 wait 毫秒 → 换下一题或结算。
   错的路径：累加 q.wrong，错够 hintAfter 次就调用题目的 reveal()
   给提示（高亮正确的键、或在标题里说出答案），但不告诉孩子「错了」。
   always = true 时这句提示每次都显示，不只在第一次错时显示：
   第 5 关一题有三段，每段第一次错都该看到本段的方法提示。 */
function judge(ok, msg, wait, always){
  const q = G.q;
  if(!q || q.answered || G.busy) return;
  if(ok){
    /* 先把会话号存下来：延时结束时会话可能已经变了，那时不能再往下走。 */
    const session = G.session;
    q.answered = true;
    G.busy = true;
    if(!q.wrong) G.first++;
    toast('✓ ' + (msg || praise()), 'ok');
    confetti();
    delay(wait || 1050, function(){
      if(session !== G.session) return;
      G.busy = false;
      G.i++;
      if(G.i >= G.qs.length) finishLevel();
      else renderQuestion();
    });
  }else{
    q.wrong = (q.wrong || 0) + 1;
    toast(msg && (always || q.wrong === 1) ? msg : '再试一次', 'bad');
    if(q.wrong >= diff().hintAfter && q.reveal) q.reveal();
  }
}

/* 换题：先停掉上一题的按住与长音，再清空舞台、答案区、状态，
   最后交给题目自己的 render()。
   注意每次都重建 DOM，不复用节点，避免上一题的监听器残留。 */
function renderQuestion(){
  if(activePad){ activePad.stop(); activePad = null; }
  stopAllTones();
  const q = G.qs[G.i];
  G.q = q;
  G.busy = false;
  $('#play').classList.remove('with-kb');
  answerEl.className = 'answer';
  stageEl.className = 'stage';
  stageEl.innerHTML = '';
  answerEl.innerHTML = '';
  updateDots();
  q.render();
}

/* ==================== 题目 ====================
   每个 q* 都是一个工厂，返回同一套接口：
     kind    题型标识，用于统计和「按住题不排第一」这类规则
     render  画题、绑交互；判对判错一律调 judge()
     reveal  错够次数后的提示
   题目对象自己保存题目参数（noteId、valueId、beats），
   因此同一个工厂可以被不同参数调用很多次，互不干扰。 */

/* 第 1 关：给音名，在键盘上点出来。只看音级，不区分音组，
   所以任何一个 C 都对，这一关不考八度位置。

   题干只说任务、不重复音名：要按的音就是屏幕上那个大写字母。
   第一题把整句话念一遍，之后每题只念这个字母，
   孩子不识字也知道要按哪个音，不必每题都听一遍「找到 B」。 */
function qFindKey(letter){
  return {
    /* 题面上没有「找到 B」，但「再听一遍」按钮应该念出这道题的字母，
       所以把要念的内容挂在题目上，按钮优先读它。 */
    kind:'find', letter:letter, sayText:letter, wrong:0,
    render: function(){
      const first = G.i === 0;
      setPrompt('在键盘上找到展示音名的位置',
                first ? '在键盘上找到展示音名的位置 ' + letter : letter);
      stageEl.classList.add('letter');
      stageEl.innerHTML = '<div class="big-letter">' + letter + '</div><div class="down-arrow">↓</div>';
      const kb = makeKB({
        labels: S.labels,
        onDown: function(midi, el){
          if(G.q.answered) return;
          if(letterOf(midi) === letter){
            el.classList.add('correct');
            judge(true, '对！这是 ' + letter);
          }else{
            el.classList.add('wrong');
            setTimeout(function(){ el.classList.remove('wrong'); }, 420);
            judge(false);
          }
        }
      });
      answerEl.appendChild(kb);
    },
    reveal: function(){
      $$('.kb .w, .kb .b', answerEl).forEach(function(k){
        if(letterOf(Number(k.dataset.midi)) === letter) k.classList.add('hint');
      });
    }
  };
}

/* 第 2 关（双向之一）：给谱面，在键盘上点出这个音。
   和上一关不同，这里必须对上具体音组：D4 不能点成 D5。 */
function qStaffToKey(noteId, valueId){
  const note = NOTES[noteId];
  return {
    kind:'s2k', noteId:noteId, valueId:valueId || 'quarter', wrong:0,
    render: function(){
      setPrompt('这个音在键盘上哪里？', '这个音在键盘上哪里');
      stageEl.innerHTML = staffBlock({ noteId:noteId, value: valueId || 'quarter' });
      const kb = makeKB({
        labels: S.labels,
        onDown: function(midi, el){
          if(G.q.answered) return;
          if(midi === note.midi){
            el.classList.add('correct');
            judge(true, '对！这是 ' + note.label);
          }else{
            el.classList.add('wrong');
            setTimeout(function(){ el.classList.remove('wrong'); }, 420);
            judge(false);
          }
        }
      });
      answerEl.appendChild(kb);
    },
    reveal: function(){
      $$('.kb .w, .kb .b', answerEl).forEach(function(k){
        if(Number(k.dataset.midi) === note.midi) k.classList.add('hint');
      });
    }
  };
}

/* 第 2 关（双向之二）：高亮一个键，从几张谱例里挑出对应的那张。
   options 决定给几张：轻松档 2 张，其余 3 张；干扰项从本单元里抽。 */
function qKeyToStaff(noteId){
  const note = NOTES[noteId];
  const n = diff().options >= 3 ? 3 : 2;
  const others = shuffle(NOTE_IDS.filter(function(x){ return x !== noteId; })).slice(0, n - 1);
  const order = shuffle([noteId].concat(others));

  return {
    kind:'k2s', noteId:noteId, wrong:0,
    render: function(){
      setPrompt('这个键在五线谱上是哪一个？', '这个键在五线谱上是哪一个');
      const stack = document.createElement('div');
      stack.className = 'stack';
      stack.appendChild(makeKB({ labels: S.labels, target: note.midi }));
      const row = document.createElement('div');
      row.className = 'cards-row';
      order.forEach(function(id){
        const b = document.createElement('button');
        b.className = 'card-btn';
        b.dataset.note = id;
        b.innerHTML = staffSVG({ noteId:id, compact:true });
        b.addEventListener('click', function(){
          if(G.q.answered) return;
          if(id === noteId){
            b.classList.add('correct');
            playMidi(note.midi, 0.9);
            judge(true, '对！这是 ' + note.label);
          }else{
            b.classList.add('wrong');
            setTimeout(function(){ b.classList.remove('wrong'); }, 500);
            judge(false);
          }
        });
        row.appendChild(b);
      });
      stack.appendChild(row);
      stageEl.appendChild(stack);
    },
    reveal: function(){
      $$('.card-btn', stageEl).forEach(function(c){
        if(c.dataset.note === noteId) c.classList.add('correct');
      });
      setPrompt(note.label + ' 在这里', false);
    }
  };
}

/* 音名写法：单个字母前面留一个空格（「这是 B」），中文说明不留（「这是中央 C」）。 */
function labelOf(n){
  return /^[A-Z]$/.test(n.label) ? ' ' + n.label : n.label;
}

/* 第 3 关：谱表上画一个音、不画谱号，告诉孩子这是什么音，问该用哪个谱号。
   规则就一条，本单元的三个音都落在它上面：
     比中央 C 低的音写低音谱号；中央 C 和比它高的音写高音谱号。
   答对之后把谱号补到谱表左边，孩子能直接看到「放对了」。
   谱面不画谱号时，音符的纵向位置本来就说明不了音名，
   所以音名必须在题干里给出，这一关考的是「这个音归哪个谱号」。 */
function qClef(noteId){
  const n = NOTES[noteId];
  const right = n.clef;
  const name = (right === 'treble') ? '高音谱号' : '低音谱号';
  return {
    kind:'clef', noteId:noteId, wrong:0,
    render: function(){
      setPrompt('这个音符是' + labelOf(n) + '，用哪个谱号？', '这个音符是' + labelOf(n) + '，用哪个谱号');
      stageEl.innerHTML = staffBlock({ noteId:noteId, noClef:true });
      const box = document.createElement('div');
      box.className = 'opts';
      [['高音谱号','treble'], ['低音谱号','bass']].forEach(function(pair){
        const b = document.createElement('button');
        b.className = 'opt clef';
        b.dataset.clef = pair[1];
        b.innerHTML = clefSVG(pair[1]) + '<span class="unit">' + pair[0] + '</span>';
        b.addEventListener('click', function(){
          if(G.q.answered) return;
          if(pair[1] === right){
            b.classList.add('correct');
            /* 把谱号补上：刚才那个问号的位置现在有谱号了。 */
            stageEl.innerHTML = staffBlock({ noteId:noteId });
            playMidi(n.midi, 0.9);
            judge(true, '对，' + n.label + ' 用' + name);
          }else{
            b.classList.add('wrong');
            setTimeout(function(){ b.classList.remove('wrong'); }, 500);
            judge(false, right === 'bass'
              ? '比中央 C 低，用低音谱号'
              : '中央 C 及以上，用高音谱号', 0, true);
          }
        });
        box.appendChild(b);
      });
      answerEl.appendChild(box);
    },
    reveal: function(){
      /* 提示时把正确的谱号直接画进谱表，孩子在选之前就能看见「放对了」是什么样。 */
      stageEl.innerHTML = staffBlock({ noteId:noteId });
      $$('.opt.clef', answerEl).forEach(function(b){
        if(b.dataset.clef === right) b.classList.add('correct');
      });
      setPrompt('这个音符是' + labelOf(n) + '，用' + name, false);
    }
  };
}

/* 生成拍数选项：正确项 + 从剩下的 1–4 里随机补足，最后整体打乱。 */
function beatsOptions(correct, n){
  const pool = [1,2,3,4].filter(function(x){ return x !== correct; });
  return shuffle([correct].concat(shuffle(pool).slice(0, n - 1)));
}

/* ==================== 按住练习 ====================
   第 4、5 关共用：把「这个音符有多长」变成按住琴键的实际时长。

   什么时候松手，孩子自己判断：按住正确的键以后，屏幕上只有一个
   从 0 开始、每过一拍加 1 的计数器，声音不在到点时收掉，也没有
   提前排好的拍子格。音符是 2 拍就数到 2 松手，和谱面对得上。

   上下两个方向都判：按太短是错，按过头同样是错。容差 tol 拍
   （默认 0.3）放过的只是「晚一点松手」；超过 tolOver 拍（默认 0.62）
   才算过头。手指抬起总会晚一点，对 4 岁的孩子宁可放过，
   也不要为 0.1 拍判错。

   没有预备拍。按下就是第一拍，孩子什么时候准备好就什么时候开始。

   这个函数不判对错，成功与失败都交给 onRelease(ok, held, tries, reason)，
   reason 是 'short' 或 'long'。由题目决定算不算一次错、该怎么提示；
   同一题错两次以后会把正确的键标出来。第 4 关的按住答对拍数后才开始，
   第 5 关的按住就是最后一段，两关都按普通题目判。

   返回 { stop }。换题、退出关卡时必须调用，否则定时器与持续音
   会跟到下一题去。调用 stop 之后不再接受按压。 */
function holdPad(host, noteId, beats, opts){
  opts = opts || {};
  const note = NOTES[noteId];
  const MS = Math.round(60000 / diff().bpm);
  const tol = (opts.tol == null) ? 0.3 : opts.tol;
  const over = (opts.tolOver == null) ? 0.62 : opts.tolOver;
  const MAXB = 8;               // 最多数到 8 拍，防止一直按着不放
  const session = G.session;
  let count = 0, ticks = 0, timer = null, tone = null, pressAt = 0, tries = 0;
  let finished = false, resetTimer = null;

  const box = document.createElement('div');
  box.className = 'beat-box';
  /* 一个圆，按下后从 0 开始，每过一拍加 1。
     它只显示「已经按住几拍」，没有「一共几格」，所以看不出答案。 */
  const circle = document.createElement('div');
  circle.className = 'beat-live';
  circle.textContent = '·';
  const cap = document.createElement('div');
  cap.className = 'beat-cap';
  box.appendChild(circle);
  box.appendChild(cap);
  host.appendChild(box);

  function live(v, on){
    circle.textContent = String(v);
    circle.classList.toggle('on', !!on);
  }
  function stopTimer(){ if(timer){ clearInterval(timer); timer = null; } }
  function releaseTone(fade){ if(tone){ tone.stop(fade == null ? 0.14 : fade); tone = null; } }
  function idleCap(){ cap.textContent = '按住这个音，自己数拍子'; }
  function hintKey(){
    $$('.w,.b', kb).forEach(function(k){
      if(Number(k.dataset.midi) === note.midi) k.classList.add('hint');
    });
  }

  const kb = makeKB({
    labels: S.labels,
    onDown: function(midi, el){
      if(finished) return;
      if(midi !== note.midi){
        el.classList.add('wrong');
        setTimeout(function(){ el.classList.remove('wrong'); }, 420);
        if(opts.onWrong) opts.onWrong(midi);
        return;
      }
      if(resetTimer){ clearTimeout(resetTimer); resetTimer = null; }
      stopTimer(); releaseTone(0.06);
      count = 0; ticks = 0; pressAt = performance.now();
      /* 按下这一下不出声：它只是「开始」，不是第一拍。
         否则 4 拍的音符会响 5 下（按下 1 下 + 之后 4 下），
         孩子会数成 5 拍。现在每过满一拍才响一下，
         计数器的数字和响声一一对应：数到 4 就是响 4 下。 */
      tone = startTone(midi);
      live(0, true);
      cap.textContent = '数拍子，数够了就松手';
      timer = setInterval(function(){
        if(session !== G.session){ stopTimer(); return; }
        ticks++;
        clickSound();
        /* 不在这里停声音：停了就等于告诉孩子「刚好够了」。 */
        if(ticks >= MAXB){
          stopTimer();
          releaseTone(0.2);
          cap.textContent = '太长了，松开再试';
          return;
        }
        count = ticks;
        live(count, true);
      }, MS);
    },
    onUp: function(){
      if(finished || !pressAt) return;
      stopTimer();
      releaseTone();
      const held = (performance.now() - pressAt) / MS;
      pressAt = 0;
      tries++;
      const tooLong = held > beats + over;
      if(held >= beats - tol && !tooLong){
        finished = true;
        live(beats, false);
        cap.textContent = '正好 ' + beats + ' 拍';
        if(opts.onRelease) opts.onRelease(true, held, tries);
        return;
      }
      live('·', false);
      cap.textContent = '这个音符是 ' + beats + ' 拍';
      /* 第 4 个参数告诉题目是「太短」还是「太长」，题目不用自己再算一遍容差。 */
      if(opts.onRelease) opts.onRelease(false, held, tries, tooLong ? 'long' : 'short');
      if(tries >= 2) hintKey();
      resetTimer = setTimeout(function(){
        resetTimer = null;
        if(finished || session !== G.session) return;
        cap.textContent = '这个音符是 ' + beats + ' 拍，再试一次';
      }, 1800);
    }
  });
  host.appendChild(kb);
  idleCap();

  const api = {
    stop: function(){
      finished = true;
      stopTimer();
      releaseTone(0.08);
      if(resetTimer){ clearTimeout(resetTimer); resetTimer = null; }
    }
  };
  activePad = api;
  return api;
}

/* 第 4 关（之一）：读谱面上的音符，判断几拍。
   这一关要孩子自己完成三件事：这是什么音、在键盘哪里、弹多长。
   所以答对拍数之后，键盘不会亮键、也不会排出拍子格：
   位置和时长都得自己从谱面读出来，按错了照常记错、可以说「这是 D」。
   以前的版本把键和拍子格都摆好，孩子只需要跟着按，思考被省掉了。 */
function qBeats(noteId, valueId){
  const v = VALUES[valueId];
  const n = NOTES[noteId];
  const opts = beatsOptions(v.beats, diff().options === 2 ? 2 : 4);
  let stage = 1;
  return {
    kind:'beats', noteId:noteId, valueId:valueId, wrong:0,
    render: function(){
      stage = 1;
      setPrompt('这个音符是几拍？', '这个音符是几拍');
      stageEl.innerHTML = staffBlock({ noteId:noteId, value:valueId });
      const box = document.createElement('div');
      box.className = 'opts';
      let picked = false;
      opts.forEach(function(num){
        const b = document.createElement('button');
        b.className = 'opt';
        b.innerHTML = '<span class="num">' + num + '</span><span class="unit">拍</span><span class="pips">' + '●'.repeat(num) + '</span>';
        b.addEventListener('click', function(){
          if(picked || G.q.answered) return;
          if(num !== v.beats){
            b.classList.add('wrong');
            setTimeout(function(){ b.classList.remove('wrong'); }, 500);
            judge(false);
            return;
          }
          picked = true;
          b.classList.add('correct');
          toast('对，' + v.beats + ' 拍', 'ok');
          holdIt();
        });
        box.appendChild(b);
      });
      answerEl.appendChild(box);

      /* 第二段：不亮键、不排拍子格，孩子先要在键盘上找到这个音，
         再自己数拍子按够长度。失败照常记错，提示只给「先找到这个音」。 */
      function holdIt(){
        stage = 2;
        answerEl.innerHTML = '';
        answerEl.className = 'answer hold';
        setPrompt('在键盘上找到这个音，弹够它该有的长度', '在键盘上找到这个音，弹够它该有的长度');
        holdPad(answerEl, noteId, v.beats, {
          onWrong: function(){ judge(false, '先找到这个音', 0, true); },
          onRelease: function(ok, held, tries, reason){
            if(ok){
              judge(true, '对！' + v.name + '是 ' + v.beats + ' 拍');
            }else if(reason === 'long'){
              judge(false, '长了：' + v.name + '是 ' + v.beats + ' 拍', 0, true);
            }else if(held < 0.5){
              judge(false, '太短了，要按住不放', 0, true);
            }else{
              judge(false, '短了：你弹了 ' + Math.round(held) + ' 拍，' + v.name + '是 ' + v.beats + ' 拍', 0, true);
            }
          }
        });
      }
    },
    reveal: function(){
      if(stage === 1){
        $$('.opt', answerEl).forEach(function(b){
          const num = b.querySelector('.num');
          if(num && Number(num.textContent) === v.beats) b.classList.add('correct');
        });
        setPrompt(v.name + '：' + v.beats + ' 拍', false);
      }else{
        setPrompt('这是' + labelOf(n) + '，弹 ' + v.beats + ' 拍', false);
      }
    }
  };
}

/* 第 4 关（之二）：反过来问，给时值名称，从几个谱例里挑出对应的音符。
   干扰项固定抽两个其它时值，所以永远是三选一。
   选对之后同样接一段「按住」，把刚才认出来的形状按真实长度弹一遍。 */
function qWhichShape(noteId, valueId){
  const v = VALUES[valueId];
  const n = NOTES[noteId];
  const others = shuffle(VALUE_IDS.filter(function(x){ return x !== valueId; })).slice(0, 2);
  const choices = shuffle([valueId].concat(others));
  let stage = 1;
  return {
    kind:'shape', noteId:noteId, valueId:valueId, wrong:0,
    render: function(){
      stage = 1;
      setPrompt('哪个是' + v.name + '？', '哪个是' + v.name);
      stageEl.innerHTML = '<div class="qmark">?</div>';
      let picked = false;
      choices.forEach(function(id){
        const b = document.createElement('button');
        b.className = 'card-btn';
        b.dataset.value = id;
        b.innerHTML = staffSVG({ noteId:noteId, value:id, compact:true });
        b.addEventListener('click', function(){
          if(picked || G.q.answered) return;
          if(id !== valueId){
            b.classList.add('wrong');
            setTimeout(function(){ b.classList.remove('wrong'); }, 500);
            judge(false);
            return;
          }
          picked = true;
          b.classList.add('correct');
          /* 把问号换成刚选中的那个谱面，孩子能对着它按。
             键盘不亮键、也不排拍子格：音在哪里、弹几拍都由孩子自己读谱决定。 */
          stage = 2;
          stageEl.innerHTML = staffBlock({ noteId:noteId, value:valueId });
          answerEl.innerHTML = '';
          answerEl.className = 'answer hold';
          setPrompt('在键盘上找到这个音，弹够它该有的长度', '在键盘上找到这个音，弹够它该有的长度');
          holdPad(answerEl, noteId, v.beats, {
            onWrong: function(){ judge(false, '先找到这个音', 0, true); },
            onRelease: function(ok, held, tries, reason){
              if(ok){
                judge(true, '对！' + v.name + '是 ' + v.beats + ' 拍');
              }else if(reason === 'long'){
                judge(false, '长了：' + v.name + '是 ' + v.beats + ' 拍', 0, true);
              }else if(held < 0.5){
                judge(false, '太短了，要按住不放', 0, true);
              }else{
                judge(false, '短了：你弹了 ' + Math.round(held) + ' 拍，' + v.name + '是 ' + v.beats + ' 拍', 0, true);
              }
            }
          });
        });
        answerEl.appendChild(b);
      });
    },
    reveal: function(){
      if(stage === 2){
        setPrompt('这是' + labelOf(n) + '，弹 ' + v.beats + ' 拍', false);
        return;
      }
      $$('.card-btn', answerEl).forEach(function(b, idx){
        if(choices[idx] === valueId) b.classList.add('correct');
      });
    }
  };
}

/* ==================== 卡通手 ====================
   手掌朝前、手指朝上，五指始终伸开。右手拇指在左，左手整只镜像，
   所以「拇指在哪边」就是左右手的区别，两只手永远画得一模一样。

   ring = 0      不戴戒指，判左右手用
   ring = 1..5   在这一根手指上戴一枚指法色的戒指，判指法用

   为什么用戒指而不是竖手指：竖中指是个不雅手势，而且「竖起一根、
   其余蜷起」的手形本身会让孩子去模仿手势，而不是记住手指的位置。
   五指都伸开、只在目标手指上加一枚戒指，看的是「戒指在哪根手指上」。

   画法分两层：先把同样几个形状放大 3 画成深色，再压上正常大小的肤色。
   两层的差集只剩一圈外轮廓，手指和手掌接缝处不会出现多余的线，
   看起来像一张贴纸，也就是儿童插画里的卡通手。

   拇指用深一档的肤色，五根手指按解剖长度：中指最长，小指最短。 */
const HAND_SKIN = '#FFD7B0', HAND_THUMB = '#F4BE8F', HAND_INK = '#3B3A44';
/* 袖口颜色按手分：左手蓝、右手珊瑚红。很多儿童钢琴教材也用这套配色，
   孩子记不住「拇指在哪边」时，至少颜色能帮上忙，不会选错一整只手。 */
const HAND_CUFF = { L:'#9FC2EA', R:'#F2B3AA' };
const FINGER_NAME = ['', '拇指', '食指', '中指', '无名指', '小指'];

function handSVG(side, ring){
  ring = ring || 0;
  const ext = [20, 8, 15, 28];       // 食指、中指、无名指、小指伸开时的顶端
  const xs = [35, 52, 69, 86];
  const W = 14, bottom = 80, palmTop = 54;
  const parts = [];

  for(let i = 0; i < 4; i++){
    parts.push({ x: xs[i], y: ext[i], w: W, h: bottom - ext[i], rx: W / 2, f: HAND_SKIN });
  }
  parts.push({ x:23, y:52, w:19, h:38, rx:9.5, f:HAND_THUMB, rot:'rotate(-38 32.5 90)' });
  parts.push({ x:33, y:palmTop, w:64, h:60, rx:20, f:HAND_SKIN });

  function shape(p, e){
    return '<rect x="' + (p.x - e) + '" y="' + (p.y - e) + '" width="' + (p.w + 2*e) + '" height="' + (p.h + 2*e) +
      '" rx="' + (p.rx + e) + '"' + (p.rot ? ' transform="' + p.rot + '"' : '') + ' fill="' + p.f + '"/>';
  }
  let g = '';
  parts.forEach(function(p){ g += shape(p, 3).replace('fill="' + p.f + '"', 'fill="' + HAND_INK + '"'); });
  parts.forEach(function(p){ g += shape(p, 0); });

  /* 指甲：让「手背朝上、放在琴键上」的姿势看得出来。 */
  for(let i = 0; i < 4; i++){
    g += '<ellipse cx="' + (xs[i] + W/2) + '" cy="' + (ext[i] + 8) + '" rx="3.2" ry="4.2" fill="#FFF0E0"/>';
  }
  g += '<rect x="40" y="104" width="50" height="24" rx="12" fill="' + (HAND_CUFF[side] || '#CBD9EA') + '" stroke="' + HAND_INK + '" stroke-width="3"/>';

  /* 戒指：横箍在手指上的一小条，颜色与谱面上的指法数字一致。
     拇指是斜着的，所以那一枚跟着拇指一起转。 */
  if(ring >= 2 && ring <= 5){
    g += '<rect x="' + (xs[ring-2] - 1) + '" y="' + (ext[ring-2] + 9) + '" width="' + (W + 2) + '" height="6" rx="3" fill="#C2528C"/>';
  }
  if(ring === 1){
    g += '<rect x="21.8" y="65" width="21.4" height="6" rx="3" fill="#C2528C" transform="rotate(-38 32.5 90)"/>';
  }

  /* 右手形状不动，左手整体镜像；平移 10 把整只手挪到画布正中，
     这样左右两只并排时大小、位置完全对称。 */
  const shift = ' translate(10,0)';
  const mirror = (side === 'L') ? ' translate(120,0) scale(-1,1)' : '';
  return '<svg viewBox="-4 0 128 132" aria-hidden="true"><g transform="' + mirror + shift + '">' + g + '</g></svg>';
}

/* 指法选项：正确答案 + 从 1/2/3 里补足。
   本单元只有 B、中央 C、D，落在拇指、食指、中指上，取到 3 就够。 */
function fingerChoices(correct, n){
  const pool = [1,2,3].filter(function(x){ return x !== correct; });
  return shuffle([correct].concat(shuffle(pool).slice(0, Math.min(n, 3) - 1)));
}

/* ==================== 第 5 关：先判手，再判指，最后弹够拍子 ====================
   一题三段，顺序就是学一个音的指法的顺序：
     ① 看符杆判左右手
     ② 看谱面上的指法数字，从两三只卡通手里选出对应的手指
     ③ 用这只手、这根手指按住琴键，弹够这个音符该有的长度
   前两段只是过渡：答对就进下一段，不调用 judge；整题只在第三段
   弹对长度时 judge(true)。中间答错照样记错、错够次数照样给提示，
   所以「一次答对」仍然要求三段都一遍过。

   第三段和第 4 关的反向题一样不告诉拍数：拍数要从谱面读出来，
   按住的计时器只显示「已经数到几」，几拍该松手由孩子自己判断。 */
function qPlayNote(noteId, valueId){
  const n = NOTES[noteId];
  const v = VALUES[valueId];
  const right = n.hand === 'R';
  const handName = right ? '右手' : '左手';
  const session = G.session;
  let stage = 0, lock = false;

  /* 答对到换段之间锁一下，免得孩子连点把同一段答两次。 */
  function go(fn){
    lock = true;
    delay(640, function(){
      if(session !== G.session || G.q.answered) return;
      if(!$('#play').classList.contains('active')) return;
      lock = false;
      fn();
    });
  }
  function staff(){ return staffBlock({ noteId:noteId, value:valueId, finger:true }); }
  function reset(cls){
    answerEl.className = cls;
    answerEl.innerHTML = '';
    return answerEl;
  }
  function shake(b){
    b.classList.add('wrong');
    setTimeout(function(){ b.classList.remove('wrong'); }, 500);
  }

  /* 第一段：左右手。判定用 NOTES 里的 hand，和画符杆是同一份数据。 */
  function askHand(){
    stage = 1;
    setPrompt('先用哪只手？', '这个音用哪只手弹');
    stageEl.innerHTML = staff();
    const box = document.createElement('div');
    box.className = 'opts';
    [['左手','L'], ['右手','R']].forEach(function(pair){
      const b = document.createElement('button');
      b.className = 'opt hand';
      b.dataset.side = pair[1];
      b.innerHTML = handSVG(pair[1], 0) + '<span class="unit">' + pair[0] + '</span>';
      b.addEventListener('click', function(){
        if(lock || G.q.answered) return;
        if(pair[1] === n.hand){
          b.classList.add('correct');
          toast('对，' + handName, 'ok');
          go(askFinger);
        }else{
          shake(b);
          judge(false, '看符杆：朝上是右手，朝下是左手', 0, true);
        }
      });
      box.appendChild(b);
    });
    reset('answer').appendChild(box);
  }

  /* 第二段：指法。选项是手，不是数字，孩子得知道「1 就是拇指」。 */
  function askFinger(){
    stage = 2;
    setPrompt('用哪个手指？', '谱子上写的是 ' + n.finger + '，用哪个手指');
    stageEl.innerHTML = staff();
    const box = document.createElement('div');
    box.className = 'opts';
    fingerChoices(n.finger, diff().options).forEach(function(f){
      const b = document.createElement('button');
      b.className = 'opt finger';
      b.dataset.finger = String(f);
      b.innerHTML = handSVG(n.hand, f) + '<span class="unit">' + FINGER_NAME[f] + '</span>';
      b.addEventListener('click', function(){
        if(lock || G.q.answered) return;
        if(f === n.finger){
          b.classList.add('correct');
          toast('对，' + n.finger + ' 指是' + FINGER_NAME[n.finger], 'ok');
          go(askPlay);
        }else{
          shake(b);
          judge(false, '手指从拇指数起：1 拇指，2 食指', 0, true);
        }
      });
      box.appendChild(b);
    });
    reset('answer').appendChild(box);
  }

  /* 第三段：真的把音按出来，并弹够时值。
     不显示拍子格，只显示已经按住几拍，几下该松手由孩子自己数。 */
  function askPlay(){
    stage = 3;
    setPrompt(handName + ' ' + n.finger + ' 指，按住这个音，弹够它该有的长度',
              '用' + handName + n.finger + '指按住这个音，弹够它该有的长度');
    stageEl.innerHTML = staff();
    reset('answer hold');
    holdPad(answerEl, noteId, v.beats, {
      onWrong: function(){ judge(false, '先找到这个音', 0, true); },
      onRelease: function(ok, held, tries, reason){
        /* 弹长弹短的反馈每次都要说出来，不能被「再试一次」盖掉。 */
        if(ok){
          judge(true, '对！' + handName + ' ' + n.finger + ' 指，' + v.name + '弹 ' + v.beats + ' 拍');
        }else if(reason === 'long'){
          judge(false, '长了：' + v.name + '是 ' + v.beats + ' 拍', 0, true);
        }else if(held < 0.5){
          judge(false, '太短了，要按住不放', 0, true);
        }else{
          judge(false, '短了：你弹了 ' + Math.round(held) + ' 拍，' + v.name + '是 ' + v.beats + ' 拍', 0, true);
        }
      }
    });
  }

  /* 错够次数后的提示，按当前在第几段决定提示什么，答案直接标在选项上。 */
  function reveal(){
    if(stage === 1){
      /* 把「拇指在哪边」一起说出来：这是两只手真正的区别，也是孩子
         下次能自己判断的依据，不能只丢一个「右手」的结论。 */
      setPrompt('符杆朝' + (right ? '上' : '下') + '，是' + handName +
                '；' + handName + '的拇指在' + (right ? '左' : '右') + '边', false);
      $$('.opt.hand', answerEl).forEach(function(b){
        if(b.dataset.side === n.hand) b.classList.add('correct');
      });
    }else if(stage === 2){
      setPrompt(n.finger + ' 指是' + FINGER_NAME[n.finger], false);
      $$('.opt.finger', answerEl).forEach(function(b){
        if(Number(b.dataset.finger) === n.finger) b.classList.add('correct');
      });
    }else{
      setPrompt('这个音符是 ' + v.beats + ' 拍', false);
    }
  }

  return {
    kind:'play', noteId:noteId, valueId:valueId, wrong:0,
    render: function(){ askHand(); },
    reveal: reveal
  };
}

/* ==================== 出题（由易到难） ====================
   一关的题目在进关时一次性生成，中途不再变化，
   所以「第几题」的进度条和星星统计都是确定的。
   repeatTo 负责把一个池子循环填满到 n 个，再打乱，
   保证每种音、每种时值出现的次数尽量均匀。 */
function repeatTo(arr, n){
  const out = [];
  while(out.length < n) out.push.apply(out, shuffle(arr));
  return out.slice(0, n);
}

/* 第 1 关的字母序列：从一组按权重摆好的字母里随机抽 n 个，
   所以每次的题量构成会略有不同（不会永远是 3C/3B/2D）。
   两个约束：三个音都要出现；相邻两题不重复同一个音。
   纯随机洗牌时常连出三个 C，孩子会觉得「怎么又是这个」。 */
function findKeyLetters(n){
  const base = ['C','C','C','B','B','B','D','D','C','B'];  // C、B 多：两端的锚点
  const picked = shuffle(base).slice(0, n);
  ['B','C','D'].forEach(function(need){
    if(picked.indexOf(need) >= 0) return;
    const count = {};
    picked.forEach(function(x){ count[x] = (count[x] || 0) + 1; });
    let idx = -1, best = 0;
    picked.forEach(function(x, i){ if(count[x] > best){ best = count[x]; idx = i; } });
    if(idx >= 0 && best > 1) picked[idx] = need;
  });
  return spreadLetters(picked);
}

/* 每关的题目构成：
     第 1 关  从预置序列里抽，C 和 B 出现得多一点，先把两端的锚点认熟
     第 2 关  一半「谱→键」，一半「键→谱」，交替练双向映射
     第 3 关  谱号题，低音、高音各一半，B 用低音谱号
     第 4 关  每三题插一道「哪个是二分音符」的反向题，答对后自己找键、自己数拍
     第 5 关  每题三段：判手 → 判指 → 按住弹够时值
   生成后统一打乱。第 5 关第一段只是选左右手，不难，不需要再挑一道轻题开场。 */
function buildQuestions(level){
  const d = diff();
  const n = d.count;
  let qs = [];

  if(level === 1){
    qs = findKeyLetters(n).map(qFindKey);
  }else if(level === 2){
    const ids = shuffle(repeatTo(NOTE_IDS, n));
    const half = Math.ceil(n / 2);
    ids.slice(0, half).forEach(function(id){ qs.push(qStaffToKey(id)); });
    ids.slice(half).forEach(function(id){ qs.push(qKeyToStaff(id)); });
    while(qs.length < n) qs.push(qKeyToStaff(pick(NOTE_IDS)));
  }else if(level === 3){
    /* 谱号题：本单元只有 B 用低音谱号，所以低音、高音各占一半。
       若按三个音均匀抽，三分之二都是高音谱号，每次猜高音就能蒙对大半。 */
    const half = Math.ceil(n / 2);
    const ids = [];
    for(let i = 0; i < half; i++) ids.push('B3');
    shuffle(repeatTo(['C4','D4'], n - half)).forEach(function(id){ ids.push(id); });
    qs = shuffle(ids).map(qClef);
  }else if(level === 4){
    const vals = shuffle(repeatTo(VALUE_IDS, n));
    for(let i = 0; i < n; i++){
      const id = pick(NOTE_IDS);
      qs.push(i % 3 === 2 ? qWhichShape(id, vals[i]) : qBeats(id, vals[i]));
    }
  }else{
    /* 第 5 关每题要走「手 → 指 → 按住」三段，比别的关费时间，
       所以题目数减 2，一关仍然在三分钟左右。
       时值只用四分、二分、附点二分：全音符没有符杆，
       而这一关的左右手正是靠符杆方向判断的，用了就无从判断。 */
    const m = Math.max(4, n - 2);
    const ids = shuffle(repeatTo(NOTE_IDS, m));
    const vals = shuffle(repeatTo(['quarter','half','dotted'], m));
    for(let i = 0; i < m; i++) qs.push(qPlayNote(ids[i], vals[i]));
  }

  /* 第 1 关已经在生成时排成「不连着重复」的顺序，这里不能再洗一次，
     否则刚打散的字母又被洗回一长串同样的音。其它关照常打乱。 */
  return (level === 1) ? qs : shuffle(qs);
}

/* ==================== 流程 ==================== */
/* 进关：会话号 +1 让上一关所有还没跑完的定时器失效，
   同时停掉还在响的长音与按住控制器，然后重新生成题目。 */
function startLevel(id){
  G.session++;
  if(activePad){ activePad.stop(); activePad = null; }
  stopAllTones();
  G.level = id; G.i = 0; G.first = 0; G.busy = false;
  G.qs = buildQuestions(id);
  $('#levelTag').textContent = '第 ' + id + ' 关 · ' + LEVELS[id - 1].name;
  document.body.classList.add('in-play');
  showScreen('play');
  renderQuestion();
}

/* 结算：一次答对 total-1 题以上给 3 星，total-3 题以上给 2 星，其余 1 星。
   星星只记录历史最高值，重玩变差不掉星。 */
function finishLevel(){
  const total = G.qs.length;
  const first = G.first;
  const stars = first >= total - 1 ? 3 : (first >= total - 3 ? 2 : 1);
  const prev = S.stars[G.level] || 0;
  if(stars > prev) S.stars[G.level] = stars;
  saveStore();
  renderResult(stars, first, total);
  showScreen('result');
}

/* 结算页：拿三颗星且不在最高难度时，多给一个「试试挑战」的按钮。 */
function renderResult(stars, first, total){
  const lv = LEVELS[G.level - 1];
  const starHTML = [1,2,3].map(function(i){
    return '<span class="' + (i <= stars ? 'on' : '') + '">★</span>';
  }).join('');
  const title = stars === 3 ? '全对，太棒了' : (stars === 2 ? '很不错' : '再练一次会更熟');
  const canLevelUp = stars === 3 && S.difficulty !== 'hard';
  const box = $('#resultBox');
  box.className = 'res-wrap';
  box.innerHTML =
    '<div class="res-stars">' + starHTML + '</div>' +
    '<div class="res-title">' + title + '</div>' +
    '<div class="res-sub">第 ' + G.level + ' 关 · ' + lv.title + '　一次答对 ' + first + ' / ' + total +
      '<br>当前难度：' + diff().name + '</div>' +
    '<div class="res-btns">' +
      '<button class="primary-btn" id="btnAgain">再练一次</button>' +
      '<button class="secondary-btn" id="btnHome">选别的关</button>' +
      (canLevelUp ? '<button class="secondary-btn" id="btnHarder">试试挑战</button>' : '') +
    '</div>';
  $('#btnAgain').addEventListener('click', function(){ startLevel(G.level); });
  $('#btnHome').addEventListener('click', showHome);
  if(canLevelUp){
    $('#btnHarder').addEventListener('click', function(){
      S.difficulty = (S.difficulty === 'easy') ? 'normal' : 'hard';
      saveStore(); syncSettings(); startLevel(G.level);
    });
  }
}

/* 切屏。离开游戏页时顺手停语音、长音和按住控制器，
   否则念到一半的题目会跟着到首页去，按住的琴音也会一直响。 */
function showScreen(name){
  $$('.screen').forEach(function(s){ s.classList.remove('active'); });
  $('#' + name).classList.add('active');
  if(name !== 'play'){
    document.body.classList.remove('in-play');
    if(activePad){ activePad.stop(); activePad = null; }
    stopAllTones();
    stopSay();
  }
}

function showHome(){
  showScreen('home');
  renderHome();
}

/* 首页四张关卡卡片，星星从存档里读，没有记录就是灰星。 */
function renderHome(){
  const grid = $('#levelGrid');
  grid.innerHTML = '';
  LEVELS.forEach(function(lv){
    const stars = S.stars[lv.id] || 0;
    const b = document.createElement('button');
    b.className = 'level-card';
    b.innerHTML =
      '<div class="lv-top">' +
        '<div class="lv-num" style="background:' + lv.color + '">' + lv.id + '</div>' +
        '<div class="lv-title">' + lv.title + '</div>' +
      '</div>' +
      '<p class="lv-desc">' + lv.desc + '</p>' +
      '<div class="lv-stars">' +
        [1,2,3].map(function(i){ return '<span class="' + (i <= stars ? 'on' : '') + '">★</span>'; }).join('') +
      '</div>';
    b.addEventListener('click', function(){
      audioCtx();
      startLevel(lv.id);
    });
    grid.appendChild(b);
  });
}

/* ==================== 设置 ====================
   开关状态只有两个来源：S（存档里的值）和 decorOn()（按日期推出的默认值）。
   syncSettings 把状态写回界面，事件处理只改 S 再调它，避免两处各写一份。 */
function syncSettings(){
  $$('[data-toggle]').forEach(function(btn){
    const k = btn.dataset.toggle;
    const on = (k === 'decor') ? decorOn() : !!S[k];
    btn.classList.toggle('on', on);
  });
  $$('#diffSeg button').forEach(function(btn){
    btn.classList.toggle('on', btn.dataset.diff === S.difficulty);
  });
}
$$('[data-toggle]').forEach(function(btn){
  btn.addEventListener('click', function(){
    const k = btn.dataset.toggle;
    if(k === 'decor'){ S.decor = !decorOn(); }
    else { S[k] = !S[k]; }
    saveStore();
    syncSettings();
    applyDecor();
    if(k === 'sound' && S.sound) playMidi(60, 0.6);
    if(k === 'speech' && S.speech) say('语音已打开');
  });
});
$$('#diffSeg button').forEach(function(btn){
  btn.addEventListener('click', function(){
    S.difficulty = btn.dataset.diff;
    saveStore();
    syncSettings();
  });
});
$('#btnSettings').addEventListener('click', function(){
  syncSettings();
  $('#settingsModal').classList.add('open');
});
$('#btnCloseSettings').addEventListener('click', function(){
  $('#settingsModal').classList.remove('open');
});
$('#settingsModal').addEventListener('click', function(e){
  if(e.target === this) this.classList.remove('open');
});
/* 试听：本机上唯一一处「强制出声」，用来排查 iPad 到底是没有声音、
   还是静音开关被拨了、还是语音包缺失。
   iOS 允许在点击回调里创建 AudioContext 和朗读，所以这里不需要等手势。 */
$('#btnTrySound').addEventListener('click', function(){
  const c = audioCtx();
  if(c && c.state === 'suspended') c.resume();
  playMidi(60, 1.1, 0.34, true);
  say('这是中央 C，听到声音就说明正常', true);
  toast('听到「咚」和一句话，声音就正常', 'ok');
});

$('#btnReset').addEventListener('click', function(){
  S.stars = {};
  saveStore();
  renderHome();
  toast('已清空', 'ok');
});

/* ==================== 其他 ==================== */
/* 返回键、重听键；再禁掉 iOS 的双指缩放和双击放大，
   防止孩子把界面缩花了。 */
$('#btnBack').addEventListener('click', showHome);
$('#btnSpeak').addEventListener('click', function(){
  /* 第 1 关的题干不含音名，题目自己带 sayText（那个字母）；其他关读题干。 */
  say((G.q && G.q.sayText) || promptEl.textContent);
});
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive:false });
/* iOS 只在用户手势里允许创建/恢复 AudioContext。
   这里在第一次触摸时悄悄唤醒，之后各处的 playMidi 才能立刻出声。 */
document.addEventListener('pointerdown', function once(){
  audioCtx();
  document.removeEventListener('pointerdown', once);
}, { once:true });

window.__dbg = { G: G, NOTES: NOTES, VALUES: VALUES, UNIT: UNIT, voice: function(){ return [zhVoice && zhVoice.name, enVoice && enVoice.name]; } };
applyUnit();
applyDecor();
syncSettings();
showHome();

/* 离线缓存只在安全上下文里注册：https 或本机调试。
   直接双击打开 file:// 时浏览器不支持，注册会静默失败，属正常。 */
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
})();
</script>
