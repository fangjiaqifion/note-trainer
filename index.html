const CLEF_BASS = 'M567 -386c0,29,23,52,52,52s52,-23,52,-52s-23,-52,-52,-52s-52,23,-52,52z m0,250c0,29,23,52,52,52s52,-23,52,-52s-23,-52,-52,-52s-52,23,-52,52z m-323,136 c171,0,292,-86,292,-248c0,-263,-264,-415,-517,-521c-2,-2,-5,-3,-8,-3c-6,0,-11,5,-11,11c0,3,1,6,3,8c203,118,415,265,415,494c0,121,-64,237,-174,237c-79,0,-138,-57,-164,-133 c14,8,28,13,43,13c55,0,100,-45,100,-100c0,-58,-44,-107,-100,-107c-60,0,-112,48,-112,107c0,132,103,242,233,242z';
const INK = '#26252D';

/* 五条线。第 2–5 关的谱面和第 6 关的空白谱表共用这一份，
   线距、线宽只写一次，改一处两边都跟着变。

   五条线：y 从 0 到 4，一条线一个单位。线宽 0.075 单位，
   缩到卡片大小时大约 2px，打印和屏幕上都不糊。 */
function staffLinesMarkup(lineEnd){
  let g = '';
  for(let i = 0; i < 5; i++){
    g += '<line x1="0" y1="' + i + '" x2="' + lineEnd + '" y2="' + i + '" stroke="' + INK + '" stroke-width="0.075" stroke-linecap="round"/>';
  }
  return g;
}

/* 谱号：把原始 path 缩放平移到谱表左端。
   低音谱号的 scale 带负号，是因为它的原始 path 是倒着画的。
   第 3 关的选项图标另用 clefSVG，谱面上用的是这一份。 */
function clefMarkup(clef){
  if(clef === 'treble'){
    return '<g transform="translate(0.45 -1.26) scale(0.0071)"><path d="' + CLEF_TREBLE + '" fill="' + INK + '"/></g>';
  }
  if(clef === 'bass'){
    return '<g transform="translate(0.5 -0.05) scale(0.004016 -0.004016)"><path d="' + CLEF_BASS + '" fill="' + INK + '"/></g>';
  }
  return '';
}

function staffSVG(o){
  o = o || {};
  const noteId = o.noteId || 'C4';
  const n = NOTES[noteId];
  const clef = o.clef || n.clef;
  const valueId = o.value || 'quarter';
  const v = VALUES[valueId];
  const compact = !!o.compact;
  const noteX = o.noteX || (compact ? 6.4 : 8.9);
  const lineEnd = compact ? 11.7 : 14.6;
  const y = n.y;   // 只用配置里的线距坐标，后面不再换算
  let g = staffLinesMarkup(lineEnd);

  /* noClef 用于第 3 关「用哪个谱号」：谱号位置画一个浅色的问号，
     等孩子选对了再把谱号补上，所以这一个函数要能画两种状态。 */
  if(o.noClef){
    g += '<text x="1.2" y="2.6" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial" font-size="2.9" font-weight="700" fill="#DCCDB6" stroke="#FFFFFF" stroke-width="0.32" paint-order="stroke" stroke-linejoin="round">?</text>';
  }else{
    g += clefMarkup(clef);
  }

  /* 加线：只画音符左右各 1.15 单位的一小段，不是整条线。 */
  const ledger = (LEDGER[clef] || {})[noteId];
  if(ledger != null){
    g += '<line x1="' + (noteX - 1.15) + '" y1="' + ledger + '" x2="' + (noteX + 1.15) + '" y2="' + ledger + '" stroke="' + INK + '" stroke-width="0.075" stroke-linecap="round"/>';
  }

  /* 符杆方向就是左右手：右手朝上，左手朝下。
     这样孩子在屏幕上看到的和纸面谱一致，换回纸质谱不用重学。
     杆长固定 3.45 单位（约三个半线距），不随音高变化。 */
  /* 符杆方向一般由左右手决定，个别写法用 note.stem 覆盖：
     中央 C 写在低音谱号上加一线时在谱表上方，按惯例符杆朝下。 */
  const up = n.stem ? (n.stem === 'up') : (n.hand === 'R');
  if(v.stem){
    const sx = up ? noteX + 0.55 : noteX - 0.55;
    const y2 = up ? y - 3.45 : y + 3.45;
    g += '<line x1="' + sx + '" y1="' + (up ? y - 0.02 : y + 0.02) + '" x2="' + sx + '" y2="' + y2 + '" stroke="' + INK + '" stroke-width="0.105" stroke-linecap="round"/>';
  }
  /* 附点画在符头右侧。音符正好落在线上时（y 是整数），
     附点要往上挪半格，否则会和线重叠看不清。 */
  if(v.dot){
    const dy = (y === Math.round(y)) ? y - 0.5 : y;
    g += '<circle cx="' + (noteX + 1.38) + '" cy="' + dy + '" r="0.165" fill="' + INK + '"/>';
  }
  const rx = (v.id === 'whole') ? 0.7 : 0.58;
  g += '<ellipse cx="' + noteX + '" cy="' + y + '" rx="' + rx + '" ry="0.4" transform="rotate(-18 ' + noteX + ' ' + y + ')" fill="' + (v.filled ? INK : 'none') + '" stroke="' + INK + '" stroke-width="0.16"/>';

  /* 指法数字优先放在谱表外侧：音符在下方（y>=4）就写更下面，
     在上方（y<=0）就写更上面，中间的才跟着符杆方向走。
     颜色和卡通手上竖起的那根手指一致，孩子能把「谱子上的 1」
     和「图上竖起的拇指」连起来。白色描边是为了压在谱线上也读得清。 */
  if(o.finger){
    let fy;
    if(y >= 4) fy = y + 1.05;
    else if(y <= 0) fy = y - 1.05;
    else fy = up ? y - 1.05 : y + 1.05;
    g += '<text x="' + noteX + '" y="' + (fy + 0.34) + '" text-anchor="middle" font-family="PingFang SC, Helvetica, Arial" font-size="0.98" font-weight="700" fill="#C2528C" stroke="#FFFFFF" stroke-width="0.26" paint-order="stroke" stroke-linejoin="round">' + n.finger + '</text>';
  }

  const vb = compact ? '-0.35 -1.95 12.5 8.6' : '-0.35 -1.95 15.3 8.6';
  return '<svg class="staff" viewBox="' + vb + '" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">' + g + '</svg>';
}

function staffBlock(opts){
  return '<div class="paper">' + staffSVG(opts) + '</div>';
}

/* 第 6 关专用：只画五条线，不画音符、不加线，谱号可选。
   坐标与 staffSVG 完全一致，所以这一关看到的谱表和第 2–5 关一样大、
   谱号摆在同一个位置，孩子换关不用重新认。

   命中提示层也画在这里：每条线一根粗线，每个间一块淡色。
   它们平时透明（见 CSS 的 .hl），点中后才显形；题目代码只负责加减类名。
   这样做的好处是判定与显示共用同一套 y 坐标，不需要再算一遍像素位置。 */
function staffLinesSVG(o){
  o = o || {};
  const lineEnd = 14.6;
  let g = staffLinesMarkup(lineEnd);

  /* 第 n 间在 y = 4-n 与 y = 5-n 两条线之间（n 从 1 起，从下往上）。
     循环变量 i 是从上往下的格子编号：i=0 是最上面一间，也就是第 4 间。
     先画间、再画谱号：色块铺满整条谱表，但不会盖住左端的谱号；
     左右各留 1.05 单位，不在纸边露出半个色块。 */
  for(let i = 0; i < 4; i++){
    g += '<rect class="hl space" data-spot="space" data-n="' + (4 - i) + '" x="1.05" y="' + (i + 0.1) +
         '" width="' + (lineEnd - 2.1) + '" height="0.8" rx="0.1"/>';
  }

  g += clefMarkup(o.clef);

  /* 线的高亮最后画，才会压住黑线本身，而不是被黑线从中间劈开。
     y=0 是最上面一条线，也就是第 5 线；y=4 是最下面的一条，第 1 线。 */
  for(let i = 0; i < 5; i++){
    g += '<line class="hl line" data-spot="line" data-n="' + (5 - i) + '" x1="0" y1="' + i +
         '" x2="' + lineEnd + '" y2="' + i + '"/>';
  }

  return '<svg class="staff lines" viewBox="-0.35 -1.95 15.3 8.6" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">' + g + '</svg>';
}

/* 单独的谱号图标，第 3 关的两个选项用。
   直接用谱表里同一份 path，选项上看到的和谱表上画出来的必然一致。
   viewBox 取 path 的原始包围盒；低音谱号的原始 path 是倒着画的，
   图标这里也要翻一次才正。 */
function clefSVG(clef){
  if(clef === 'treble'){
    return '<svg class="cleficon treble" viewBox="0 0 353.8 1000" aria-hidden="true"><path d="' + CLEF_TREBLE + '" fill="' + INK + '"/></svg>';
  }
  return '<svg class="cleficon bass" viewBox="0 0 671 772" aria-hidden="true"><g transform="scale(1,-1)"><path d="' + CLEF_BASS + '" fill="' + INK + '"/></g></svg>';
}

/* ==================== 键盘 ====================
   默认从 C3 开始连续 15 个白键（两个八度多一点）；
   新音导入第一次用它时只给局部键盘（C4 到新音的几个白键）。
   黑键按「白键序号」定位，用百分比摆放，所以任何宽度都能自适应。
   白键用 data-midi 记录音高，判题时只比数字，不比 DOM 位置。

   start 是起始白键序号（0 = C3，7 = C4），count 是白键数。
   局部键盘和完整键盘共用这一套，黑键宽度按白键宽度算，换范围不会错位。 */
function buildKeyboard(kb, opts){
  opts = opts || {};
  kb.innerHTML = '';
  const start = opts.start || 0;
  const N = opts.count || 15;
  const w = 100 / N;
  const blackW = w * 0.585;   // 黑键约白键宽度的六成；旧版 3.9 / 6.667 就是这个比例
  let i, k, oct, deg, midi, el;

  for(i = 0; i < N; i++){
    k = start + i;
    oct = 3 + Math.floor(k / 7); deg = k % 7;
    midi = 12 * (oct + 1) + WHITE_OFF[deg];
    el = document.createElement('div');
    el.className = 'w';
    el.dataset.midi = midi;
    el.style.left = (i * w) + '%';
    el.style.width = w + '%';
    /* 中央 C 加一个小圆点做地标：孩子靠它找音组，不用数键。 */
    if(midi === 60){ el.classList.add('midc'); el.insertAdjacentHTML('beforeend', '<i class="middot"></i>'); }
    if(opts.labels) el.insertAdjacentHTML('beforeend', '<span class="lbl">' + letterOf(midi) + '</span>');
    if(opts.target === midi) el.classList.add('target');
    kb.appendChild(el);
  }
  /* 黑键贴在相邻白键之间。一个八度里只有 5 个黑键，
     对应 0,1,3,4,5 这几个白键位置（C# D# F# G# A#），
     2 和 6 之间是 E–F、B–C 的半音关系，没有黑键。 */
  for(i = 0; i < N; i++){
    k = start + i;
    deg = k % 7;
    if([0,1,3,4,5].indexOf(deg) < 0) continue;
    /* 最后一个白键右边已经出了本段键盘，不再画半个黑键。 */
    if(i === N - 1) continue;
    midi = 12 * (3 + Math.floor(k / 7) + 1) + WHITE_OFF[deg] + 1;
    el = document.createElement('div');
    el.className = 'b';
    el.dataset.midi = midi;
    el.style.left = ((i + 1) * w - blackW / 2) + '%';
    el.style.width = blackW + '%';
    if(opts.target === midi) el.classList.add('target');
    kb.appendChild(el);
  }
}

function makeKB(opts){
  opts = opts || {};
  const wrap = document.createElement('div');
  wrap.className = 'kb-wrap';
  const kb = document.createElement('div');
  kb.className = 'kb';
  buildKeyboard(kb, opts);
  /* 右上角的图例：说明键上的黄点是什么意思。
     图例只是说明，不参与点击，所以放在键盘外面单独一行，
     免得压住键、也免得和黑键的点击区域打架。
     键盘范围里没有中央 C 时不显示这一行，免得指着一个不存在的点。 */
  const start = opts.start || 0;
  const count = opts.count || 15;
  if(7 >= start && 7 < start + count){
    const legend = document.createElement('div');
    legend.className = 'kb-legend';
    legend.innerHTML = '<span><i class="lg-dot"></i>中央 C</span>';
    wrap.appendChild(legend);
  }
  wrap.appendChild(kb);
  /* 一屏同时出现谱面和键盘时，谱面让一点高度出来（见 CSS）。 */
  const play = $('#play');
  if(play) play.classList.add('with-kb');

  /* 用 pointerdown 而不是 click：iPad 上按下就出声、就有反馈，
     比等到抬起更跟手；preventDefault 防止 iOS 再把同一个手势
     派发成 click，避免一次点击判两次。

     按下时顺手把指针捕获到这一颗键上。否则手指按住后滑出键盘再抬起，
     pointerup 会落在别的元素上，onUp 永远不触发：键一直亮着，
     持续音也一直响，要等下一题才停。捕获之后，抬手事件一定回到原键。 */
  kb.addEventListener('pointerdown', function(e){
    const el = e.target.closest ? e.target.closest('.w,.b') : null;
    if(!el) return;
    e.preventDefault();
    if(el.setPointerCapture && e.pointerId != null){
      try { el.setPointerCapture(e.pointerId); } catch(err){}
    }
    const midi = Number(el.dataset.midi);
    el.classList.add('on');
    playMidi(midi, 0.9);
    if(opts.onDown) opts.onDown(midi, el);
  }, { passive:false });

  /* 不再监听 pointerleave：手指滑出键面不等于松手，
     有了指针捕获，真正的抬手只会有 pointerup / pointercancel。 */
  ['pointerup','pointercancel'].forEach(function(ev){
    kb.addEventListener(ev, function(e){
      const el = e.target.closest ? e.target.closest('.w,.b') : null;
      if(!el) return;
      el.classList.remove('on');
      if(opts.onUp) opts.onUp(Number(el.dataset.midi), el);
    });
  });
  return wrap;
}

/* ==================== 通用 UI ==================== */
const stageEl = $('#stage');
const answerEl = $('#answer');
const promptEl = $('#promptText');
const toastEl = $('#toast');
const fxEl = $('#fx');
let toastTimer = null;

function setPrompt(text, speakText){
  promptEl.textContent = text;
  if(S.speech && speakText !== false) say(speakText || text);
}
function toast(text, kind){
  toastEl.textContent = text;
  toastEl.className = 'toast show ' + (kind || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.className = 'toast'; }, 1300);
}
const PRAISE = ['对啦','真棒','好听','好厉害','就是这样','很好'];
function praise(){ return pick(PRAISE); }

function confetti(){
  if(!decorOn()) return;
  const bits = ['🍬','⭐','🎃','🦇','✨','🍭'];
  for(let i = 0; i < 12; i++){
    const s = document.createElement('i');
    s.className = 'confetti';
    s.textContent = pick(bits);
    s.style.left = (46 + Math.random() * 8) + '%';
    s.style.top = (30 + Math.random() * 8) + '%';
    s.style.fontSize = (14 + Math.random() * 14) + 'px';
    s.style.setProperty('--dx', (Math.random() * 320 - 160).toFixed(0) + 'px');
    s.style.setProperty('--dy', (-60 - Math.random() * 170).toFixed(0) + 'px');
    s.style.setProperty('--rot', (Math.random() * 360).toFixed(0) + 'deg');
    fxEl.appendChild(s);
    (function(el){ setTimeout(function(){ el.remove(); }, 1000); })(s);
  }
}

/* ==================== 游戏状态 ====================
   全局只有一个可变对象 G：
     mode    'skill' 六张技能卡 / 'daily' 今日练习 / 'spotlight' 新音导入 /
             'note' 单音复习
     level   技能模式下的关卡编号（1–6），也是星星的存档键
     qs      这一次练习的题目数组（开始时一次性生成，中途不变）
     i       第几题
     first   一次答对的题数，结算时换算星星
     q       当前题目对象
     busy    判对之后到换题之前的锁，防止连点
     session 会话号，每进一次练习 +1；所有定时器回调靠它判断自己是否过期
     spotNote / spotFrom / spotCount
             当前新音、从第几步开始、这次走了几步；只有导入和每日练习用 */
const G = { mode:'skill', level:1, qs:[], i:0, first:0, q:null, busy:false, session:0,
            spotNote:null, spotFrom:0, spotCount:0 };
/* 当前题里正在跑的「按住」控制器（见 holdPad）。换题、退出关卡时
   要显式停掉，否则定时器和持续音会越过题目边界继续跑。 */
let activePad = null;

function updateDots(){
  const dots = $('#dots');
  dots.innerHTML = '';
  for(let i = 0; i < G.qs.length; i++){
    const d = document.createElement('i');
    d.className = 'dot' + (i < G.i ? ' done' : (i === G.i ? ' now' : ''));
    dots.appendChild(d);
  }
}

/* 判题的唯一入口。题型层只负责调用，不直接改 G。
   对的路径：记一次答对 → 提示 → 等 wait 毫秒 → 换下一题或结算。
   错的路径：累加 q.wrong，错够 hintAfter 次就调用题目的 reveal()
   给提示（高亮正确的键、或在标题里说出答案），但不告诉孩子「错了」。
   always = true 时这句提示每次都显示，不只在第一次错时显示：
   第 5 关一题有三段，每段第一次错都该看到本段的方法提示。 */
function judge(ok, msg, wait, always){
  const q = G.q;
  if(!q || q.answered || G.busy) return;
  if(ok){
    /* 先把会话号存下来：延时结束时会话可能已经变了，那时不能再往下走。 */
    const session = G.session;
    q.answered = true;
    G.busy = true;
    if(!q.wrong) G.first++;
    toast('✓ ' + (msg || praise()), 'ok');
    confetti();
    delay(wait || 1050, function(){
      if(session !== G.session) return;
      G.busy = false;
      G.i++;
      if(G.i >= G.qs.length) finishLevel();
      else renderQuestion();
    });
  }else{
    q.wrong = (q.wrong || 0) + 1;
    toast(msg && (always || q.wrong === 1) ? msg : '再试一次', 'bad');
    if(q.wrong >= diff().hintAfter && q.reveal) q.reveal();
  }
}

/* 换题：先停掉上一题的按住与长音，再清空舞台、答案区、状态，
   最后交给题目自己的 render()。
   注意每次都重建 DOM，不复用节点，避免上一题的监听器残留。 */
function renderQuestion(){
  if(activePad){ activePad.stop(); activePad = null; }
  stopAllTones();
  const q = G.qs[G.i];
  G.q = q;
  G.busy = false;
  /* 记一下这个音最近出现过。只用于「最久没练」的轮换，
     和判对错无关；所以放在渲染时，不放在 judge 里。 */
  markSeen(q.noteId);
  $('#play').classList.remove('with-kb');
  answerEl.className = 'answer';
  stageEl.className = 'stage';
  stageEl.innerHTML = '';
  answerEl.innerHTML = '';
  updateDots();
  q.render();
}

/* ==================== 题目 ====================
   每个 q* 都是一个工厂，返回同一套接口：
     kind    题型标识，用于统计和「按住题不排第一」这类规则
     render  画题、绑交互；判对判错一律调 judge()
     reveal  错够次数后的提示
   题目对象自己保存题目参数（noteId、valueId、beats），
   因此同一个工厂可以被不同参数调用很多次，互不干扰。 */

/* 第 1 关：给音名，在键盘上点出来。只看音级，不区分音组，
   所以任何一个 C 都对，这一关不考八度位置。

   题干只说任务、不重复音名：要按的音就是屏幕上那个大写字母。
   第一题把整句话念一遍，之后每题只念这个字母，
   孩子不识字也知道要按哪个音，不必每题都听一遍「找到 B」。 */
function qFindKey(letter){
  return {
    /* 题面上没有「找到 B」，但「再听一遍」按钮应该念出这道题的字母，
       所以把要念的内容挂在题目上，按钮优先读它。 */
    kind:'find', letter:letter, sayText:letter, wrong:0,
    render: function(){
      const first = G.i === 0;
      setPrompt('在键盘上找到展示音名的位置',
                first ? '在键盘上找到展示音名的位置 ' + letter : letter);
      stageEl.classList.add('letter');
      stageEl.innerHTML = '<div class="big-letter">' + letter + '</div><div class="down-arrow">↓</div>';
      const kb = makeKB({
        labels: S.labels,
        onDown: function(midi, el){
          if(G.q.answered) return;
          if(letterOf(midi) === letter){
            el.classList.add('correct');
            judge(true, '对！这是 ' + letter);
          }else{
            el.classList.add('wrong');
            setTimeout(function(){ el.classList.remove('wrong'); }, 420);
            judge(false);
          }
        }
      });
      answerEl.appendChild(kb);
    },
    reveal: function(){
      $$('.kb .w, .kb .b', answerEl).forEach(function(k){
        if(letterOf(Number(k.dataset.midi)) === letter) k.classList.add('hint');
      });
    }
  };
}

/* 第 2 关（双向之一）：给谱面，在键盘上点出这个音。
   和上一关不同，这里必须对上具体音组：D4 不能点成 D5。
   新音导入会传 hint：错够次数后补一句这个音在谱表上的位置。 */
function qStaffToKey(noteId, valueId, hint){
  const note = NOTES[noteId];
  return {
    kind:'s2k', noteId:noteId, valueId:valueId || 'quarter', wrong:0,
    render: function(){
      setPrompt('这个音在键盘上哪里？', '这个音在键盘上哪里');
      stageEl.innerHTML = staffBlock({ noteId:noteId, value: valueId || 'quarter' });
      const kb = makeKB({
        labels: S.labels,
        onDown: function(midi, el){
          if(G.q.answered) return;
          if(midi === note.midi){
            el.classList.add('correct');
            judge(true, '对！这是 ' + note.label);
          }else{
            el.classList.add('wrong');
            setTimeout(function(){ el.classList.remove('wrong'); }, 420);
            judge(false);
          }
        }
      });
      answerEl.appendChild(kb);
    },
    reveal: function(){
      $$('.kb .w, .kb .b', answerEl).forEach(function(k){
        if(Number(k.dataset.midi) === note.midi) k.classList.add('hint');
      });
      if(hint) setPrompt(hint);
    }
  };
}

/* 第 2 关（双向之二）：高亮一个键，从几张谱例里挑出对应的那张。
   options 决定给几张：轻松档 2 张，其余 3 张；干扰项默认从已学的
   谱面音里抽。新音导入会传入局部池（如 D/E 两个音），把比较限制在
   邻居之间。 */
function qKeyToStaff(noteId, pool){
  const note = NOTES[noteId];
  const ids = pool || activeNotes(['key','pos']);
  const n = diff().options >= 3 ? 3 : 2;
  const others = shuffle(ids.filter(function(x){ return x !== noteId; })).slice(0, n - 1);
  const order = shuffle([noteId].concat(others));

  return {
    kind:'k2s', noteId:noteId, wrong:0,
    render: function(){
      setPrompt('这个键在五线谱上是哪一个？', '这个键在五线谱上是哪一个');
      const stack = document.createElement('div');
      stack.className = 'stack';
      stack.appendChild(makeKB({ labels: S.labels, target: note.midi }));
      const row = document.createElement('div');
      row.className = 'cards-row';
      order.forEach(function(id){
        const b = document.createElement('button');
        b.className = 'card-btn';
        b.dataset.note = id;
        b.innerHTML = staffSVG({ noteId:id, compact:true });
        b.addEventListener('click', function(){
          if(G.q.answered) return;
          if(id === noteId){
            b.classList.add('correct');
            playMidi(note.midi, 0.9);
            judge(true, '对！这是 ' + note.label);
          }else{
            b.classList.add('wrong');
            setTimeout(function(){ b.classList.remove('wrong'); }, 500);
            judge(false);
          }
        });
        row.appendChild(b);
      });
      stack.appendChild(row);
      stageEl.appendChild(stack);
    },
    reveal: function(){
      $$('.card-btn', stageEl).forEach(function(c){
        if(c.dataset.note === noteId) c.classList.add('correct');
      });
      setPrompt(note.label + ' 在这里', false);
    }
  };
}

/* 音名写法：单个字母前面留一个空格（「这是 B」），中文说明不留（「这是中央 C」）。 */
function labelOf(n){
  return /^[A-Z]$/.test(n.label) ? ' ' + n.label : n.label;
}

/* 第 3 关：谱表上画一个音、不画谱号，告诉孩子这是什么音，问该用哪个谱号。
   规则就一条，本单元的三个音都落在它上面：
     比中央 C 低的音写低音谱号；中央 C 和比它高的音写高音谱号。
   答对之后把谱号补到谱表左边，孩子能直接看到「放对了」。
   谱面不画谱号时，音符的纵向位置本来就说明不了音名，
   所以音名必须在题干里给出，这一关考的是「这个音归哪个谱号」。 */
function qClef(noteId){
  const n = NOTES[noteId];
  const right = n.clef;
  const name = (right === 'treble') ? '高音谱号' : '低音谱号';
  return {
    kind:'clef', noteId:noteId, wrong:0,
    render: function(){
      setPrompt('这个音符是' + labelOf(n) + '，用哪个谱号？', '这个音符是' + labelOf(n) + '，用哪个谱号');
      stageEl.innerHTML = staffBlock({ noteId:noteId, noClef:true });
      const box = document.createElement('div');
      box.className = 'opts';
      [['高音谱号','treble'], ['低音谱号','bass']].forEach(function(pair){
        const b = document.createElement('button');
        b.className = 'opt clef';
        b.dataset.clef = pair[1];
        b.innerHTML = clefSVG(pair[1]) + '<span class="unit">' + pair[0] + '</span>';
        b.addEventListener('click', function(){
          if(G.q.answered) return;
          if(pair[1] === right){
            b.classList.add('correct');
            /* 把谱号补上：刚才那个问号的位置现在有谱号了。 */
            stageEl.innerHTML = staffBlock({ noteId:noteId });
            playMidi(n.midi, 0.9);
            judge(true, '对，' + n.label + ' 用' + name);
          }else{
            b.classList.add('wrong');
            setTimeout(function(){ b.classList.remove('wrong'); }, 500);
            judge(false, n.clefHint || '先看这个音在谱表的哪一边', 0, true);
          }
        });
        box.appendChild(b);
      });
      answerEl.appendChild(box);
    },
    reveal: function(){
      /* 提示时把正确的谱号直接画进谱表，孩子在选之前就能看见「放对了」是什么样。 */
      stageEl.innerHTML = staffBlock({ noteId:noteId });
      $$('.opt.clef', answerEl).forEach(function(b){
        if(b.dataset.clef === right) b.classList.add('correct');
      });
      setPrompt('这个音符是' + labelOf(n) + '，用' + name, false);
    }
  };
}

/* 生成拍数选项：正确项 + 从剩下的 1–4 里随机补足，最后整体打乱。 */
function beatsOptions(correct, n){
  const pool = [1,2,3,4].filter(function(x){ return x !== correct; });
  return shuffle([correct].concat(shuffle(pool).slice(0, n - 1)));
}

/* ==================== 按住练习 ====================
   第 4、5 关共用：把「这个音符有多长」变成按住琴键的实际时长。

   什么时候松手，孩子自己判断：按住正确的键以后，屏幕上只有一个
   从 0 开始、每过一拍加 1 的计数器，声音不在到点时收掉，也没有
   提前排好的拍子格。音符是 2 拍就数到 2 松手，和谱面对得上。

   上下两个方向都判：按太短是错，按过头同样是错。容差 tol 拍
   （默认 0.3）放过的只是「晚一点松手」；超过 tolOver 拍（默认 0.62）
   才算过头。手指抬起总会晚一点，对 4 岁的孩子宁可放过，
   也不要为 0.1 拍判错。

   没有预备拍。按下就是第一拍，孩子什么时候准备好就什么时候开始。

   这个函数不判对错，成功与失败都交给 onRelease(ok, held, tries, reason)，
   reason 是 'short' 或 'long'。由题目决定算不算一次错、该怎么提示；
   同一题错两次以后会把正确的键标出来。第 4 关的按住答对拍数后才开始，
   第 5 关的按住就是最后一段，两关都按普通题目判。

   返回 { stop }。换题、退出关卡时必须调用，否则定时器与持续音
   会跟到下一题去。调用 stop 之后不再接受按压。 */
function holdPad(host, noteId, beats, opts){
  opts = opts || {};
  const note = NOTES[noteId];
  const MS = Math.round(60000 / diff().bpm);
  const tol = (opts.tol == null) ? 0.3 : opts.tol;
  const over = (opts.tolOver == null) ? 0.62 : opts.tolOver;
  const session = G.session;
  let count = 0, ticks = 0, timer = null, tone = null, pressAt = 0, tries = 0;
  let finished = false, resetTimer = null;

  const box = document.createElement('div');
  box.className = 'beat-box';
  /* 一个圆，按下后从 0 开始，每过一拍加 1。
     它只显示「已经按住几拍」，没有「一共几格」，所以看不出答案。 */
  const circle = document.createElement('div');
  circle.className = 'beat-live';
  circle.textContent = '·';
  const cap = document.createElement('div');
  cap.className = 'beat-cap';
  box.appendChild(circle);
  box.appendChild(cap);
  host.appendChild(box);

  function live(v, on){
    circle.textContent = String(v);
    circle.classList.toggle('on', !!on);
  }
  function stopTimer(){ if(timer){ clearInterval(timer); timer = null; } }
  function releaseTone(fade){ if(tone){ tone.stop(fade == null ? 0.14 : fade); tone = null; } }
  function idleCap(){ cap.textContent = '按住这个音，自己数拍子'; }
  function hintKey(){
    $$('.w,.b', kb).forEach(function(k){
      if(Number(k.dataset.midi) === note.midi) k.classList.add('hint');
    });
  }

  const kb = makeKB({
    labels: S.labels,
    onDown: function(midi, el){
      if(finished) return;
      if(midi !== note.midi){
        el.classList.add('wrong');
        setTimeout(function(){ el.classList.remove('wrong'); }, 420);
        if(opts.onWrong) opts.onWrong(midi);
        return;
      }
      if(resetTimer){ clearTimeout(resetTimer); resetTimer = null; }
      stopTimer(); releaseTone(0.06);
      count = 1; ticks = 0; pressAt = performance.now();
      /* 按下就是第 1 拍：数字立刻显示 1，并响一声。
         之后每过一拍才加一，加到音符的拍数就停住，不再加、不再响：
         全音符显示 1、2、3、4 并响四声，二分音符 1、2 响两声。
         最后一拍要让这个数字保持一拍——第 N 声之后按住一拍再松手，
         刚好是 N 拍；这也是孩子要自己数的那一拍。 */
      tone = startTone(midi);
      live(1, true);
      clickSound();
      cap.textContent = '数拍子，数够了就松手';
      timer = setInterval(function(){
        if(session !== G.session){ stopTimer(); return; }
        ticks++;
        /* 已经数到音符的拍数：停在这里，不多出第 N+1 个数。 */
        if(ticks >= beats){ stopTimer(); return; }
        count = ticks + 1;
        live(count, true);
        clickSound();
      }, MS);
    },
    onUp: function(){
      if(finished || !pressAt) return;
      stopTimer();
      releaseTone();
      const held = (performance.now() - pressAt) / MS;
      pressAt = 0;
      tries++;
      const tooLong = held > beats + over;
      if(held >= beats - tol && !tooLong){
        finished = true;
        live(beats, false);
        cap.textContent = '正好 ' + beats + ' 拍';
        if(opts.onRelease) opts.onRelease(true, held, tries);
        return;
      }
      live('·', false);
      cap.textContent = '这个音符是 ' + beats + ' 拍';
      /* 第 4 个参数告诉题目是「太短」还是「太长」，题目不用自己再算一遍容差。 */
      if(opts.onRelease) opts.onRelease(false, held, tries, tooLong ? 'long' : 'short');
      if(tries >= 2) hintKey();
      resetTimer = setTimeout(function(){
        resetTimer = null;
        if(finished || session !== G.session) return;
        cap.textContent = '这个音符是 ' + beats + ' 拍，再试一次';
      }, 1800);
    }
  });
  host.appendChild(kb);
  idleCap();

  const api = {
    stop: function(){
      finished = true;
      stopTimer();
      releaseTone(0.08);
      if(resetTimer){ clearTimeout(resetTimer); resetTimer = null; }
    }
  };
  activePad = api;
  return api;
}

/* 第 4 关（之一）：读谱面上的音符，判断几拍。
   这一关要孩子自己完成三件事：这是什么音、在键盘哪里、弹多长。
   所以答对拍数之后，键盘不会亮键、也不会排出拍子格：
   位置和时长都得自己从谱面读出来，按错了照常记错、可以说「这是 D」。
   以前的版本把键和拍子格都摆好，孩子只需要跟着按，思考被省掉了。 */
function qBeats(noteId, valueId){
  const v = VALUES[valueId];
  const n = NOTES[noteId];
  const opts = beatsOptions(v.beats, diff().options === 2 ? 2 : 4);
  let stage = 1;
  return {
    kind:'beats', noteId:noteId, valueId:valueId, wrong:0,
    render: function(){
      stage = 1;
      setPrompt('这个音符是几拍？', '这个音符是几拍');
      stageEl.innerHTML = staffBlock({ noteId:noteId, value:valueId });
      const box = document.createElement('div');
      box.className = 'opts';
      let picked = false;
      opts.forEach(function(num){
        const b = document.createElement('button');
        b.className = 'opt';
        b.innerHTML = '<span class="num">' + num + '</span><span class="unit">拍</span><span class="pips">' + '●'.repeat(num) + '</span>';
        b.addEventListener('click', function(){
          if(picked || G.q.answered) return;
          if(num !== v.beats){
            b.classList.add('wrong');
            setTimeout(function(){ b.classList.remove('wrong'); }, 500);
            judge(false);
            return;
          }
          picked = true;
          b.classList.add('correct');
          toast('对，' + v.beats + ' 拍', 'ok');
          holdIt();
        });
        box.appendChild(b);
      });
      answerEl.appendChild(box);

      /* 第二段：不亮键、不排拍子格，孩子先要在键盘上找到这个音，
         再自己数拍子按够长度。失败照常记错，提示只给「先找到这个音」。 */
      function holdIt(){
        stage = 2;
        answerEl.innerHTML = '';
        answerEl.className = 'answer hold';
        setPrompt('在键盘上找到这个音，弹够它该有的长度', '在键盘上找到这个音，弹够它该有的长度');
        holdPad(answerEl, noteId, v.beats, {
          onWrong: function(){ judge(false, '先找到这个音', 0, true); },
          onRelease: function(ok, held, tries, reason){
            if(ok){
              judge(true, '对！' + v.name + '是 ' + v.beats + ' 拍');
            }else if(reason === 'long'){
              judge(false, '长了：' + v.name + '是 ' + v.beats + ' 拍', 0, true);
            }else if(held < 0.5){
              judge(false, '太短了，要按住不放', 0, true);
            }else{
              judge(false, '短了：你弹了 ' + Math.round(held) + ' 拍，' + v.name + '是 ' + v.beats + ' 拍', 0, true);
            }
          }
        });
      }
    },
    reveal: function(){
      if(stage === 1){
        $$('.opt', answerEl).forEach(function(b){
          const num = b.querySelector('.num');
          if(num && Number(num.textContent) === v.beats) b.classList.add('correct');
        });
        setPrompt(v.name + '：' + v.beats + ' 拍', false);
      }else{
        setPrompt('这是' + labelOf(n) + '，弹 ' + v.beats + ' 拍', false);
      }
    }
  };
}

/* 第 4 关（之二）：反过来问，给时值名称，从几个谱例里挑出对应的音符。
   干扰项固定抽两个其它时值，所以永远是三选一。
   选对之后同样接一段「按住」，把刚才认出来的形状按真实长度弹一遍。 */
function qWhichShape(noteId, valueId){
  const v = VALUES[valueId];
  const n = NOTES[noteId];
  const others = shuffle(VALUE_IDS.filter(function(x){ return x !== valueId; })).slice(0, 2);
  const choices = shuffle([valueId].concat(others));
  let stage = 1;
  return {
    kind:'shape', noteId:noteId, valueId:valueId, wrong:0,
    render: function(){
      stage = 1;
      setPrompt('哪个是' + v.name + '？', '哪个是' + v.name);
      stageEl.innerHTML = '<div class="qmark">?</div>';
      let picked = false;
      choices.forEach(function(id){
        const b = document.createElement('button');
        b.className = 'card-btn';
        b.dataset.value = id;
        b.innerHTML = staffSVG({ noteId:noteId, value:id, compact:true });
        b.addEventListener('click', function(){
          if(picked || G.q.answered) return;
          if(id !== valueId){
            b.classList.add('wrong');
            setTimeout(function(){ b.classList.remove('wrong'); }, 500);
            judge(false);
            return;
          }
          picked = true;
          b.classList.add('correct');
          /* 把问号换成刚选中的那个谱面，孩子能对着它按。
             键盘不亮键、也不排拍子格：音在哪里、弹几拍都由孩子自己读谱决定。 */
          stage = 2;
          stageEl.innerHTML = staffBlock({ noteId:noteId, value:valueId });
          answerEl.innerHTML = '';
          answerEl.className = 'answer hold';
          setPrompt('在键盘上找到这个音，弹够它该有的长度', '在键盘上找到这个音，弹够它该有的长度');
          holdPad(answerEl, noteId, v.beats, {
            onWrong: function(){ judge(false, '先找到这个音', 0, true); },
            onRelease: function(ok, held, tries, reason){
              if(ok){
                judge(true, '对！' + v.name + '是 ' + v.beats + ' 拍');
              }else if(reason === 'long'){
                judge(false, '长了：' + v.name + '是 ' + v.beats + ' 拍', 0, true);
              }else if(held < 0.5){
                judge(false, '太短了，要按住不放', 0, true);
              }else{
                judge(false, '短了：你弹了 ' + Math.round(held) + ' 拍，' + v.name + '是 ' + v.beats + ' 拍', 0, true);
              }
            }
          });
        });
        answerEl.appendChild(b);
      });
    },
    reveal: function(){
      if(stage === 2){
        setPrompt('这是' + labelOf(n) + '，弹 ' + v.beats + ' 拍', false);
        return;
      }
      $$('.card-btn', answerEl).forEach(function(b, idx){
        if(choices[idx] === valueId) b.classList.add('correct');
      });
    }
  };
}

/* ==================== 卡通手 ====================
   手掌朝前、手指朝上，五指始终伸开。右手拇指在左，左手整只镜像，
   所以「拇指在哪边」就是左右手的区别，两只手永远画得一模一样。

   ring = 0      不戴戒指，判左右手用
   ring = 1..5   在这一根手指上戴一枚指法色的戒指，判指法用

   为什么用戒指而不是竖手指：竖中指是个不雅手势，而且「竖起一根、
   其余蜷起」的手形本身会让孩子去模仿手势，而不是记住手指的位置。
   五指都伸开、只在目标手指上加一枚戒指，看的是「戒指在哪根手指上」。

   画法分两层：先把同样几个形状放大 3 画成深色，再压上正常大小的肤色。
   两层的差集只剩一圈外轮廓，手指和手掌接缝处不会出现多余的线，
   看起来像一张贴纸，也就是儿童插画里的卡通手。

   拇指用深一档的肤色，五根手指按解剖长度：中指最长，小指最短。 */
const HAND_SKIN = '#FFD7B0', HAND_THUMB = '#F4BE8F', HAND_INK = '#3B3A44';
/* 袖口颜色按手分：左手蓝、右手珊瑚红。很多儿童钢琴教材也用这套配色，
   孩子记不住「拇指在哪边」时，至少颜色能帮上忙，不会选错一整只手。 */
const HAND_CUFF = { L:'#9FC2EA', R:'#F2B3AA' };
const FINGER_NAME = ['', '拇指', '食指', '中指', '无名指', '小指'];

function handSVG(side, ring){
  ring = ring || 0;
  const ext = [20, 8, 15, 28];       // 食指、中指、无名指、小指伸开时的顶端
  const xs = [35, 52, 69, 86];
  const W = 14, bottom = 80, palmTop = 54;
  const parts = [];

  for(let i = 0; i < 4; i++){
    parts.push({ x: xs[i], y: ext[i], w: W, h: bottom - ext[i], rx: W / 2, f: HAND_SKIN });
  }
  parts.push({ x:23, y:52, w:19, h:38, rx:9.5, f:HAND_THUMB, rot:'rotate(-38 32.5 90)' });
  parts.push({ x:33, y:palmTop, w:64, h:60, rx:20, f:HAND_SKIN });

  function shape(p, e){
    return '<rect x="' + (p.x - e) + '" y="' + (p.y - e) + '" width="' + (p.w + 2*e) + '" height="' + (p.h + 2*e) +
      '" rx="' + (p.rx + e) + '"' + (p.rot ? ' transform="' + p.rot + '"' : '') + ' fill="' + p.f + '"/>';
  }
  let g = '';
  parts.forEach(function(p){ g += shape(p, 3).replace('fill="' + p.f + '"', 'fill="' + HAND_INK + '"'); });
  parts.forEach(function(p){ g += shape(p, 0); });

  /* 指甲：让「手背朝上、放在琴键上」的姿势看得出来。 */
  for(let i = 0; i < 4; i++){
    g += '<ellipse cx="' + (xs[i] + W/2) + '" cy="' + (ext[i] + 8) + '" rx="3.2" ry="4.2" fill="#FFF0E0"/>';
  }
  g += '<rect x="40" y="104" width="50" height="24" rx="12" fill="' + (HAND_CUFF[side] || '#CBD9EA') + '" stroke="' + HAND_INK + '" stroke-width="3"/>';

  /* 戒指：横箍在手指上的一小条，颜色与谱面上的指法数字一致。
     拇指是斜着的，所以那一枚跟着拇指一起转。 */
  if(ring >= 2 && ring <= 5){
    g += '<rect x="' + (xs[ring-2] - 1) + '" y="' + (ext[ring-2] + 9) + '" width="' + (W + 2) + '" height="6" rx="3" fill="#C2528C"/>';
  }
  if(ring === 1){
    g += '<rect x="21.8" y="65" width="21.4" height="6" rx="3" fill="#C2528C" transform="rotate(-38 32.5 90)"/>';
  }

  /* 右手形状不动，左手整体镜像；平移 10 把整只手挪到画布正中，
     这样左右两只并排时大小、位置完全对称。 */
  const shift = ' translate(10,0)';
  const mirror = (side === 'L') ? ' translate(120,0) scale(-1,1)' : '';
  return '<svg viewBox="-4 0 128 132" aria-hidden="true"><g transform="' + mirror + shift + '">' + g + '</g></svg>';
}

/* 指法选项：正确答案 + 从已经学过的指法里补足。
   基础三个音只用到 1–3，所以一开始不会冒出 4、5；
   学过 F（4 指）或 G（5 指）以后，选项才扩到 4、5。
   这样选项范围跟着音集长大，而不是一上来就给五根手指。 */
function maxLearnedFinger(){
  const fs = activeNotes(['key','pos','fin']).map(function(id){ return NOTES[id].finger; })
    .filter(function(f){ return f > 0; });
  return fs.length ? Math.max.apply(null, fs) : 3;
}
function fingerChoices(correct, n){
  const top = Math.max(3, maxLearnedFinger());
  const pool = [];
  for(let i = 1; i <= top; i++){ if(i !== correct) pool.push(i); }
  const take = Math.max(1, Math.min(n, top)) - 1;
  return shuffle([correct].concat(shuffle(pool).slice(0, take)));
}

/* ==================== 第 5 关：先判手，再判指，最后弹够拍子 ====================
   一题三段，顺序就是学一个音的指法的顺序：
     ① 看符杆判左右手
     ② 看谱面上的指法数字，从两三只卡通手里选出对应的手指
     ③ 用这只手、这根手指按住琴键，弹够这个音符该有的长度
   前两段只是过渡：答对就进下一段，不调用 judge；整题只在第三段
   弹对长度时 judge(true)。中间答错照样记错、错够次数照样给提示，
   所以「一次答对」仍然要求三段都一遍过。

   第三段和第 4 关的反向题一样不告诉拍数：拍数要从谱面读出来，
   按住的计时器只显示「已经数到几」，几拍该松手由孩子自己判断。 */
function qPlayNote(noteId, valueId){
  const n = NOTES[noteId];
  const v = VALUES[valueId];
  const right = n.hand === 'R';
  const handName = right ? '右手' : '左手';
  const session = G.session;
  let stage = 0, lock = false;

  /* 答对到换段之间锁一下，免得孩子连点把同一段答两次。 */
  function go(fn){
    lock = true;
    delay(640, function(){
      if(session !== G.session || G.q.answered) return;
      if(!$('#play').classList.contains('active')) return;
      lock = false;
      fn();
    });
  }
  function staff(){ return staffBlock({ noteId:noteId, value:valueId, finger:true }); }
  function reset(cls){
    answerEl.className = cls;
    answerEl.innerHTML = '';
    return answerEl;
  }
  function shake(b){
    b.classList.add('wrong');
    setTimeout(function(){ b.classList.remove('wrong'); }, 500);
  }

  /* 第一段：左右手。判定用 NOTES 里的 hand，和画符杆是同一份数据。 */
  function askHand(){
    stage = 1;
    setPrompt('先用哪只手？', '这个音用哪只手弹');
    stageEl.innerHTML = staff();
    const box = document.createElement('div');
    box.className = 'opts';
    [['左手','L'], ['右手','R']].forEach(function(pair){
      const b = document.createElement('button');
      b.className = 'opt hand';
      b.dataset.side = pair[1];
      b.innerHTML = handSVG(pair[1], 0) + '<span class="unit">' + pair[0] + '</span>';
      b.addEventListener('click', function(){
        if(lock || G.q.answered) return;
        if(pair[1] === n.hand){
          b.classList.add('correct');
          toast('对，' + handName, 'ok');
          go(askFinger);
        }else{
          shake(b);
          judge(false, '看符杆：朝上是右手，朝下是左手', 0, true);
        }
      });
      box.appendChild(b);
    });
    reset('answer').appendChild(box);
  }

  /* 第二段：指法。选项是手，不是数字，孩子得知道「1 就是拇指」。 */
  function askFinger(){
    stage = 2;
    setPrompt('用哪个手指？', '谱子上写的是 ' + n.finger + '，用哪个手指');
    stageEl.innerHTML = staff();
    const box = document.createElement('div');
    box.className = 'opts';
    fingerChoices(n.finger, diff().options).forEach(function(f){
      const b = document.createElement('button');
      b.className = 'opt finger';
      b.dataset.finger = String(f);
      b.innerHTML = handSVG(n.hand, f) + '<span class="unit">' + FINGER_NAME[f] + '</span>';
      b.addEventListener('click', function(){
        if(lock || G.q.answered) return;
        if(f === n.finger){
          b.classList.add('correct');
          toast('对，' + n.finger + ' 指是' + FINGER_NAME[n.finger], 'ok');
          go(askPlay);
        }else{
          shake(b);
          judge(false, '手指从拇指数起：1 拇指，2 食指', 0, true);
        }
      });
      box.appendChild(b);
    });
    reset('answer').appendChild(box);
  }

  /* 第三段：真的把音按出来，并弹够时值。
     不显示拍子格，只显示已经按住几拍，几下该松手由孩子自己数。 */
  function askPlay(){
    stage = 3;
    setPrompt(handName + ' ' + n.finger + ' 指，按住这个音，弹够它该有的长度',
              '用' + handName + n.finger + '指按住这个音，弹够它该有的长度');
    stageEl.innerHTML = staff();
    reset('answer hold');
    holdPad(answerEl, noteId, v.beats, {
      onWrong: function(){ judge(false, '先找到这个音', 0, true); },
      onRelease: function(ok, held, tries, reason){
        /* 弹长弹短的反馈每次都要说出来，不能被「再试一次」盖掉。 */
        if(ok){
          judge(true, '对！' + handName + ' ' + n.finger + ' 指，' + v.name + '弹 ' + v.beats + ' 拍');
        }else if(reason === 'long'){
          judge(false, '长了：' + v.name + '是 ' + v.beats + ' 拍', 0, true);
        }else if(held < 0.5){
          judge(false, '太短了，要按住不放', 0, true);
        }else{
          judge(false, '短了：你弹了 ' + Math.round(held) + ' 拍，' + v.name + '是 ' + v.beats + ' 拍', 0, true);
        }
      }
    });
  }

  /* 错够次数后的提示，按当前在第几段决定提示什么，答案直接标在选项上。 */
  function reveal(){
    if(stage === 1){
      /* 把「拇指在哪边」一起说出来：这是两只手真正的区别，也是孩子
         下次能自己判断的依据，不能只丢一个「右手」的结论。 */
      setPrompt('符杆朝' + (right ? '上' : '下') + '，是' + handName +
                '；' + handName + '的拇指在' + (right ? '左' : '右') + '边', false);
      $$('.opt.hand', answerEl).forEach(function(b){
        if(b.dataset.side === n.hand) b.classList.add('correct');
      });
    }else if(stage === 2){
      setPrompt(n.finger + ' 指是' + FINGER_NAME[n.finger], false);
      $$('.opt.finger', answerEl).forEach(function(b){
        if(Number(b.dataset.finger) === n.finger) b.classList.add('correct');
      });
    }else{
      setPrompt('这个音符是 ' + v.beats + ' 拍', false);
    }
  }

  return {
    kind:'play', noteId:noteId, valueId:valueId, wrong:0,
    render: function(){ askHand(); },
    reveal: reveal
  };
}

/* ==================== 第 6 关：五线谱的线与间 ====================
   这一关回到谱面本身：只有五条线，没有音符，问「第 3 线在哪」或
   「第 2 间在哪」。线、间都从下往上数，第 1 线在最下面，
   第 1 间在最下面两条线之间。前半段不加谱号；后半段加高音或低音谱号，
   但题干不提谱号，仍然只问第几条线、第几间。谱号在这里是干扰因素：
   它不改变线、间的编号，也不影响答案，孩子要学会不被它带走。

   答题方式是在谱面上直接点。问线时按「离哪条线最近」归到 1–5，
   问间时按「离哪个间最近」归到 1–4，点偏一点也算对；
   点中的那条线或那个间会先标出来，孩子能看见游戏把点击理解成了哪里。 */
function qStaffSpot(spot, num, clef, intro){
  const isLine = (spot === 'line');
  const unit = isLine ? '线' : '间';
  const what = '第 ' + num + ' ' + unit;
  const wrongMsg = isLine ? '从下往上数：最下面一条是第 1 线' : '间在两条线之间，也从下往上数';
  let svg = null;

  /* y 用谱面自己的坐标：0 在最上面、4 在最下面，所以第 n 线是 y = 5-n，
     第 n 间在 y = 4-n 与 5-n 之间。问线取最近的线，问间取最近的间。

     整张纸都算点按区：点在谱表上方的留白就归到最上面一条线/间，
     下方归到最下面一条。孩子点偏到白边上也有反馈，
     不会因为「点了没反应」以为页面坏了。 */
  function nearest(y){
    if(isLine) return Math.max(1, Math.min(5, 5 - Math.round(y)));
    return Math.max(1, Math.min(4, 4 - Math.floor(y)));
  }
  function hlFor(n){
    return svg ? svg.querySelector('.hl[data-spot="' + spot + '"][data-n="' + n + '"]') : null;
  }

  return {
    kind:'spot', spot:spot, n:num, clef:clef, wrong:0,
    render: function(){
      /* 第一题把「从下往上数」说一次；之后只问题目本身，
         否则每题都重复一句，孩子会把注意力放在套话上。
         题干不提谱号：画面上有谱号也不改变问法。 */
      setPrompt((intro ? '五线谱从下往上数。' : '') + what + '在哪？',
                (intro ? '五线谱从下往上数，' : '') + what + '在哪');
      const paper = document.createElement('div');
      paper.className = 'paper lines';
      paper.innerHTML = staffLinesSVG({ clef: clef });
      stageEl.appendChild(paper);
      svg = paper.querySelector('svg');
      answerEl.innerHTML = '<div class="spot-cap">在谱面上点一下</div>';

      svg.addEventListener('pointerdown', function(e){
        if(G.q.answered) return;
        /* 用 SVG 自己的坐标变换把屏幕点换算回线距，缩放、留白都不用自己算。 */
        let y;
        try{
          const pt = svg.createSVGPoint();
          pt.x = e.clientX; pt.y = e.clientY;
          const m = svg.getScreenCTM();
          if(!m) return;
          y = pt.matrixTransform(m.inverse()).y;
        }catch(err){ return; }
        const picked = nearest(y);
        e.preventDefault();
        clickSound();
        const el = hlFor(picked);
        if(picked === num){
          if(el){ el.classList.remove('hint', 'bad'); el.classList.add('on'); }
          judge(true, '对！' + what);
        }else{
          if(el) el.classList.add('on', 'bad');
          /* 红色只闪一下，别让孩子盯着一整条红线以为那就是答案。 */
          setTimeout(function(){ if(el) el.classList.remove('on', 'bad'); }, 480);
          judge(false, wrongMsg);
        }
      }, { passive:false });
    },
    reveal: function(){
      const el = hlFor(num);
      if(el) el.classList.add('on', 'hint');
      setPrompt('从下往上数，' + what + '在这里', '从下往上数，' + what + '，橙色标出来了');
    }
  };
}

/* ==================== 新音导入用的键盘题 ====================
   qKeyboardFind：在键盘上找到指定的音，可以限定键盘范围。
   局部键盘（C4 到新音）用在新音导入的第 0 步，先把黑键地标看清楚；
   完整键盘用在第 2 步，要求点中新音本身，不能点成别的八度。
   题干和答对提示都用 NOTES 里的 landmark，所以加 F、G 时不用改代码。 */
function qKeyboardFind(noteId, opts){
  opts = opts || {};
  const n = NOTES[noteId];
  const start = (opts.start == null) ? 0 : opts.start;
  const count = (opts.count == null) ? 15 : opts.count;
  const intro = !!opts.intro;
  return {
    kind:'kbfind', noteId:noteId, wrong:0,
    render: function(){
      /* 第 0 步（局部键盘）把地标说出来，当一次示范；
         完整键盘那题只留任务，孩子要自己看黑键组。 */
      const task = intro ? n.landmark + '是 ' + n.letter + '。找到 ' + n.letter
                         : '在键盘上找到 ' + n.letter;
      setPrompt(task, task);
      stageEl.classList.add('letter');
      stageEl.innerHTML = '<div class="big-letter">' + n.letter + '</div><div class="down-arrow">↓</div>';
      const kb = makeKB({
        labels: S.labels,
        start: start, count: count,
        onDown: function(midi, el){
          if(G.q.answered) return;
          if(midi === n.midi){
            el.classList.add('correct');
            judge(true, intro ? '对！' + n.letter + ' 在' + n.landmark : '对！这是 ' + n.label);
          }else{
            el.classList.add('wrong');
            setTimeout(function(){ el.classList.remove('wrong'); }, 420);
            judge(false);
          }
        }
      });
      answerEl.appendChild(kb);
    },
    reveal: function(){
      $$('.kb .w, .kb .b', answerEl).forEach(function(k){
        if(Number(k.dataset.midi) === n.midi) k.classList.add('hint');
      });
      setPrompt(n.keyHint);
    }
  };
}

/* 键盘上高亮一个键，问它是哪个音。
   选项来自 pool 里的音名字母，不受难度选项数影响。
   目前导入流程没有用它：导入的第 0–2 步都是「给字母找键」，
   这个工厂是反方向，保留给以后的「认键名」专项或听辨练习。 */
function qKeyName(pool){
  const noteId = pick(pool);
  const n = NOTES[noteId];
  const letters = shuffle(pool.map(function(id){ return NOTES[id].letter; }));
  return {
    kind:'keyname', noteId:noteId, wrong:0,
    render: function(){
      setPrompt('这个键是哪个音？', '这个键是哪个音');
      const stack = document.createElement('div');
      stack.className = 'stack';
      stack.appendChild(makeKB({ labels: S.labels, target: n.midi }));
      const box = document.createElement('div');
      box.className = 'opts';
      letters.forEach(function(letter){
        const b = document.createElement('button');
        b.className = 'opt';
        b.dataset.letter = letter;
        b.innerHTML = '<span class="num">' + letter + '</span>';
        b.addEventListener('click', function(){
          if(G.q.answered) return;
          if(letter === n.letter){
            b.classList.add('correct');
            playMidi(n.midi, 0.9);
            judge(true, '对！这是 ' + n.label);
          }else{
            b.classList.add('wrong');
            setTimeout(function(){ b.classList.remove('wrong'); }, 500);
            judge(false);
          }
        });
        box.appendChild(b);
      });
      stack.appendChild(box);
      stageEl.appendChild(stack);
    },
    reveal: function(){
      $$('.opt', stageEl).forEach(function(b){
        if(b.dataset.letter === n.letter) b.classList.add('correct');
      });
      setPrompt(n.keyHint);
    }
  };
}

/* ==================== 出题 ====================
   一节课的题目在开始时一次性生成，中途不再变化，
   所以「第几题」的进度条和星星统计都是确定的。
   repeatTo 负责把一个池子循环填满到 n 个，再打乱，
   保证每种音、每种时值出现的次数尽量均匀。 */
function repeatTo(arr, n){
  const out = [];
  while(out.length < n) out.push.apply(out, shuffle(arr));
  return out.slice(0, n);
}

/* 第 1 关的字母序列：从按权重摆好的字母里随机抽 n 个。
   权重来自 LETTER_WEIGHT，C、B 两个锚点出现得多一点。
   两个约束：池子里的字母尽量都出现；相邻两题不重复同一个音。
   纯随机洗牌时常连出三个 C，孩子会觉得「怎么又是这个」。 */
function findKeyLetters(n, letters){
  letters = (letters && letters.length) ? letters : ['B','C','D'];
  const base = [];
  letters.forEach(function(letter){
    const w = LETTER_WEIGHT[letter] || 1;
    for(let i = 0; i < w; i++) base.push(letter);
  });
  const picked = shuffle(base).slice(0, n);
  letters.forEach(function(need){
    if(picked.indexOf(need) >= 0) return;
    const count = {};
    picked.forEach(function(x){ count[x] = (count[x] || 0) + 1; });
    let idx = -1, best = 0;
    picked.forEach(function(x, i){ if(count[x] > best){ best = count[x]; idx = i; } });
    if(idx >= 0 && best > 1) picked[idx] = need;
  });
  return spreadLetters(picked);
}

/* 第 6 关的题目：线与间交替，前半段不加谱号，后半段加。
   第一题固定第 1 线，先把「从下往上数」立住；线 1–5、间 1–4
   在一轮里尽量都出现，后半段的谱号高音、低音轮流。 */
function spotQuestions(n){
  const lineTotal = Math.ceil(n / 2);
  const lines = shuffle([1,2,3,4,5]).slice(0, lineTotal);
  /* 把第 1 线换到第一题；1 没被抽中时顶掉第一条。
     这样每题量的第一题都是「第 1 线」，且线不重复。 */
  if(lines.indexOf(1) >= 0){
    lines.splice(lines.indexOf(1), 1);
    lines.unshift(1);
  }else{
    lines[0] = 1;
  }
  const spaces = repeatTo([1,2,3,4], n - lineTotal);
  const clefFrom = Math.ceil(n / 2);
  const bassFirst = Math.random() < 0.5;
  const clefs = [];
  for(let i = 0; i < n - clefFrom; i++){
    clefs.push((((i + (bassFirst ? 1 : 0)) % 2) ? 'bass' : 'treble'));
  }

  const qs = [];
  let li = 0, si = 0;
  for(let i = 0; i < n; i++){
    const isLine = (i % 2 === 0);
    const num = isLine ? lines[li++] : spaces[si++];
    const clef = (i >= clefFrom) ? clefs[i - clefFrom] : null;
    qs.push(qStaffSpot(isLine ? 'line' : 'space', num, clef, i === 0));
  }
  return qs;
}

/* 第 5 关的左右手判断需要左手音。池子里有左手音时，保证至少一道，
   否则孩子会学会「看到 B3 就选左手」，而不是真的看符杆。
   以后加入更多左手音，这个函数仍然有效。 */
function balanceHands(ids, m){
  const left = ids.filter(function(id){ return NOTES[id].hand === 'L'; });
  const list = repeatTo(ids, m);
  if(left.length && !list.some(function(id){ return NOTES[id].hand === 'L'; })){
    list[0] = pick(left);
  }
  return list;
}

/* ==================== 六种技能的出题函数 ====================
   每个函数签名都是 (ids, n)：ids 是已经按 needs 过滤好的音池，
   n 是这一节要出几题。返回题目数组。
   SKILLS 里的 make 指向这些函数，buildQuestions 只负责查表和取池，
   所以加一种练习不需要再写 if/else。 */

function makeFindKey(ids, n){
  const letters = [];
  ids.forEach(function(id){
    const l = NOTES[id].letter;
    if(letters.indexOf(l) < 0) letters.push(l);
  });
  return findKeyLetters(n, letters).map(qFindKey);
}

function makeStaffKey(ids, n){
  if(!ids.length) return [];
  const list = shuffle(repeatTo(ids, n));
  const half = Math.ceil(n / 2);
  const qs = [];
  list.slice(0, half).forEach(function(id){ qs.push(qStaffToKey(id)); });
  list.slice(half).forEach(function(id){ qs.push(qKeyToStaff(id, ids)); });
  while(qs.length < n) qs.push(qKeyToStaff(pick(ids), ids));
  return shuffle(qs);
}

function makeClef(ids, n){
  return shuffle(repeatTo(ids, n)).map(qClef);
}

function makeBeats(ids, n){
  if(!ids.length) return [];
  const vals = shuffle(repeatTo(VALUE_IDS, n));
  const qs = [];
  for(let i = 0; i < n; i++){
    const id = pick(ids);
    qs.push(i % 3 === 2 ? qWhichShape(id, vals[i]) : qBeats(id, vals[i]));
  }
  return shuffle(qs);
}

function makePlay(ids, n){
  if(!ids.length) return [];
  /* n 已经是 SKILLS.count 算过的题量（count - 2），这里不再减。 */
  const m = Math.max(4, n);
  const list = shuffle(balanceHands(ids, m));
  const vals = shuffle(repeatTo(['quarter','half','dotted'], m));
  const qs = [];
  for(let i = 0; i < m; i++) qs.push(qPlayNote(list[i], vals[i]));
  return shuffle(qs);
}

function makeSpot(ids, n){
  return spotQuestions(n);
}

/* 按技能注册表出题。这是以前 buildQuestions 的大 if/else 的替代：
   取哪条技能 → 按 needs 过滤音池 → 交给 make。 */
function buildQuestions(skillId){
  const skill = SKILLS[skillId - 1];
  if(!skill) return [];
  const n = skill.count ? skill.count(diff().count) : diff().count;
  const ids = (skill.pool === 'active') ? activeNotes(skill.needs)
            : (skill.pool === 'fixed') ? skill.ids.slice()
            : [];
  return skill.make(ids, n);
}

/* 新音导入：从第 from 步开始取 count 步。
   每一步返回一道题；步骤本身在 SPOT_STEPS 里配置。 */
function spotlightQuestions(noteId, from, count){
  const qs = [];
  const end = Math.min(SPOT_STEP_COUNT, from + count);
  for(let i = from; i < end; i++){
    const q = SPOT_STEPS[i](noteId);
    q.spotStep = i;
    qs.push(q);
  }
  return qs;
}

/* 混合块：从已学音里出 n 道谱 ↔ 键，尽量保证当前新音出现一次。
   新音还在导入阶段时不在 learned 里，所以不会提前考它。 */
function makeMixed(ids, n, focus){
  const qs = makeStaffKey(ids, n);
  if(focus && ids.indexOf(focus) >= 0 && !qs.some(function(q){ return q.noteId === focus; })){
    qs[0] = qStaffToKey(focus, 'quarter', NOTES[focus].posHint);
  }
  return qs;
}

/* 今日练习：有新音时两题复习 + 四题新音 + 四题混合；
   没有新音时三题复习 + 七题混合。两种都是 10 题。
   复习从最久没练的音里抽，保证音集长大以后仍然轮得到旧音。 */
function buildDailySession(){
  const focus = currentSpotlight();
  const learned = activeNotes(['key']);
  const qs = [];
  const review = staleNotes(learned, focus ? 2 : 3);
  if(review.length) qs.push.apply(qs, makeStaffKey(review, review.length));
  if(focus){
    const step = (S.spot && S.spot.note === focus) ? (S.spot.step || 0) : 0;
    const count = Math.min(SPOT_PER_SESSION, SPOT_STEP_COUNT - step);
    qs.push.apply(qs, spotlightQuestions(focus, step, count));
    qs.push.apply(qs, makeMixed(learned, 4, focus));
  }else{
    qs.push.apply(qs, makeMixed(learned, 7));
  }
  return qs;
}

/* ==================== 流程 ====================
   四个入口最后都走 startSession：
     六张技能卡      startLevel(id)
     今日练习        startDaily()
     新音导入        startSpotlight()
     点已学音的 chip  startNoteReview(noteId)
   会话号、停长音、清状态只有一份实现，避免四个入口各写一遍。 */
function startSession(tag, build){
  /* 先 +1 再生成题目：qPlayNote 在创建时会把当时的 G.session 存下来，
     640ms 的换段回调靠它判断自己有没有过期。如果先生成题目再 +1，
     新题目的 session 一出生就过期，第 5 关会卡在第一段。 */
  G.session++;
  if(activePad){ activePad.stop(); activePad = null; }
  stopAllTones();
  const qs = build();
  if(!qs || !qs.length){ toast('这一项还没有可以练的音', 'bad'); return; }
  G.i = 0; G.first = 0; G.busy = false;
  G.qs = qs;
  $('#levelTag').textContent = tag;
  document.body.classList.add('in-play');
  showScreen('play');
  renderQuestion();
}

/* 六张技能卡。G.level 只对技能模式有意义，星星也按它存。 */
function startLevel(id){
  const skill = SKILLS[id - 1];
  if(!skill) return;
  G.mode = 'skill';
  G.level = id;
  G.spotNote = null; G.spotFrom = 0; G.spotCount = 0;
  startSession('第 ' + id + ' 关 · ' + skill.name, function(){ return buildQuestions(id); });
}

/* 今日练习：有新音时 2+4+4，没有新音时 3+7，孩子不用先选关。 */
function startDaily(){
  G.mode = 'daily';
  G.spotNote = currentSpotlight();
  G.spotFrom = (S.spot && S.spot.note === G.spotNote) ? (S.spot.step || 0) : 0;
  G.spotCount = G.spotNote ? Math.min(SPOT_PER_SESSION, SPOT_STEP_COUNT - G.spotFrom) : 0;
  startSession('今日练习', buildDailySession);
}

/* 新音导入：只练当前新音，每次四步。 */
function startSpotlight(){
  const noteId = currentSpotlight();
  if(!noteId){ toast('这个音已经学完了', 'ok'); return; }
  G.mode = 'spotlight';
  G.spotNote = noteId;
  G.spotFrom = (S.spot && S.spot.note === noteId) ? (S.spot.step || 0) : 0;
  G.spotCount = Math.min(SPOT_PER_SESSION, SPOT_STEP_COUNT - G.spotFrom);
  if(G.spotCount <= 0){ toast('这个音已经练完了', 'ok'); return; }
  startSession('新音 ' + NOTES[noteId].letter, function(){
    return spotlightQuestions(noteId, G.spotFrom, G.spotCount);
  });
}

/* 点一个已学音的 chip：用这个音和它的邻居做一次短复习。
   不写星星，纯粹是「想单独练这个音」的入口。 */
function startNoteReview(noteId){
  if(!noteId || !noteComplete(noteId)) return;
  const i = NOTE_ORDER.indexOf(noteId);
  const pool = [noteId];
  [i - 1, i + 1].forEach(function(j){
    const id = NOTE_ORDER[j];
    if(id && noteComplete(id) && pool.indexOf(id) < 0) pool.push(id);
  });
  G.mode = 'note';
  G.spotNote = noteId;
  G.spotFrom = 0; G.spotCount = 0;
  startSession('复习 ' + NOTES[noteId].letter, function(){ return makeStaffKey(pool, 6); });
}

/* 新音导入走完四步之后打开对应的标记。
   第 0–3 步覆盖键位和谱位；第 4–7 步补指法和混合。
   标记一旦打开就不会再关，孩子重玩不会掉进度。
   这里不按对错卡进度：四岁的孩子需要的是接触次数，
   掌握程度由家长看结算页的一次答对率和星星判断。 */
function advanceSpotlight(){
  if(!G.spotNote || !G.spotCount) return;
  const p = S.progress[G.spotNote];
  if(!p) return;
  const next = Math.min(SPOT_STEP_COUNT, (G.spotFrom || 0) + G.spotCount);
  if(next >= 4){ p.key = 1; p.pos = 1; }
  if(next >= SPOT_STEP_COUNT){ p.fin = 1; S.spot = null; }
  else { S.spot = { note:G.spotNote, step:next }; }
}

/* 结算：一次答对 total-1 题以上给 3 星，total-3 题以上给 2 星，其余 1 星。
   技能模式的星星按 id 存历史最高；每日练习和新音导入不覆盖技能星星。 */
function finishLevel(){
  const total = G.qs.length;
  const first = G.first;
  const stars = first >= total - 1 ? 3 : (first >= total - 3 ? 2 : 1);
  if(G.mode === 'skill'){
    const prev = S.stars[G.level] || 0;
    if(stars > prev) S.stars[G.level] = stars;
  }else if(G.mode === 'daily' || G.mode === 'spotlight'){
    advanceSpotlight();
  }
  saveStore();
  renderResult(stars, first, total);
  showScreen('result');
}

/* 结算页文案按模式分开：技能关显示「第几关」，其余显示这次练了什么。
   三颗星且不在最高难度时，技能关多给一个「试试挑战」按钮。 */
function renderResult(stars, first, total){
  const isSkill = G.mode === 'skill';
  const skill = isSkill ? SKILLS[G.level - 1] : null;
  const starHTML = [1,2,3].map(function(i){
    return '<span class="' + (i <= stars ? 'on' : '') + '">★</span>';
  }).join('');
  const title = stars === 3 ? '全对，太棒了' : (stars === 2 ? '很不错' : '再练一次会更熟');
  const canLevelUp = isSkill && stars === 3 && S.difficulty !== 'hard';
  const spotName = G.spotNote ? NOTES[G.spotNote].letter : '';
  let tag = '今日练习';
  let detail = '';
  if(isSkill) tag = '第 ' + G.level + ' 关 · ' + skill.title;
  else if(G.mode === 'spotlight'){
    tag = '新音 ' + spotName;
    detail = currentSpotlight() ? '　继续练这一步' : '　键位、谱位、指法都打开了';
  }
  else if(G.mode === 'note') tag = '复习 ' + spotName;
  const box = $('#resultBox');
  box.className = 'res-wrap';
  box.innerHTML =
    '<div class="res-stars">' + starHTML + '</div>' +
    '<div class="res-title">' + title + '</div>' +
    '<div class="res-sub">' + tag + detail + '　一次答对 ' + first + ' / ' + total +
      '<br>当前难度：' + diff().name + '</div>' +
    '<div class="res-btns">' +
      '<button class="primary-btn" id="btnAgain">再练一次</button>' +
      '<button class="secondary-btn" id="btnHome">回首页</button>' +
      (canLevelUp ? '<button class="secondary-btn" id="btnHarder">试试挑战</button>' : '') +
    '</div>';
  $('#btnAgain').addEventListener('click', restart);
  $('#btnHome').addEventListener('click', showHome);
  if(canLevelUp){
    $('#btnHarder').addEventListener('click', function(){
      S.difficulty = (S.difficulty === 'easy') ? 'normal' : 'hard';
      saveStore(); syncSettings(); startLevel(G.level);
    });
  }
}

/* 结算页的「再练一次」按当前模式重来，而不是一律回到技能关。 */
function restart(){
  if(G.mode === 'skill') startLevel(G.level);
  else if(G.mode === 'daily') startDaily();
  else if(G.mode === 'spotlight') startSpotlight();
  else if(G.mode === 'note') startNoteReview(G.spotNote);
}

/* 切屏。离开游戏页时顺手停语音、长音和按住控制器，
   否则念到一半的题目会跟着到首页去，按住的琴音也会一直响。 */
function showScreen(name){
  $$('.screen').forEach(function(s){ s.classList.remove('active'); });
  $('#' + name).classList.add('active');
  if(name !== 'play'){
    document.body.classList.remove('in-play');
    if(activePad){ activePad.stop(); activePad = null; }
    stopAllTones();
    stopSay();
  }
}

function showHome(){
  showScreen('home');
  renderHome();
}

/* 「我的音」：每个音一个 chip。
   三标记都打开：可点，进入单音复习；
   当前新音：脉动，点进去是新音导入；
   还没学：灰掉，点了只提示，不会开始练习。 */
function renderChips(){
  const box = $('#noteChips');
  if(!box) return;
  box.innerHTML = '';
  NOTE_ORDER.forEach(function(id){
    const n = NOTES[id];
    const done = noteComplete(id);
    const focus = (S.focus === id && !done);
    const b = document.createElement('button');
    b.className = 'chip ' + (done ? 'learned' : (focus ? 'focus' : 'locked'));
    b.dataset.note = id;
    b.setAttribute('aria-label', n.label);
    b.innerHTML = '<span class="chip-letter">' + n.letter + '</span>' +
                  (focus ? '<span class="chip-dot"></span>' : '') +
                  (done ? '<span class="chip-check">✓</span>' : '');
    b.addEventListener('click', function(){
      if(done) startNoteReview(id);
      else if(focus) startSpotlight();
      else toast('这个音还没学', 'bad');
    });
    box.appendChild(b);
  });
}

/* 今日练习副标题：有新音时说明练哪个，没有时只说复习。 */
function renderDaily(){
  const el = $('#dailySub');
  if(!el) return;
  const focus = currentSpotlight();
  el.textContent = focus
    ? '新音 ' + NOTES[focus].letter + ' + 复习，约 3 分钟'
    : '复习和混合，约 3 分钟';
}

/* 当前新音学完、后面还有音时，页脚出现「下一个音」。
   这一步由家长按，游戏不会自动把 F、G 塞给孩子。 */
function renderNextNote(){
  const btn = $('#btnNextNote');
  if(!btn) return;
  const next = nextNoteId();
  const show = noteComplete(S.focus) && !!next;
  btn.style.display = show ? '' : 'none';
  if(show) btn.textContent = '下一个音：' + NOTES[next].letter;
}

/* 首页：chips + 今日练习 + 六张技能卡。
   菜单长度固定，音集只在 chips 里长大。 */
function renderHome(){
  renderChips();
  renderDaily();
  const grid = $('#levelGrid');
  grid.innerHTML = '';
  SKILLS.forEach(function(sk){
    const stars = S.stars[sk.id] || 0;
    const b = document.createElement('button');
    b.className = 'level-card';
    b.innerHTML =
      '<div class="lv-top">' +
        '<div class="lv-num" style="background:' + sk.color + '">' + sk.id + '</div>' +
        '<div class="lv-title">' + sk.title + '</div>' +
      '</div>' +
      '<p class="lv-desc">' + sk.desc + '</p>' +
      '<div class="lv-stars">' +
        [1,2,3].map(function(i){ return '<span class="' + (i <= stars ? 'on' : '') + '">★</span>'; }).join('') +
      '</div>';
    b.addEventListener('click', function(){
      audioCtx();
      startLevel(sk.id);
    });
    grid.appendChild(b);
  });
  renderNextNote();
}

/* ==================== 首页按钮 ==================== */
$('#btnDaily').addEventListener('click', function(){
  audioCtx();
  startDaily();
});
$('#btnNextNote').addEventListener('click', function(){
  const next = nextNoteId();
  if(!next) return;
  S.focus = next;
  S.spot = { note:next, step:0 };
  saveStore();
  renderHome();
  toast('下一个音：' + NOTES[next].letter, 'ok');
});

/* ==================== 设置 ====================
   开关状态只有两个来源：S（存档里的值）和 decorOn()（按日期推出的默认值）。
   syncSettings 把状态写回界面，事件处理只改 S 再调它，避免两处各写一份。 */
function syncSettings(){
  $$('[data-toggle]').forEach(function(btn){
    const k = btn.dataset.toggle;
    const on = (k === 'decor') ? decorOn() : !!S[k];
    btn.classList.toggle('on', on);
  });
  $$('#diffSeg button').forEach(function(btn){
    btn.classList.toggle('on', btn.dataset.diff === S.difficulty);
  });
}
$$('[data-toggle]').forEach(function(btn){
  btn.addEventListener('click', function(){
    const k = btn.dataset.toggle;
    if(k === 'decor'){ S.decor = !decorOn(); }
    else { S[k] = !S[k]; }
    saveStore();
    syncSettings();
    applyDecor();
    if(k === 'sound' && S.sound) playMidi(60, 0.6);
    if(k === 'speech' && S.speech) say('语音已打开');
  });
});
$$('#diffSeg button').forEach(function(btn){
  btn.addEventListener('click', function(){
    S.difficulty = btn.dataset.diff;
    saveStore();
    syncSettings();
  });
});
$('#btnSettings').addEventListener('click', function(){
  syncSettings();
  $('#settingsModal').classList.add('open');
});
$('#btnCloseSettings').addEventListener('click', function(){
  $('#settingsModal').classList.remove('open');
});
$('#settingsModal').addEventListener('click', function(e){
  if(e.target === this) this.classList.remove('open');
});
/* 试听：本机上唯一一处「强制出声」，用来排查 iPad 到底是没有声音、
   还是静音开关被拨了、还是语音包缺失。
   iOS 允许在点击回调里创建 AudioContext 和朗读，所以这里不需要等手势。 */
$('#btnTrySound').addEventListener('click', function(){
  const c = audioCtx();
  if(c && c.state === 'suspended') c.resume();
  playMidi(60, 1.1, 0.4, true);
  say('这是中央 C，听到声音就说明正常', true);
  toast('听到「咚」和一句话，声音就正常', 'ok');
});

$('#btnReset').addEventListener('click', function(){
  S.stars = {};
  saveStore();
  renderHome();
  toast('已清空', 'ok');
});

/* ==================== 其他 ==================== */
/* 返回键、重听键；再禁掉 iOS 的双指缩放和双击放大，
   防止孩子把界面缩花了。 */
$('#btnBack').addEventListener('click', showHome);
$('#btnSpeak').addEventListener('click', function(){
  /* 第 1 关的题干不含音名，题目自己带 sayText（那个字母）；其他关读题干。 */
  say((G.q && G.q.sayText) || promptEl.textContent);
});
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive:false });
/* iOS 只在用户手势里允许创建/恢复 AudioContext。
   这里在第一次触摸时悄悄唤醒，之后各处的 playMidi 才能立刻出声。 */
document.addEventListener('pointerdown', function once(){
  audioCtx();
  document.removeEventListener('pointerdown', once);
}, { once:true });

/* 调试接口：控制台里可以直接看进度、音集和当前题。
   它只读，不参与游戏流程；删掉也不影响玩，留着方便回归检查。 */
window.__dbg = {
  G: G, S: S, NOTES: NOTES, VALUES: VALUES, SKILLS: SKILLS,
  NOTE_ORDER: NOTE_ORDER,
  activeNotes: activeNotes,
  noteComplete: noteComplete,
  currentSpotlight: currentSpotlight,
  buildQuestions: buildQuestions,
  buildDailySession: buildDailySession,
  SPOT_STEPS: SPOT_STEPS,
  voice: function(){ return [zhVoice && zhVoice.name, enVoice && enVoice.name]; }
};
ensureProgress();
saveStore();
applyDecor();
syncSettings();
showHome();

/* 离线缓存只在安全上下文里注册：https 或本机调试。
   直接双击打开 file:// 时浏览器不支持，注册会静默失败，属正常。 */
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
})();
</script>
</body>
</html>
