<meta name="description" content="给初学钢琴的孩子每天练 3 分钟：音名、键盘位置、五线谱、时值、指法、线与间。六项技能按孩子的进度加入新音，三档难度，可离线，iPad 可用。">
<!-- 站点是公开的（免费账号的 Pages 只能从公开仓库发布），
     但不需要被搜索引擎收录：noindex 让爬虫不要建索引，
     nofollow 不追踪页面里的链接，noarchive 不留快照。
     注意这只影响搜索结果，拿到网址的人仍然可以打开。 -->

<meta name="googlebot" content="noindex, nofollow">

<meta property="og:title" content="识谱小练习 · 我的音">
<meta property="og:description" content="每天 3 分钟：音名 → 键盘 → 五线谱 → 时值 → 指法 → 线与间。六项技能按孩子的进度加入新音，三档难度，可离线。">
<meta property="og:url" content="https://fangjiaqifion.github.io/note-trainer/">

<meta name="twitter:description" content="每天 3 分钟：音名 → 键盘 → 五线谱 → 时值 → 指法 → 线与间。六项技能按孩子的进度加入新音。">
<meta name="twitter:image" content="https://fangjiaqifion.github.io/note-trainer/og-cover.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  /* 版式与配色的唯一来源。改颜色改这里，不要在下面各处写死色值。
     页面按「首页 / 游戏页 / 结算页」三块排，都是整屏切换，
     所以 .screen 只切 active 类，不做路由也不做动画。 */
  :root{
    --bg:#FFF7EC; --ink:#2B2A33; --muted:#8B8175;
    --card:#FFFFFF; --line:#EADDCB;
    --blue:#3C7DD9; --orange:#F29B38; --green:#3FA96F; --red:#DE6A5F; --purple:#8E5AA8;
    /* 指法数字与卡通手上「竖起的那根手指」共用这个颜色，
       孩子在谱面和选项之间能看出「说的就是同一个东西」。 */
    --finger:#C2528C;
    --shadow:0 6px 0 rgba(180,150,110,.16), 0 14px 30px rgba(140,105,60,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); overscroll-behavior:none;
  }
  button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;padding:0}
  #app{
    position:fixed;inset:0;display:flex;flex-direction:column;z-index:1;
    padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom);
  }
  .screen{display:none;flex:1;min-height:0;flex-direction:column}
  .screen.active{display:flex}

  /* ---------- 节日装饰 ---------- */
  .decor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none}
  body.halloween .decor{display:block}
  .decor span{position:absolute;opacity:.32;filter:saturate(.95);will-change:transform}
  .decor .witch{position:absolute;width:96px;height:auto;color:#2B2A33;opacity:.22;animation:fly 46s linear infinite}
  .decor .witch.w2{width:64px;opacity:.15;animation-duration:62s;animation-delay:-20s}
  .decor .witch.w3{width:112px;opacity:.12;animation-duration:53s;animation-delay:-34s}
  @keyframes fly{
    0%{transform:translate(-12vw,0) rotate(-6deg)}
    50%{transform:translate(50vw,7vh) rotate(7deg)}
    100%{transform:translate(112vw,2vh) rotate(-4deg)}
  }
  .decor .corner{font-size:44px;bottom:2%;animation:bob 4s ease-in-out infinite}
  .decor .corner.c1{left:1.5%}
  .decor .corner.c2{right:1.5%;animation-delay:-2s}
  body.in-play .decor .corner{display:none}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}

  .fx{position:fixed;inset:0;pointer-events:none;z-index:70}
  .confetti{position:absolute;animation:burst .95s ease-out forwards;will-change:transform,opacity}
  @keyframes burst{
    0%{transform:translate(0,0) rotate(0deg) scale(.7);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1.1);opacity:0}
  }

  /* ---------- 首页 ---------- */
  .home-head{padding:18px 24px 2px;text-align:center}
  .home-head h1{font-size:30px;margin:0;letter-spacing:3px;font-weight:800}
  .home-head .sub{margin:6px 0 0;color:var(--muted);letter-spacing:4px;font-size:13px;font-weight:600}

  /* 「我的音」：一排音符 chips。学过的亮、当前新音脉动、没学的灰掉。
     这一排是首页唯一会随音集长大的区域；下面六张技能卡永远不变，
     所以加音不会把菜单撑长。 */
  .chips-wrap{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px 2px;flex-wrap:wrap}
  .chips-label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:2px;flex:none}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .chip{position:relative;width:46px;height:46px;border-radius:16px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:20px;font-weight:900;color:#B9A98F;transition:transform .1s,box-shadow .1s}
  .chip:active{transform:scale(.94)}
  .chip.learned{color:var(--blue);border-color:#C9DCF5;background:#F5FAFF;box-shadow:0 3px 0 #D9E8FA}
  .chip.focus{color:#fff;border-color:#5C6B3F;background:#5C6B3F;box-shadow:0 3px 0 #46522F;animation:pulse 1.4s infinite}
  .chip.locked{opacity:.55}
  .chip .chip-check{position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;background:var(--green);color:#fff;font-size:10px;display:grid;place-items:center;border:2px solid #fff}
  .chip .chip-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#FFD98A}

  /* 今日练习：孩子只需要按这一个按钮。六张技能卡留给想专项练的时候。 */
  .daily-card{display:flex;flex-direction:column;align-items:center;gap:2px;margin:8px 20px 2px;padding:11px 18px;border-radius:22px;background:linear-gradient(180deg,#4E8FE8,#3C7DD9);color:#fff;box-shadow:0 5px 0 #2F66B5;transition:transform .1s}
  .daily-card:active{transform:translateY(3px);box-shadow:0 2px 0 #2F66B5}
  .daily-title{font-size:20px;font-weight:800;letter-spacing:2px}
  .daily-sub{font-size:12px;font-weight:600;opacity:.9}

  /* 六张技能卡排成两列三行。星星按技能存，和新音无关。
     行高 136，加上 chips、今日练习、页脚，iPad 竖屏一屏放得下。 */
  .levels{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 20px 6px;align-content:center;grid-auto-rows:minmax(0,136px);min-height:0;overflow-y:auto}
  .level-card{
    display:flex;flex-direction:column;gap:6px;text-align:left;
    background:var(--card);border:2px solid var(--line);border-radius:22px;padding:13px 16px;
    box-shadow:var(--shadow);transition:transform .1s;
  }
  .level-card:active{transform:scale(.975)}
  .lv-top{display:flex;align-items:center;gap:10px}
  .lv-num{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;flex:none}
  .lv-title{font-size:18px;font-weight:800;line-height:1.2}
  .lv-desc{font-size:12.5px;color:var(--muted);line-height:1.4;margin:0}
  .lv-stars{font-size:16px;letter-spacing:2px;color:#E7D3A5;margin-top:auto}
  .lv-stars .on{color:#EFB63F}
  body.halloween .lv-stars .on{color:#E98A3C}
  .home-foot{padding:2px 20px 12px;display:flex;justify-content:center;gap:10px}
  .ghost-btn{font-size:14px;color:var(--muted);padding:9px 16px;border-radius:14px;border:2px solid var(--line);background:#fff}

  /* ---------- 游戏页 ---------- */
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 16px 2px}
  .icon-btn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;font-size:19px;display:grid;place-items:center;flex:none}
  .level-tag{font-size:15px;font-weight:700;color:var(--muted)}
  .dots{display:flex;gap:6px;margin-left:auto}
  .dot{width:9px;height:9px;border-radius:50%;background:#E7DAC7;transition:.2s}
  .dot.done{background:var(--green)}
  .dot.now{background:var(--orange);transform:scale(1.35)}
  body.halloween .dot.done{background:#8E5AA8}
  .prompt{display:flex;align-items:center;justify-content:center;gap:10px;padding:4px 18px 2px;min-height:56px}
  .prompt-text{font-size:clamp(21px,3vw,30px);font-weight:800;text-align:center;line-height:1.25}
  .speak-btn{width:40px;height:40px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:16px;flex:none}
  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 14px}
  .stage.letter{flex-direction:column;justify-content:flex-end;gap:10px;padding-bottom:22px}
  .answer{display:flex;justify-content:center;align-items:center;gap:14px;padding:6px 14px 14px;flex-wrap:wrap}
  .answer.opts{gap:12px}
  .answer.hold{flex-direction:column;gap:8px}
  .stack{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:980px}
  .cards-row{display:flex;gap:14px;width:100%;justify-content:center}

  .big-letter{font-size:clamp(84px,15vw,150px);font-weight:900;line-height:1;color:var(--blue);letter-spacing:6px;text-shadow:0 8px 0 #E4EDFA}
  body.halloween .big-letter{color:#7B4B96;text-shadow:0 8px 0 #EDE1F4}
  .down-arrow{font-size:44px;color:#D9C6A6;line-height:1;animation:bob 1.6s ease-in-out infinite}
  .qmark{font-size:clamp(70px,12vw,120px);font-weight:900;color:#E7DAC7}

  .staff{width:100%;height:auto;max-width:840px;max-height:42vh;display:block}
  .paper{width:auto;max-width:100%;display:inline-block;background:#fff;border:2px solid var(--line);border-radius:24px;padding:10px 12px;box-shadow:0 10px 26px rgba(150,110,60,.09)}
  .paper .staff{height:38vh;width:auto;max-height:none;max-width:100%}
  /* 同一屏既有谱面又有键盘时（第 2、3、4 关），谱面收小一点，
     否则 iPad 竖屏上键盘会被挤到屏幕外面。类由 makeKB 加上。 */
  #play.with-kb .paper .staff{height:30vh}

  /* 第 6 关：线与间的命中提示。平时透明，点中才显示。
     线用一根加粗的彩线压在谱线上，间用一块淡色铺满两条线之间。
     答对是绿的，答错闪红，错够次数后的提示是橙色虚线。
     这些元素都在 SVG 里，颜色统一走 CSS，题目代码只加减类名。 */
  .staff .hl{opacity:0;transition:opacity .12s;pointer-events:none}
  .staff .hl.on{opacity:1}
  .staff .hl.line{stroke:var(--green);stroke-width:.2;stroke-linecap:round}
  .staff .hl.space{fill:var(--green);fill-opacity:.18}
  .staff .hl.bad.line{stroke:var(--red)}
  .staff .hl.bad.space{fill:var(--red)}
  .staff .hl.hint.line{stroke:var(--orange);stroke-width:.24;stroke-dasharray:.42 .3}
  .staff .hl.hint.space{fill:var(--orange);fill-opacity:.3}
  /* 整张谱面都是点按区，别让浏览器把拖动当成滚动 */
  .staff.lines{touch-action:none}
  /* 第 6 关这一屏没有键盘，谱表不必按屏高压缩：
     按纸宽铺满，宽屏上线距更大，窄屏也不会在纸里留一圈空白。 */
  .paper.lines{width:100%;max-width:880px}
  .paper .staff.lines{width:100%;height:auto}
  .spot-cap{font-size:13px;color:var(--muted);font-weight:600}

  /* 键盘 */
  .kb-wrap{width:100%;max-width:980px;margin:0 auto}
  /* 中央 C 的图例：黄点画在键上，说明写在键盘右上角。
     单独占一行、右对齐，不压键盘也不挡键。 */
  .kb-legend{display:flex;justify-content:flex-end;align-items:center;padding:0 4px 6px}
  .kb-legend span{display:flex;align-items:center;gap:5px;background:#FFF3E2;border:1.5px solid #F1D6B2;border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:700;color:#A96C22;line-height:1.1}
  .kb-legend .lg-dot{width:9px;height:9px;border-radius:50%;background:var(--orange);flex:none}
  .kb{position:relative;width:100%;height:clamp(150px,23vh,235px);touch-action:none}
  .kb .w{position:absolute;top:0;bottom:0;background:linear-gradient(#FFFFFF,#FBF5E9);border:1.5px solid #D9CDBA;border-radius:0 0 10px 10px;box-shadow:inset 0 -8px 0 #EFE6D6;transition:background .08s}
  .kb .w.on{background:linear-gradient(#FFE7C2,#FFD79E)}
  .kb .w.correct{background:linear-gradient(#D3F2E2,#A6E2C3);border-color:#3FA96F}
  .kb .w.wrong{animation:shake .35s}
  .kb .w.hint::after{content:"";position:absolute;inset:4px;border-radius:8px;border:3px dashed var(--orange);animation:fade 1s infinite}
  .kb .w.target{background:linear-gradient(#FFE7C2,#FFCF8A);box-shadow:inset 0 0 0 3px var(--orange), inset 0 -8px 0 #F2C58C;animation:pulse 1.3s infinite}
  .kb .w .middot{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:var(--orange);opacity:.9}
  .kb .w .lbl{position:absolute;bottom:11px;left:0;right:0;text-align:center;font-size:13px;font-weight:700;color:#A8977F}
  .kb .b{position:absolute;top:0;height:62%;background:linear-gradient(#3B3A44,#26252D);border-radius:0 0 6px 6px;box-shadow:inset 0 -5px 0 #16161B, 0 2px 4px rgba(0,0,0,.25);z-index:2;transition:background .08s}
  .kb .b.on{background:linear-gradient(#5C5A6B,#3B3A44)}
  .kb .b.wrong{animation:shake .35s}
  .kb .b.target{background:linear-gradient(#F2B45F,#E08F2C);box-shadow:inset 0 -5px 0 #B8721F}
  .kb .b.hint::after{content:"";position:absolute;inset:3px;border-radius:5px;border:3px dashed var(--orange)}

  .opt{width:clamp(78px,11vw,108px);height:clamp(84px,11vw,112px);border-radius:26px;background:#fff;border:2px solid var(--line);box-shadow:0 5px 0 #EADDCB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .08s,box-shadow .08s}
  .opt:active{transform:translateY(3px);box-shadow:0 2px 0 #EADDCB}
  .opt .num{font-size:clamp(28px,4vw,36px);font-weight:800;line-height:1}
  .opt .unit{font-size:12px;color:var(--muted);font-weight:600}
  .opt .pips{font-size:8px;letter-spacing:1px;color:#E2B45C;height:10px}
  .opt.correct{border-color:var(--green);background:#EFFAF4;box-shadow:0 5px 0 #BFE6D2}
  .opt.wrong{border-color:var(--red);background:#FDF1F0;box-shadow:0 5px 0 #F3CFCB;animation:shake .35s}
  /* 第 5 关的选项是卡通手，卡片比数字选项高一点，才放得下整只手 */
  .opt.hand{width:clamp(104px,15vw,140px);height:clamp(126px,17vw,160px);gap:2px}
  .opt.finger{width:clamp(94px,13vw,120px);height:clamp(126px,17vw,160px);gap:2px}
  /* 第 3 关的谱号选项：谱号本身就是图，只配一个名字 */
  .opt.clef{width:clamp(104px,15vw,140px);height:clamp(126px,17vw,160px);gap:4px}
  .opt.clef .cleficon{width:auto;display:block}
  /* 两种谱号天生比例不同：高音谱号细长、低音谱号宽扁。
     高度分开定，图标看起来分量才接近。 */
  .opt.clef .cleficon.treble{height:clamp(74px,11vw,96px)}
  .opt.clef .cleficon.bass{height:clamp(58px,9vw,76px)}
  .opt.clef .unit{font-size:13px;font-weight:700;color:#6B6156}
  .opt.hand svg,.opt.finger svg{width:clamp(72px,11.5vw,96px);height:auto;display:block;margin-bottom:2px}
  .opt.hand .unit,.opt.finger .unit{font-size:13px;font-weight:700;color:#6B6156}
  .opts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}

  .card-btn{flex:1 1 0;max-width:31%;background:#fff;border:2px solid var(--line);border-radius:18px;padding:6px;box-shadow:0 5px 0 #EADDCB;transition:transform .08s}
  .card-btn:active{transform:translateY(3px)}
  .card-btn svg{width:100%;height:auto;display:block}
  .card-btn.correct{border-color:var(--green);background:#F2FBF6;box-shadow:0 5px 0 #BFE6D2}
  .card-btn.wrong{border-color:var(--red);background:#FDF1F0;box-shadow:0 5px 0 #F3CFCB;animation:shake .35s}

  .beat-box{display:flex;flex-direction:column;align-items:center;gap:8px}
  /* 不告诉孩子拍数时用这一个圆：按下后从 0 开始，每过一拍加 1。
     它只显示「已经按住几拍」，不透露「应该按住几拍」。 */
  .beat-live{width:66px;height:66px;border-radius:50%;border:3px solid var(--line);background:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;color:#C9B99F;transition:.12s}
  .beat-live.on{border-color:var(--orange);color:var(--orange);background:#FFF6E8;transform:scale(1.04);box-shadow:0 4px 0 rgba(220,140,40,.22)}
  .beat-cap{font-size:15px;color:var(--muted);font-weight:600;text-align:center;line-height:1.4;min-height:21px}

  .toast{position:fixed;left:50%;top:16.5%;transform:translate(-50%,-50%) scale(.85);opacity:0;pointer-events:none;background:#fff;border-radius:22px;padding:16px 28px;font-size:24px;font-weight:800;box-shadow:0 18px 40px rgba(90,60,20,.18);transition:opacity .16s,transform .16s;z-index:75;text-align:center;line-height:1.3;max-width:88vw}
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .toast.ok{color:var(--green)}
  .toast.bad{color:var(--red)}

  .res-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px}
  .res-stars{font-size:64px;letter-spacing:8px;color:#E7D3A5}
  .res-stars .on{color:#EFB63F;text-shadow:0 6px 0 #F7E2B8}
  body.halloween .res-stars .on{color:#E98A3C}
  .res-title{font-size:30px;font-weight:800}
  .res-sub{color:var(--muted);font-size:16px;text-align:center;line-height:1.5}
  .res-btns{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;justify-content:center}
  .primary-btn{background:var(--blue);color:#fff;font-size:18px;font-weight:700;padding:16px 28px;border-radius:18px;box-shadow:0 5px 0 #2F66B5}
  .primary-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2F66B5}
  .secondary-btn{background:#fff;color:var(--ink);font-size:18px;font-weight:700;padding:16px 24px;border-radius:18px;border:2px solid var(--line);box-shadow:0 5px 0 #EADDCB}

  .modal{position:fixed;inset:0;background:rgba(50,35,15,.35);display:none;align-items:flex-end;justify-content:center;z-index:80}
  .modal.open{display:flex}

<script>
(function(){
'use strict';

/* =====================================================================
   识谱小练习 · note-trainer
   ---------------------------------------------------------------------
   单文件网页：样式、脚本、谱号路径、题库全在这一个 index.html 里。
   没有构建、没有依赖、没有网络请求，放到任何静态托管都能跑。

   代码分五层，从上往下读即可：
     1. 配置层  NOTES / SKILLS / SPOT_STEPS / VALUES / DIFFS
                这一层只有数据和小函数：加音只动 NOTES 和 NOTE_ORDER，
                加练习只加一条 SKILLS，改难度只动 DIFFS。
                不要为了一个新音去改下面的渲染或判题逻辑。
     2. 渲染层  staffSVG（五线谱）、buildKeyboard（键盘）、handSVG（卡通手）
                只负责把数据画成 SVG / DOM，不判断对错。
     3. 题型层  qFindKey / qStaffToKey / qKeyToStaff / qClef /
                qBeats / qWhichShape / qPlayNote / qStaffSpot /
                qKeyboardFind / qKeyName
                每个工厂返回 { kind, render(), reveal() }，
                render 才绑定交互，reveal 是错够次数后的提示。
                「按住」这一段由 holdPad 提供，第 4、5 关共用；
                qPlayNote 自己分三段（手 → 指 → 按住），前两段不判整题；
                qStaffSpot 直接在谱面上点线或间，训练的是谱面坐标；
                qKeyboardFind / qKeyName 是新音导入用的键盘题。
     4. 流程层  judge / renderQuestion / buildQuestions / startSession /
                startLevel / startDaily / startSpotlight / finishLevel
                管对错、换题、结算；渲染层和题型层都不碰这里。
     5. 外围    localStorage 存档、学习进度标记、Web Audio 发声、
                语音念题、节日装饰、离线缓存

   两条贯穿全文件的约定：
     · 时间统一用 beat 的倍数（60000 / bpm 是一拍多少毫秒），
       不写死毫秒，难度切换后速度自然跟着变。
     · 异步回调里一律先比较 G.session，会话过期就丢弃结果，
       否则退出关卡后旧定时器还会改状态，出现「幽灵判题」。
     · 判对判错都走 judge()，不要在题型里直接改 G。
   ===================================================================== */

/* ==================== 基础 ==================== */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const randInt = n => Math.floor(Math.random() * n);
const pick = a => a[randInt(a.length)];
const delay = (ms, fn) => setTimeout(fn, ms);
function shuffle(a){
  a = a.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = randInt(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
/* 把一串字母重排成「不连着出现同一个」的顺序。
   先洗牌，再把重复处和别处交换；修完还有重复就重新洗一次再修。
   第 1 关只有 B、C、D，纯洗牌经常连出三个 C，
   孩子会觉得「怎么又是这个」。 */
function spreadLetters(list){
  function hasRun(a, i){
    return (i > 0 && a[i] === a[i-1]) || (i + 1 < a.length && a[i] === a[i+1]);
  }
  function hasAnyRun(a){
    for(let i = 1; i < a.length; i++){ if(a[i] === a[i-1]) return true; }
    return false;
  }
  /* 把每一处重复和另一个不同的字母对调，要求对调后两处附近都不重复。 */
  function repair(a){
    for(let pass = 0; pass < 8; pass++){
      let moved = false;
      for(let i = 1; i < a.length; i++){
        if(a[i] !== a[i-1]) continue;
        for(let j = 0; j < a.length; j++){
          if(j === i || j === i - 1 || a[j] === a[i-1]) continue;
          const t = a[i]; a[i] = a[j]; a[j] = t;
          if(!hasRun(a, i) && !hasRun(a, j)){ moved = true; break; }
          const u = a[i]; a[i] = a[j]; a[j] = u;
        }
      }
      if(!moved) break;
    }
    return a;
  }
  let a = repair(shuffle(list));
  /* 少数牌型一次修不干净，换一个洗牌结果再修；修不好就返回当前这个。 */
  for(let t = 0; t < 20 && hasAnyRun(a); t++){ a = repair(shuffle(list)); }
  return a;
}

/* 十二平均律的音级表，一个八度内 C 到 B。
   midi 音高除以 12 取余就得到音级，负数的余数要先 +12 转正。 */
const LETTERS = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const letterOf = m => LETTERS[((m % 12) + 12) % 12];
/* 一个八度里 7 个白键相对 C 的半音数：C D E F G A B。
   有它才能从一个白键序号反推 midi，键盘就不用逐个手写。 */
const WHITE_OFF = [0,2,4,5,7,9,11];

/* ---------------------------------------------------------------------
   配置层之一：音符注册表。

   这一版把「音」和「练习」拆开了：NOTES 只描述音本身，SKILLS 只描述
   练习要考什么。加一个新音只往 NOTES 加一条、再放进 NOTE_ORDER；
   加一种新练习只往 SKILLS 加一条。两边不互相改代码。

   每个音至少有这些字段：
     id        内部键名，题库、存档、调试都用它
     letter    音名，第 1 关按它出题，只比音级不比音组
     label     中文说明，判对时的提示语用
     midi      MIDI 音高：59=B3、60=中央 C、62=D4、64=E4
     clef      用哪个谱号画，'treble' 或 'bass'
     y         谱表上的纵向位置，单位是「线距」，见 staffSVG 的坐标说明
     hand      'L' 左手 / 'R' 右手；渲染时决定符杆朝上还是朝下
     finger    指法数字；0 表示还没有固定指法（A4 需要换手位）
     stage     引入顺序，数字小的先学；首页 chips 和「下一个音」按它排
     landmark  键盘地标，第 1 题导入新音时说出来
     keyHint   找键答错够次数后的提示
     posHint   谱面题答错够次数后的提示

   可选字段：
     stem      'up' / 'down'，覆盖 hand 给出的符杆方向
     clefHint  第 3 关答错时给的那句提示

   已排进队列的音：B3 → C4 → D4 → E4 → F4 → G4。
   A4 的数据先写在这里，但**不放进 NOTE_ORDER**：它已经出了右手
   C 手位，要换手位或穿指，不能直接套「再来一个新音」的模板。
   等教材教到移手，再把 A4 追加到 NOTE_ORDER，并给它补一个手位课。
   C4B 是中央 C 的低音谱号写法，只给第 3 关用，不在队列里。 */
const NOTES = {
  B3: { id:'B3', letter:'B', label:'B',      midi:59, clef:'bass',   y:-0.5, hand:'L', finger:2,
        stage:1, landmark:'三个黑键的右边',
        keyHint:'B 在中央 C 左边的白键',
        posHint:'B 在低音谱号的上加一间',
        clefHint:'B 比中央 C 低，写在低音谱号里' },
  C4: { id:'C4', letter:'C', label:'中央 C', midi:60, clef:'treble', y:5.0,  hand:'R', finger:1,
        stage:2, landmark:'两个黑键的左边',
        keyHint:'C 是两个黑键左边的白键，也是中央 C',
        posHint:'中央 C 在高音谱号的下加一线',
        clefHint:'中央 C 写在高音谱号的下加一线上' },
  D4: { id:'D4', letter:'D', label:'D',      midi:62, clef:'treble', y:4.5,  hand:'R', finger:2,
        stage:3, landmark:'两个黑键的中间',
        keyHint:'D 在两个黑键之间，中央 C 右边第一个白键',
        posHint:'D 在高音谱号的谱表下方那一间',
        clefHint:'D 在中央 C 上面，写在高音谱号里' },
  E4: { id:'E4', letter:'E', label:'E',      midi:64, clef:'treble', y:4.0,  hand:'R', finger:3,
        stage:4, landmark:'两个黑键的右边',
        keyHint:'E 在两个黑键的右边，中央 C 右边第二个白键',
        posHint:'E 在高音谱号的第一条线上',
        clefHint:'E 在高音谱号的第一条线上' },
  F4: { id:'F4', letter:'F', label:'F',      midi:65, clef:'treble', y:3.5,  hand:'R', finger:4,
        stage:5, landmark:'三个黑键的左边',
        keyHint:'F 在三个黑键左边的白键，E 的右边',
        posHint:'F 在高音谱号的第一间',
        clefHint:'F 在高音谱号的第一间' },
  G4: { id:'G4', letter:'G', label:'G',      midi:67, clef:'treble', y:3.0,  hand:'R', finger:5,
        stage:6, landmark:'三个黑键的第一、二之间',
        keyHint:'G 在三个黑键的第一、二之间，F 的右边',
        posHint:'G 在高音谱号的第二条线上',
        clefHint:'G 在高音谱号的第二条线上' },
  /* A4 只登记数据，不排队。finger 先留 0，等手位课决定用 5 指移手
     还是 1 指穿指，再把 finger 和 NOTE_ORDER 一起补上。 */
  A4: { id:'A4', letter:'A', label:'A',      midi:69, clef:'treble', y:2.5,  hand:'R', finger:0,
        stage:7, landmark:'三个黑键的第二、三之间',
        keyHint:'A 在三个黑键的第二、三之间，G 的右边',
        posHint:'A 在高音谱号的第二间',
        clefHint:'A 在高音谱号的第二间' },
  /* 中央 C 的另一种写法：低音谱号的上加一线。音高同 C4，只给第 3 关
     「用哪个谱号」用。它在谱表上方，按惯例符杆朝下，用 stem 覆盖 hand。 */
  C4B:{ id:'C4B', letter:'C', label:'中央 C', midi:60, clef:'bass', y:-1, hand:'R', finger:1, stem:'down',
        stage:0, landmark:'两个黑键的左边',
        keyHint:'C 是两个黑键左边的白键，也是中央 C',
        posHint:'中央 C 在低音谱号的上加一线',
        clefHint:'中央 C 也可以写在低音谱号的上加一线上' }
};

/* 音符队列。数组顺序就是学习顺序，首页 chips 也按它排。
   加音只改这里和 NOTES；SKILLS 会自动按进度把新音收进对应的练习。 */
const NOTE_ORDER = ['B3','C4','D4','E4','F4','G4'];
/* 一开始就会的三个音，不经过新音导入。 */
const BASE_NOTES = ['B3','C4','D4'];
/* 第 3 关的固定音池。它不跟音集扩：F、G、A 都是高音谱号，
   扩进去只会让题目退化成「是不是 B3」。 */
const CLEF_POOL = ['B3','C4','C4B','D4'];

/* 每个音名在第 1 关的权重。C、B 是两个锚点，出现得多一点；
   其余音平均。找不到的音名按 1 计。 */
const LETTER_WEIGHT = { B:4, C:4, D:2, E:2, F:2, G:2, A:2 };
/* 需要加线的音登记在这里：{ 谱号: { 音 id: 加线的 y 位置 } }。
   中央 C 有两种写法：高音谱号下加一线（y=5）、低音谱号上加一线（y=-1）。
   漏登记的表现是：音符漂浮在谱表外，没有那条短横线。 */
const LEDGER = { treble: { C4: 5 }, bass: { C4B: -1 } };

/* 四种时值。beats 是拍数，也是判题依据；
   filled / stem / dot 描述符头要不要实心、有没有符杆、有没有附点，
   staffSVG 按这三个开关画形状，所以加新时值不用改绘图代码。 */
const VALUES = {
  quarter: { id:'quarter', beats:1, name:'四分音符',   filled:true,  stem:true,  dot:false },
  half:    { id:'half',    beats:2, name:'二分音符',   filled:false, stem:true,  dot:false },
  dotted:  { id:'dotted',  beats:3, name:'附点二分音符', filled:false, stem:true,  dot:true  },
  whole:   { id:'whole',   beats:4, name:'全音符',     filled:false, stem:false, dot:false }
};
const VALUE_IDS = ['quarter','half','dotted','whole'];

/* ---------------------------------------------------------------------
   配置层之二：技能注册表。

   一条技能就是首页的一张卡，也是 buildQuestions 的一个分支。
   字段：
     id      关卡编号（1–6），也是星星的存档键，不能随便改
     key     内部名，调试和注释用
     name    顶栏显示的名字
     title   首页卡片标题
     desc    首页卡片说明
     color   卡片编号底色
     needs   这个练习要求音符已经打开哪些标记：
               key  任意八度能认键
               pos  谱面位置与具体八度对得上
               fin  手与指法
     pool    'active' 从已学音里取；'fixed' 用 ids 固定清单；
             'none' 不用音
     ids     pool 为 'fixed' 时的固定音池
     make    出题函数，签名 (ids, n) → 题目数组
     count   可选，覆盖题量；不写就用 DIFFS.count

   加一种新练习（音程、和弦、节奏型、听辨）只加一条：
   写好 make，再声明 needs 和 pool。出题流程不用改。
   首页只渲染 SKILLS，所以菜单长度不会随音集长大。 */
const SKILLS = [
  { id:1, key:'findKey',  name:'找键盘', title:'键盘上的位置',
    desc:'音名对应哪个键', color:'#3C7DD9',

    desc:'低音谱号与高音谱号', color:'#E08A2E',
    needs:['key','pos'], pool:'active', make:makeStaffKey },
  { id:3, key:'clef',     name:'谱号',   title:'用哪个谱号',
    desc:'同一个中央 C，有高音、低音两种写法', color:'#2E9C8F',
    needs:['pos'], pool:'fixed', ids:CLEF_POOL, make:makeClef },
  { id:4, key:'beats',    name:'时值',   title:'读谱与拍数',
    desc:'读谱、找键、弹够时值', color:'#3FA96F',
    needs:['key','pos'], pool:'active', make:makeBeats },
  { id:5, key:'play',     name:'读谱',   title:'手、指与拍数',
    desc:'先判手和指，再按住弹够时值', color:'#8E5AA8',
    needs:['key','pos','fin'], pool:'active', make:makePlay,
    count:function(n){ return Math.max(4, n - 2); } },
  { id:6, key:'spot',     name:'线与间', title:'五线谱的线与间',
    desc:'从下往上数，指出第几条线、第几间', color:'#C2543F',

/* ---------------------------------------------------------------------
   配置层之三：新音导入。

   新音不是第 7、8、9 关，而是一段临时流程。八个步骤分成两次练习，
   每次四步；走完就把这个音的三个标记打开，它自动进入上面六种技能。
   顺序对应「先在键盘上认，再在谱面上认，再连指法，最后混合」：
     0 局部键盘：只看 C4 到新音这几个白键，先看清黑键地标
     1 完整键盘：任意八度，只认字母
     2 完整键盘：具体音高，连接谱面
     3 谱面 → 键盘
     4 键盘 → 谱面
     5 手、指、按住
     6 与邻居混合：谱面 → 键盘
     7 与邻居混合：键盘 → 谱面

   每一步都是一个出题函数，返回一道题。加新音不用改这里；
   只有出现「换手位」这种新知识时，才需要加一种步骤。 */
const SPOT_STEPS = [
  /* 0 局部键盘。start 7 是 C4 的白键序号，count 从 C4 数到新音。
     intro 让题目把 landmark 说出来一次，作为地标示范。 */
  function(noteId){
    const r = localKeyboardRange(noteId);
    return qKeyboardFind(noteId, { start:r.start, count:r.count, intro:true });
  },
  /* 1 完整键盘，任意八度。复用第 1 关的 qFindKey：它只比字母。 */
  function(noteId){ return qFindKey(NOTES[noteId].letter); },
  /* 2 完整键盘，具体音高。这里必须点中新音本身，不能再点别的八度。 */
  function(noteId){ return qKeyboardFind(noteId, { start:0, count:15 }); },
  /* 3 谱面 → 键盘。 */
  function(noteId){ return qStaffToKey(noteId, 'quarter', NOTES[noteId].posHint); },
  /* 4 键盘 → 谱面，选项限制在新音和已学邻居之间。 */
  function(noteId){ return qKeyToStaff(noteId, spotlightPool(noteId)); },
  /* 5 手、指、按住。时值只用四分，导入阶段不考时值。 */
  function(noteId){ return qPlayNote(noteId, 'quarter'); },
  /* 6 混合：谱面 → 键盘，从新音和邻居里抽。 */
  function(noteId){
    const id = pick(spotlightPool(noteId));
    return qStaffToKey(id, 'quarter', NOTES[id].posHint);
  },
  /* 7 混合：键盘 → 谱面，从新音和邻居里抽。 */
  function(noteId){
    const pool = spotlightPool(noteId);
    return qKeyToStaff(pick(pool), pool);
  }
];
const SPOT_STEP_COUNT = SPOT_STEPS.length;   // 8
const SPOT_PER_SESSION = 4;                   // 每次练习走四步

/* 白键序号：C3 = 0，C4 = 7，E4 = 9。局部键盘和「新音在哪个八度」
   都靠它算，不用把每个音的键位手写一遍。 */
function whiteKeyIndex(midi){
  const oct = Math.floor(midi / 12) - 1;
  const deg = ['C','D','E','F','G','A','B'].indexOf(letterOf(midi));
  return oct * 7 + deg - 21;
}

/* 新音第一次出现时用的小键盘。范围要刚好把它的黑键组完整露出来：
     C4、D4、E4 在两个黑键组里，用 C4–E4（三个白键、两个黑键）；
     F4、G4、A4、B4 在三个黑键组里，用 F4–B4（四个白键、三个黑键）。
   如果 F 也用 C4–F4，键盘上只看得到两个黑键，题干却说「三个黑键的
   左边」，孩子找不到地标。所以这里按组取范围，不按「从 C4 到新音」。 */
function localKeyboardRange(noteId){
  const key = whiteKeyIndex(NOTES[noteId].midi);
  /* F4 = 10，B4 = 13：三个黑键组的四个白键。 */
  if(key >= 10 && key <= 13){
    return { start:10, count:4 };
  }
  /* 两个黑键组：C4 = 7，到新音为止，至少三个白键。 */
  return { start:7, count:Math.max(3, key - 7 + 1) };
}

/* 新音的对比组：它自己和已经学过的左右邻居。
   还没学的邻居先不放进来，免得在导入阶段考到没教过的音。 */
function spotlightPool(noteId){
  const i = NOTE_ORDER.indexOf(noteId);
  const learned = activeNotes(['key','pos']);
  const out = [noteId];
  [i - 1, i + 1].forEach(function(j){
    const id = NOTE_ORDER[j];
    if(id && learned.indexOf(id) >= 0 && out.indexOf(id) < 0) out.push(id);
  });
  return out;
}

/* 三档难度。options 是选项个数（按题型取值：时值题最多 4 个，谱例最多 3 张，
   第 5 关的指法题最多 5 只），hintAfter 是错几次给提示，
   bpm 决定「按住」时一拍有多长，count 是一关几题
   （第 5 关每题三段取 count - 2；新音导入每次固定四步）。 */
const DIFFS = {
  easy:   { key:'easy',   name:'轻松', options:2, hintAfter:1, bpm:52, count:8  },
  normal: { key:'normal', name:'标准', options:3, hintAfter:2, bpm:60, count:8  },
  hard:   { key:'hard',   name:'挑战', options:3, hintAfter:3, bpm:76, count:10 }
};

/* ==================== 设置与存档 ==================== */
/* 存档键名故意保留旧名 bcd-piano-game-v2，没有跟着游戏一起改名：
   改了就等于清空孩子已经拿到的星星。要迁移得先读旧键再写新键。 */
const STORE_KEY = 'bcd-piano-game-v2';
function loadStore(){
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch(e){ return {}; }
}
const S = Object.assign({ sound:true, speech:true, labels:false, decor:null, difficulty:'normal', stars:{} }, loadStore());
function saveStore(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch(e){}
}
/* 2026-10-30 在第二关和第三关之间插了一关「谱号」，原来的 3、4 关
   变成 4、5 关。星星按关卡编号存，这里把旧编号整体往后挪一次；
   layout 标记防止每次打开都挪一遍。新插进来的第 3 关从 0 星开始。 */
if(S.layout !== 2){
  const old = S.stars || {};
  S.stars = { 1: old[1] || 0, 2: old[2] || 0, 4: old[3] || 0, 5: old[4] || 0 };
  S.layout = 2;
  saveStore();
}

/* ---------------------------------------------------------------------
   学习进度：每个音三个标记。

   key  任意八度能认键
   pos  谱面位置、谱号、具体八度都对得上
   fin  知道用哪只手、哪根手指

   三个标记都由新音导入逐段打开，不是一次性全给。这样孩子不会在
   还没学的关卡里突然遇到新音，也不会因为学过一个音就跳过另外两个。
   标记存在 S 里，和星星一样只在这台设备上。 */
function blankProgress(){
  const p = {};
  NOTE_ORDER.forEach(function(id){ p[id] = { key:0, pos:0, fin:0 }; });
  BASE_NOTES.forEach(function(id){ p[id] = { key:1, pos:1, fin:1 }; });
  return p;
}

function ensureProgress(){
  if(!S.progress) S.progress = blankProgress();
  NOTE_ORDER.forEach(function(id){
    if(!S.progress[id]) S.progress[id] = { key:0, pos:0, fin:0 };
  });
  /* 基础的三个音永远是已学状态；即使旧存档里没有这一项，
     也不会让孩子回头重学 B、C、D。 */
  BASE_NOTES.forEach(function(id){
    S.progress[id] = { key:1, pos:1, fin:1 };
  });
  /* 旧版第 7 关就是 E 的完整一课。如果孩子已经打过这一关，
     把 E 的三个标记补上，不让她重学一遍。 */
  if(S.stars && S.stars[7] && S.progress.E4 && !S.progress.E4.key){
    S.progress.E4 = { key:1, pos:1, fin:1 };
  }
  /* S.spot 三态：undefined = 还没建过；对象 = 导入进行到第几步；
     null = 当前新音已经学完。只有 undefined 才初始化。 */
  if(S.spot === undefined) S.spot = { note:'E4', step:0 };
  if(noteComplete('E4') && (!S.spot || S.spot.note === 'E4')) S.spot = null;
  if(!S.focus || !NOTES[S.focus]) S.focus = 'E4';
  if(!S.lastSeen) S.lastSeen = {};
}

/* 已经打开某些标记的音。SKILLS 的 needs 直接传给这里：
   needs:['key','pos'] 就只收键位和谱位都学过的音。 */
function activeNotes(needs){
  needs = needs || ['key'];
  return NOTE_ORDER.filter(function(id){
    const p = S.progress[id];
    return !!(p && needs.every(function(k){ return !!p[k]; }));
  });
}

function noteComplete(id){
  const p = S.progress[id];
  return !!(p && p.key && p.pos && p.fin);
}

/* 当前新音：S.spot 指向的音。学完返回 null。
   注意它和 S.focus 不是一回事：focus 是「现在学到哪」，
   spot 是「还有没有导入步骤没走完」。 */
function currentSpotlight(){
  /* 正常情况下看 S.spot；如果它被清空、但 focus 还没学完，
     退回 focus，保证「我的音」里脉动的那个音点进去一定能练。 */
  if(S.spot && S.spot.note && NOTES[S.spot.note] && !noteComplete(S.spot.note)) return S.spot.note;
  if(S.focus && NOTES[S.focus] && !noteComplete(S.focus)) return S.focus;
  return null;
}

/* 下一个可以学的音。到队尾返回 null。 */
function nextNoteId(){
  const i = NOTE_ORDER.indexOf(S.focus);
  return (i >= 0 && i + 1 < NOTE_ORDER.length) ? NOTE_ORDER[i + 1] : null;
}

/* 最久没练的几个音。复习块和每日练习用它轮换，
   这样音集长大以后，单次练习仍然只覆盖四五个音。 */
function staleNotes(ids, n){
  return ids.slice().sort(function(a, b){
    return (S.lastSeen[a] || 0) - (S.lastSeen[b] || 0);
  }).slice(0, n);
}

/* 题目出现时记一下这个音最近被看到的时间。
   只用于轮换，不参与判对错，所以放在 renderQuestion 里。 */
function markSeen(id){
  if(!id) return;
  S.lastSeen[id] = Date.now();
}

function diff(){ return DIFFS[S.difficulty] || DIFFS.normal; }

/* 节日装饰默认只在万圣节前后打开；S.decor 一旦被手动设置，
   就按设置走，不再看日期。 */
function isHalloweenSeason(){
  const d = new Date();
  const m = d.getMonth(), day = d.getDate();
  return (m === 9 && day >= 10) || (m === 10 && day <= 2);
}
function decorOn(){
  return (S.decor === null) ? isHalloweenSeason() : !!S.decor;
}

function applyDecor(){
  const on = decorOn();
  document.body.classList.toggle('halloween', on);
  const t = $('#homeTitle');
  if(t) t.textContent = on ? '🎃 识谱小练习 🎃' : '识谱小练习';
}

/* ==================== 声音 ====================
   全部用 Web Audio 实时合成，页面里没有音频文件。
   iOS 要求第一次发声必须发生在用户手势里，所以 init 时挂了一个
   一次性 pointerdown 把 AudioContext 唤醒（见文件末尾）。
   iPad 侧边静音开关会同时静音 Web Audio，听不到先看那个开关。 */
let AC = null;
function audioCtx(){
  if(!AC){
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return null;
    AC = new Ctor();
  }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
/* ==================== 钢琴音色 ====================
   页面里仍然没有音频文件：用加法合成做钢琴音色。
   每个泛音的频率都是基频的整数倍，基频
     f = 440 * 2^((midi - 69) / 12)
   就是 MIDI 对应的十二平均律频率，所以换音色不会改变音高，
   也不会出现采样移调带来的几个音分偏差。

   像钢琴的地方主要在泛音的衰减：高次泛音比基频衰减得快，
   起音亮、余音渐暗；再叠一下很短的击弦噪声，听感是「敲」出来的。
   每个泛音的生命周期：
     起音 4-12ms → 落到 55%（击弦后的第一段衰减）
     6 秒内收到 32% 并保持（按住四个拍也还有声）
   松键由 stop() 统一淡出；短音用 o.dur 预约收尾，
   像松键后止音器落下。 */
/* 一个很轻的房间混响：用程序生成的脉冲响应，不需要音频文件。
   所有琴音共用一条，只加一点点湿度，免得干合成的「电子味」。
   脉冲是 0.8 秒的衰减噪声。 */
let REVERB = null;
function roomReverb(c){
  if(REVERB) return REVERB;
  try{
    const sr = c.sampleRate;
    const len = Math.floor(sr * 0.8);
    const buf = c.createBuffer(2, len, sr);
    for(let ch = 0; ch < 2; ch++){
      const d = buf.getChannelData(ch);
      for(let i = 0; i < len; i++){
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.8);
      }
    }
    const conv = c.createConvolver();
    conv.buffer = buf;
    const wet = c.createGain();
    wet.gain.value = 0.1;
    conv.connect(wet); wet.connect(c.destination);
    REVERB = conv;
  }catch(e){ REVERB = null; }
  return REVERB;
}

/* 一小段噪声，用于击弦（起音）和止音（松键）。
   kind = 'hammer' 时亮一些，'damper' 时闷一些。 */
function noiseBurst(c, at, out, kind){
  try{
    const sr = c.sampleRate;
    const dur = (kind === 'damper') ? 0.03 : 0.024;
    const len = Math.max(1, Math.floor(sr * dur));
    const buf = c.createBuffer(1, len, sr);
    const d = buf.getChannelData(0);
    for(let i = 0; i < len; i++){
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, (kind === 'damper') ? 2 : 3);
    }
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter();
    if(kind === 'damper'){
      f.type = 'bandpass'; f.frequency.value = 1300; f.Q.value = 0.9;
    }else{
      f.type = 'lowpass'; f.frequency.value = 2600;
    }
    const g = c.createGain();
    g.gain.value = (kind === 'damper') ? 0.05 : 0.13;
    src.connect(f); f.connect(g); g.connect(out);
    src.start(at); src.stop(at + dur + 0.01);
  }catch(e){}
}

function pianoVoice(midi, o){
  o = o || {};
  const c = audioCtx(); if(!c) return null;
  const f0 = 440 * Math.pow(2, (midi - 69) / 12);
  const t = c.currentTime + 0.006;
  const vol = (o.vol == null) ? 0.4 : o.vol;
  const out = c.createGain();
  out.gain.setValueAtTime(vol, t);
  out.connect(c.destination);
  const rev = roomReverb(c);
  if(rev){ try { out.connect(rev); } catch(e){} }

  /* 低音：衰减慢、泛音多；高音：衰减快、泛音少。
     这个系数只改衰减和相对音量，基频始终是等分音。 */
  const low = Math.max(0, Math.min(1, (72 - midi) / 30));
  const tau0 = 3.2 + 3.6 * low;             // 基频衰减时间常数（秒）
  const B = 0.0004;                          // 轻微非谐性：真实钢琴的高次泛音偏亮
  const dark = 0.5 + 0.5 * low;              // 高音泛音少
  const oscs = [];

  for(let n = 1; n <= 12; n++){
    const amp = Math.pow(n, -1.25) * (n === 1 ? 1 : dark);
    if(amp < 0.0035) continue;
    /* 非谐性让第 n 个泛音略高；n=1 时公式为 1，基频不被拉高 */
    const fn = n * f0 * Math.sqrt(1 + B * (n * n - 1));
    const tau = tau0 / (1 + 0.25 * (n - 1));
    /* 每根弦拆成两根，各偏 ±0.35 音分：平均值正好是等分音。
       偏得再大就会在按住的三四拍里听到一次明显的音量起伏，
       所以只留一点点缓慢的拍频，给余音一点「活气」。 */
    for(let k = 0; k < 2; k++){
      const cents = (k === 0) ? -0.35 : 0.35;
      const osc = c.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = fn * Math.pow(2, cents / 1200);
      const g = c.createGain();
      const peak = amp * (k === 0 ? 0.52 : 0.48) * 0.72;
      const tk = tau * (k === 0 ? 1.04 : 0.96);
      const atk = t + 0.003 + n * 0.0006 + k * 0.0015;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), atk);
      /* 两段衰减：击弦后 60ms 先掉到六成（这一下是「敲」的味道），
         然后一路指数衰减，没有稳态平台——按住三四拍是钢琴的自然余音。 */
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak * 0.6), atk + 0.06);
      g.gain.setTargetAtTime(0.0001, atk + 0.06, tk);
      osc.connect(g); g.connect(out);
      osc.start(t);
      osc.stop(t + 14);                 /* 安全兜底；正常由 stop() 提前结束 */
      oscs.push(osc);
    }
  }

  /* 击弦噪声：起音的一点木头声 */
  noiseBurst(c, t, out, 'hammer');

  /* 短音：预约在 dur 处淡出，像松键 */
  if(o.dur){
    const end = t + o.dur;
    out.gain.setValueAtTime(vol, end);
    out.gain.exponentialRampToValueAtTime(0.0004, end + 0.16);
    noiseBurst(c, end, out, 'damper');
    oscs.forEach(function(osc){ try { osc.stop(end + 0.22); } catch(e){} });
  }

  let stopped = false;
  return {
    stop: function(fade){
      if(stopped) return;
      stopped = true;
      const now = c.currentTime;
      const d = (fade == null) ? 0.12 : fade;
      noiseBurst(c, now, out, 'damper');
      out.gain.cancelScheduledValues(now);
      out.gain.setValueAtTime(vol, now);
      out.gain.exponentialRampToValueAtTime(0.0004, now + d);
      oscs.forEach(function(osc){ try { osc.stop(now + d + 0.05); } catch(e){} });
    }
  };
}

/* force 只在「试听」按钮里用：即使孩子把琴声关掉了，也要能试出声。 */
function playMidi(midi, dur, vol, force){
  if(!S.sound && !force) return;
  pianoVoice(midi, { dur: dur || 0.9, vol: (vol == null) ? 0.4 : vol });
}

/* 起一个持续音，返回 { stop(fade) }。
   「按住」关用它：音要一直响到松手，所以不预约收尾，由调用方淡出。
   所有还在响的长音都登记在 LIVE 里，切屏或换题时统一停掉，
   否则孩子按住键点「←」离开，琴音会一直留在首页。 */
const LIVE = new Set();
function stopAllTones(){
  LIVE.forEach(function(t){ t.stop(0.08); });
  LIVE.clear();
}
function startTone(midi){
  if(!S.sound) return null;
  const v = pianoVoice(midi, { vol: 0.4 });
  if(!v) return null;
  const handle = {
    stop: function(fade){
      if(!LIVE.has(handle)) return;
      LIVE.delete(handle);
      v.stop(fade);
    }
  };
  LIVE.add(handle);
  return handle;
}

/* 一拍一下的提示音。只用来给「按住」数拍子，
   音量很小，不盖住持续音。 */
function clickSound(){
  if(!S.sound) return;
  const c = audioCtx(); if(!c) return;
  const t = c.currentTime;
  const o = c.createOscillator(); o.type = 'square'; o.frequency.value = 1320;
  const g = c.createGain();
  g.gain.setValueAtTime(0.07, t);
  g.gain.exponentialRampToValueAtTime(0.0004, t + 0.05);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + 0.06);
}

/* ==================== 语音 ====================
   题目用系统语音念出来，孩子不识字也能独立玩。
   难点在混读：中文句子要用中文声音，「B / C / D」要按字母本音读，
   所以 say() 把字符串按单个拉丁字母切开，逐段设置 lang 和 voice。
   没有对应语音包时静默失败，只显示文字，不影响答题。

   两个必须处理的细节：
   1. 单个大写字母交给系统念，苹果的英文声音会念成「capital B」。
      孩子听到的是「大写字母 B」，不是音名。所以字母先换成
      同音的英文拼写（B → bee、C → see），再交给英文声音。
   2. 「弹」是多音字，系统默认读 dàn。屏幕上保留「弹」，
      只在送去朗读的副本里换成同音的「谈」，读成 tán。
   两处都只改朗读用的字符串，不改页面显示。 */
const LETTER_SAY = { a:'ay', b:'bee', c:'see', d:'dee', e:'ee', f:'eff', g:'jee' };
const SAY_FIX = [[/弹/g, '谈']];
let zhVoice = null;
let enVoice = null;
/* 英文声音的偏好顺序：这些名字在各平台上读字母最干净，
   找不到就退回任意 en-US，再退到任意 en。 */
const EN_PREFER = ['Samantha','Ava','Allison','Kathy','Karen','Moira','Tessa','Serena','Fiona','Zira','Aria','Google US English'];
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices() || [];
  zhVoice = vs.filter(function(v){ return /^zh[-_]CN/i.test(v.lang); })[0]
         || vs.filter(function(v){ return /^zh/i.test(v.lang); })[0] || null;
  const ens = vs.filter(function(v){ return /^en/i.test(v.lang); });
  enVoice = ens.filter(function(v){
    return EN_PREFER.some(function(name){ return v.name.indexOf(name) >= 0; });
  })[0] || ens.filter(function(v){ return /^en[-_]US/i.test(v.lang); })[0] || ens[0] || null;
}
if('speechSynthesis' in window){
  loadVoices();
  if(speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', loadVoices);
}
/* force 同上：试听时不管「语音念题」开关，直接念一句。 */
/* 依次念的序号：每次 say 换一个新号，旧句子的 onend 回调就不再往下念。
   否则退出关卡后，没念完的句子还会继续排队念下去。 */
let saySeq = 0;

function say(text, force){
  if((!S.speech && !force) || !text || !('speechSynthesis' in window)) return;
  if(!enVoice || !zhVoice) loadVoices();
  let line = String(text);
  SAY_FIX.forEach(function(p){ line = line.replace(p[0], p[1]); });
  /* 捕获组切开：'找到 C' → ['找到 ', 'C']。
     单个字母走英文声音，其余整段走中文声音。 */
  const parts = line.split(/([A-Za-z])/).filter(function(s){ return s.length; });
  const items = parts.map(function(part){
    const isLetter = /^[A-Za-z]$/.test(part);
    const spoken = isLetter ? (LETTER_SAY[part.toLowerCase()] || part) : part;
    const u = new SpeechSynthesisUtterance(spoken);
    u.lang = isLetter ? 'en-US' : 'zh-CN';
    u.rate = isLetter ? 0.85 : 0.95;
    u.pitch = 1.02;
    /* 念题只是提示，不要盖过琴声：语音 0.6，钢琴音量已相应调高（见 playMidi）。 */
    u.volume = 0.6;
    if(isLetter && enVoice) u.voice = enVoice;
    if(!isLetter && zhVoice) u.voice = zhVoice;
    return u;
  });
  const seq = ++saySeq;
  try{
    const wasBusy = speechSynthesis.speaking || speechSynthesis.pending;
    if(wasBusy) speechSynthesis.cancel();
    let i = 0;
    /* 一句念完再排下一句。把三句一次性塞进队列时，iOS 上换语种的
       那一句偶尔会被吞掉，整段题干就不响了。 */
    function next(){
      if(seq !== saySeq || i >= items.length) return;
      const u = items[i++];
      let done = false;
      let guard = null;
      function advance(){
        if(done) return;
        done = true;
        if(guard) clearTimeout(guard);
        next();
      }
      /* onend 偶尔不触发，用一个按字数估的兜底计时器接着往下走。 */
      guard = setTimeout(advance, 2500 + u.text.length * 160);
      u.onend = advance;
      u.onerror = advance;
      speechSynthesis.speak(u);
    }
    /* iOS 上 cancel 之后紧接着 speak，第一句容易被吞，先让出一点时间。 */
    setTimeout(next, wasBusy ? 90 : 0);
  }catch(e){}
}
function stopSay(){
  saySeq++;
  try { if('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e){}
}
