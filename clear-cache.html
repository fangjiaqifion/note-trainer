<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>清理缓存 · 识谱小练习</title>
<style>
  :root{--ink:#3A2E22;--muted:#8A7A67;--line:#EADCC8;--paper:#FFF7EC;--blue:#3C7DD9;--green:#3FA96F}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding:24px}
  main{width:min(520px,100%);background:#fff;border:2px solid var(--line);border-radius:24px;padding:28px 26px;
       box-shadow:0 10px 30px rgba(80,55,20,.08);text-align:center}
  h1{margin:0 0 6px;font-size:22px}
  p{margin:0 0 14px;color:var(--muted);font-size:14px}
  ul{margin:0 0 18px;padding:0;list-style:none;text-align:left;font-size:14px}
  li{padding:7px 0;border-top:1px solid #F3EADC;display:flex;gap:8px}
  li:first-child{border-top:0}
  .ok{color:var(--green);font-weight:700;flex:none}
  .warn{color:#C2543F;font-weight:700;flex:none}
  a.btn{display:inline-block;margin-top:4px;padding:13px 26px;border-radius:16px;background:var(--blue);color:#fff;
        text-decoration:none;font-weight:700}
  .small{font-size:12px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<main>
  <h1>正在清理这个游戏的缓存…</h1>
  <p>只清识谱小练习的离线缓存和页面缓存。学生账户、勾选、进度和答题记录（localStorage）不会动。</p>
  <ul id="log"><li><span class="ok">…</span><span>检查离线缓存服务</span></li></ul>
  <a class="btn" id="next" href="./index.html">打开游戏</a>
  <p class="small">远程和本地是两个不同的地址，各清一次才干净。</p>
</main>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var rawNext = params.get('next') || './index.html';
  var next = './index.html';
  try{
    var parsed = new URL(rawNext, location.href);
    if(parsed.origin === location.origin) next = parsed.pathname + parsed.search + parsed.hash;
  }catch(e){}
  var stay = params.get('stay') === '1';
  var token = params.get('token') || '';
  var expected = params.get('build') || '';
  var actualBuild = '';
  var launch = params.get('launch') === '1';
  var failed = false;
  var log = document.getElementById('log');
  var link = document.getElementById('next');
  link.href = next;

  function row(ok, text){
    if(!ok) failed = true;
    var li = document.createElement('li');
    var mark = document.createElement('span');
    mark.className = ok ? 'ok' : 'warn';
    mark.textContent = ok ? '✓' : '!';
    var span = document.createElement('span');
    span.textContent = text;
    li.appendChild(mark);
    li.appendChild(span);
    log.appendChild(li);
  }

  function baseScope(){
    return new URL('./', location.href).href;
  }

  /* 只动这个游戏的缓存：服务员的 scope 必须等于当前目录，
     缓存名必须以 note-trainer- 开头。同一个 GitHub Pages 域名下
     可能还有别的项目，不能把它们的离线缓存一起删掉。 */
  async function clearServiceWorkers(){
    if(!('serviceWorker' in navigator)) return;
    var base = baseScope();
    var regs = await navigator.serviceWorker.getRegistrations();
    var mine = regs.filter(function(reg){
      return reg.scope === base;
    });
    await Promise.all(mine.map(function(reg){ return reg.unregister(); }));
    row(true, mine.length ? '已注销 ' + mine.length + ' 个离线缓存服务' : '没有需要注销的离线缓存服务');
  }

  async function clearCaches(){
    if(!('caches' in window)) return;
    var keys = await caches.keys();
    var mine = keys.filter(function(k){
      return k.indexOf('note-trainer-') === 0 && (k.indexOf('@') < 0 || k.endsWith('@' + baseScope()));
    });
    await Promise.all(mine.map(function(k){ return caches.delete(k); }));
    row(true, mine.length ? '已删除 ' + mine.length + ' 个离线缓存库' : '没有需要删除的离线缓存库');
  }

  async function refreshShell(){
    async function download(file, bust){
      var url = new URL(file, location.href);
      if(bust) url.searchParams.set('nt_reset', token || Date.now());
      var response = await fetch(url, {cache:'reload',credentials:'same-origin',
        headers:{'X-Note-Trainer-Reset':'1'},signal:AbortSignal.timeout(12000)});
      if(!response.ok) throw new Error(file + ': HTTP ' + response.status);
      return response;
    }
    var manifest = await (await download('./release.json',true)).json();
    var required = ['index.html','sw.js','clear-cache.html','manifest.webmanifest','icon.svg','icon-180.png','icon-192.png','icon-512.png'];
    if(manifest.schema !== 1 || !/^[a-f0-9]{10}$/.test(manifest.build) ||
       !required.every(function(file){ return /^[a-f0-9]{64}$/.test((manifest.files || {})[file] || ''); }))
      throw new Error('发布清单不完整');
    actualBuild = manifest.build;
    if(expected && expected !== actualBuild) throw new Error('请求构建 ' + expected + '，服务器仍是 ' + actualBuild);
    if(!crypto.subtle) throw new Error('需要 HTTPS 或 localhost 才能核验文件');
    for(var file of required){
      var bytes = await (await download('./' + file,false)).arrayBuffer();
      var digest = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)))
        .map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
      if(digest !== manifest.files[file]) throw new Error(file + ' 哈希不一致，服务器或缓存尚未更新');
    }
    row(true, '已核验全部发布文件，构建 ' + actualBuild);
    var game = new URL('./index.html',location.href);
    game.searchParams.set('build',actualBuild);
    game.searchParams.set('verify',token);
    if(params.get('callback')) game.searchParams.set('callback',params.get('callback'));
    if(launch) next = game.href;
    link.href = next;
  }

  var step = '';
  async function bounded(promise, ms){
    var timer;
    try{return await Promise.race([promise,new Promise(function(_,reject){
      timer=setTimeout(function(){reject(new Error(step + ' 超时'));},ms);
    })]);}finally{clearTimeout(timer);}
  }
  (async function(){
    try{
      step='service-worker';await bounded(clearServiceWorkers(),8000);
      step='cache-storage';await bounded(clearCaches(),8000);
      step='release-files';await bounded(refreshShell(),25000);
      // 注销不等于当前页面立即脱离旧控制器，最后再清一次。
      step='final-cache-storage';await bounded(clearCaches(),8000);
    }catch(e){row(false,'清理未完成：' + e.message);}
    row(true, '账户、勾选、进度和答题记录都保留了');
    document.querySelector('h1').textContent = failed ? '缓存清理未完成' : '缓存已清理';
    document.title = 'note-trainer-cache:' + (failed ? 'failed:' : 'ok:') + token;
    document.documentElement.dataset.cacheStatus = failed ? 'failed' : 'ok';
    if(failed && params.get('callback')){
      try{
        var callback=new URL(params.get('callback'));
        if(callback.protocol === 'http:' && ['127.0.0.1','localhost'].includes(callback.hostname) &&
           /^\/__release\/receipt\/[a-f0-9]{48}$/.test(callback.pathname)){
          callback.searchParams.set('build',expected || actualBuild);
          callback.searchParams.set('status','failed');
          callback.searchParams.set('stage',step);
          location.replace(callback.href);
        }
      }catch(e){}
    }
    if((launch || !stay) && !failed){
      setTimeout(function(){ location.replace(next); }, 1200);
    }
  })();
})();
</script>
</body>
</html>
